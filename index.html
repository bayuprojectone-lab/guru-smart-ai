function showToast(msg, type) {

    var bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
    t.className = 'fixed bottom-5 right-5 z-[60] ' + bg + ' text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 fade-in';
    t.replaceChildren(document.createTextNode(String(msg ?? '')));
    t.classList.remove('hidden');
    clearTimeout(t._hideTimer);

}

async function subjectForm(id){var s=null;if(id){s=(await DB.get('subjects')).find(function(x){return x.id===id;});}openModal('Tambah Mapel','<form id="subjectForm" class="space-y-4"><div><label class="block text-sm mb-1">Kode</label><input type="text" id="sub_code" value="'+(s?.code||'')+'" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Nama Mapel</label><input type="text" id="sub_name" value="'+(s?.name||'')+'" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Guru Pengampu</label><input type="text" id="sub_teacher" value="'+(s?.teacher||'')+'" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">KKM</label><input type="number" id="sub_kkm" value="'+(s?.kkm||75)+'" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Simpan</button></form>');document.getElementById('subjectForm').onsubmit=async function(e){e.preventDefault();var p={code:document.getElementById('sub_code').value,name:document.getElementById('sub_name').value,teacher:document.getElementById('sub_teacher').value,kkm:parseInt(document.getElementById('sub_kkm').value)};await saveData('subjects',p,id);closeModal();renderSubjects();};}
async function saveData(key,data,id){var result=null;if(id){result=await DB.update(key,id,data);}else{result=await DB.insert(key,data);}if(result){showToast('Data disimpan!','success');return true;}return false;}
async function deleteData(key,id,callback){if(confirm('Hapus data?')){await DB.remove(key,id);if(typeof callback==='function')callback();}}

async function renderSchedules(){var sc=await DB.get('schedules');var days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];document.getElementById('content').innerHTML='<div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><div class="flex justify-between mb-4"><h3 class="font-semibold text-slate-800 dark:text-white">Jadwal Pelajaran</h3><button onclick="scheduleForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Tambah Jadwal</button></div><div class="overflow-x-auto"><table class="w-full text-sm text-left border-collapse"><thead class="bg-slate-50 dark:bg-slate-700"><tr><th class="px-4 py-3 border dark:border-slate-600">Jam</th>'+days.map(function(d){return '<th class="px-4 py-3 border dark:border-slate-600">'+d+'</th>';}).join('')+'</tr></thead><tbody>'+['07:30-09:00','09:15-10:45','11:00-12:30'].map(function(time){return '<tr><td class="px-4 py-3 border dark:border-slate-600 font-medium">'+time+'</td>'+days.map(function(day){var s=sc.find(function(x){return x.day===day&&x.start_time===time.split('-')[0];});return '<td class="px-4 py-3 border dark:border-slate-600 text-xs">'+(s?s.subject+'<br><span class="text-blue-500">'+s.teacher+'</span>':'-')+'</td>';}).join('')+'</tr>';}).join('')+'</tbody></table></div></div>';}
async function scheduleForm(id){var cl=await DB.get('classes');openModal('Tambah Jadwal','<form id="scheduleForm" class="space-y-4"><div><label class="block text-sm mb-1">Hari</label><select id="sc_day" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"><option>Senin</option><option>Selasa</option><option>Rabu</option><option>Kamis</option><option>Jumat</option></select></div><div><label class="block text-sm mb-1">Jam Mulai</label><input type="text" id="sc_start" value="07:30" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Jam Selesai</label><input type="text" id="sc_end" value="09:00" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Kelas</label><select id="sc_class" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white">'+cl.map(function(c){return '<option value="'+c.id+'">'+c.name+'</option>';}).join('')+'</select></div><div><label class="block text-sm mb-1">Mapel</label><input type="text" id="sc_subject" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Guru</label><input type="text" id="sc_teacher" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Simpan</button></form>');document.getElementById('scheduleForm').onsubmit=async function(e){e.preventDefault();var p={day:document.getElementById('sc_day').value,start_time:document.getElementById('sc_start').value,end_time:document.getElementById('sc_end').value,class_id:document.getElementById('sc_class').value,subject:document.getElementById('sc_subject').value,teacher:document.getElementById('sc_teacher').value};await saveData('schedules',p,id);closeModal();renderSchedules();};}

async function renderAttendance(){var results=await Promise.all([DB.get('students'),DB.get('classes')]);var allStudents=results[0],classes=results[1];var today=new Date().toISOString().split('T')[0];var selClass=document.getElementById('att_class')?.value||(classes[0]?.id||'');var students=selClass?allStudents.filter(function(s){return s.class_id===selClass;}):allStudents;var dateVal=document.getElementById('att_date')?.value||today;var dp=dateVal.split('-');currentDaysInMonth=new Date(parseInt(dp[0]),parseInt(dp[1]),0).getDate();var dh='';for(var i=1;i<=currentDaysInMonth;i++){dh+='<th class="day-header px-2 py-1 cursor-pointer hover:bg-blue-100 text-slate-700" data-day="'+i+'" style="font-size:10px;min-width:24px;">'+i+'</th>';}var html='<div class="bg-white dark:bg-slate-800 p-4 md:p-6 rounded-xl shadow-sm">';html+='<div class="flex flex-col md:flex-row justify-between mb-4 gap-4"><div><h3 class="text-xl font-bold text-slate-800 dark:text-white">Absensi Bulanan</h3><p class="text-xs text-slate-500 mt-1">Pilih status, lalu klik sel tanggal.</p></div>';html+='<div class="flex flex-wrap gap-2 items-center"><select id="att_class" onchange="renderAttendance()" class="px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white text-slate-800 text-sm">';classes.forEach(function(c){html+='<option value="'+c.id+'" '+(c.id===selClass?'selected':'')+'>'+c.name+'</option>';});html+='</select><input type="date" id="att_date" value="'+today+'" onchange="renderAttendance()" class="px-3 py-2 border rounded-lg dark:bg-slate-700 text-slate-800 text-sm" style="color-scheme:light;">';html+='<button onclick="startNativeScanner()" class="bg-green-600 hover:bg-green-700 text-white px-3 py-2 rounded-lg text-sm font-semibold">Scan QR</button>';html+='<button onclick="exportAttendanceExcel()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-2 rounded-lg text-sm font-semibold">Export Excel</button>';html+='<button onclick="printAttendance()" class="bg-purple-600 hover:bg-purple-700 text-white px-3 py-2 rounded-lg text-sm font-semibold">Cetak</button></div></div>';html+='<div class="flex flex-col sm:flex-row gap-4 justify-between items-center bg-slate-50 dark:bg-slate-700/50 p-4 rounded-lg mb-4">';html+='<div class="flex items-center gap-3 text-xs"><span class="font-medium text-slate-700">Pilih Status:</span><select id="att_status_global" class="px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white text-slate-800 text-sm"><option value="H">Hadir (H)</option><option value="S">Sakit (S)</option><option value="I">Izin (I)</option><option value="A">Alpa (A)</option><option value="">Hapus</option></select></div>';html+='<button onclick="saveAttendance()" class="w-full sm:w-auto bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-lg text-sm font-semibold">Simpan Absensi</button></div>';html+='<div class="overflow-x-auto pb-2"><table class="att-table border-collapse" style="width:100%;min-width:800px;"><thead><tr class="bg-slate-100 dark:bg-slate-700"><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-xs">No</th><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-xs text-left min-w-[150px]">Nama</th><th colspan="'+currentDaysInMonth+'" class="px-2 py-2 border dark:border-slate-600 text-xs">Tanggal</th><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-green-600 text-xs">H</th><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-blue-600 text-xs">S</th><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-yellow-600 text-xs">I</th><th rowspan="2" class="px-2 py-2 border dark:border-slate-600 text-red-600 text-xs">A</th></tr><tr class="bg-slate-50 dark:bg-slate-800">'+dh+'</tr></thead><tbody id="attTableBody"></tbody></table></div></div>';document.getElementById('content').innerHTML=html;var tbody=document.getElementById('attTableBody');if(students.length>0){var rh='';for(var i=0;i<students.length;i++){var s=students[i];var td='';for(var d=1;d<=currentDaysInMonth;d++){td+='<td id="att_'+s.id+'_'+d+'" data-student="'+s.id+'" data-day="'+d+'" class="border dark:border-slate-600 text-center cursor-pointer hover:bg-slate-100 dark:hover:bg-slate-700 text-xs font-medium att-cell" style="min-width:24px;height:24px;"></td>';}rh+='<tr class="hover:bg-slate-50 dark:hover:bg-slate-700/50"><td class="px-2 py-1 border dark:border-slate-600 text-xs text-center">'+(i+1)+'</td><td class="px-2 py-1 border dark:border-slate-600 text-xs font-semibold text-left">'+s.name+'</td>'+td+'<td id="recap_h_'+s.id+'" class="px-2 py-1 border dark:border-slate-600 text-green-600 font-bold text-xs">0</td><td id="recap_s_'+s.id+'" class="px-2 py-1 border dark:border-slate-600 text-blue-600 font-bold text-xs">0</td><td id="recap_i_'+s.id+'" class="px-2 py-1 border dark:border-slate-600 text-yellow-600 font-bold text-xs">0</td><td id="recap_a_'+s.id+'" class="px-2 py-1 border dark:border-slate-600 text-red-600 font-bold text-xs">0</td></tr>';}tbody.innerHTML=rh;}else{tbody.innerHTML='<tr><td colspan="'+(currentDaysInMonth+5)+'" class="text-center py-4 text-slate-500">Belum ada data siswa.</td></tr>';}await loadAttendanceData();}
document.addEventListener('click',function(e){if(e.target&&e.target.classList&&e.target.classList.contains('att-cell')){var sid=e.target.getAttribute('data-student');var day=parseInt(e.target.getAttribute('data-day'));var se=document.getElementById('att_status_global');if(!se)return;var st=se.value;e.target.innerText=st;e.target.classList.remove('bg-green-100','bg-blue-100','bg-yellow-100','bg-red-100','text-green-700','text-blue-700','text-yellow-700','text-red-700');if(st==='H')e.target.classList.add('bg-green-100','text-green-700');else if(st==='S')e.target.classList.add('bg-blue-100','text-blue-700');else if(st==='I')e.target.classList.add('bg-yellow-100','text-yellow-700');else if(st==='A')e.target.classList.add('bg-red-100','text-red-700');updateRecap();}if(e.target&&e.target.classList&&e.target.classList.contains('day-header')){var day=parseInt(e.target.getAttribute('data-day'));var di=document.getElementById('att_date');if(di){var cd=di.value||new Date().toISOString().split('T')[0];var p=cd.split('-');di.value=p[0]+'-'+p[1]+'-'+String(day).padStart(2,'0');loadAttendanceData();}}});
async function loadAttendanceData(){var di=document.getElementById('att_date');if(!di)return;var dv=di.value||new Date().toISOString().split('T')[0];var m=dv.substring(0,7);document.querySelectorAll('.day-header').forEach(function(h){h.classList.remove('bg-blue-600','text-white');});var sd=parseInt(dv.split('-')[2],10);var sh=document.querySelector('.day-header[data-day="'+sd+'"]');if(sh)sh.classList.add('bg-blue-600','text-white');try{var r=await sb.from('attendance').select('*').eq('user_id',currentUser.id).gte('date',m+'-01').lte('date',m+'-'+String(currentDaysInMonth).padStart(2,'0'));if(r.error){console.error('Load:',r.error);return;}document.querySelectorAll('.att-cell').forEach(function(c){c.innerText='';c.classList.remove('bg-green-100','bg-blue-100','bg-yellow-100','bg-red-100','text-green-700','text-blue-700','text-yellow-700','text-red-700');});if(r.data&&r.data.length>0){r.data.forEach(function(a){var d=parseInt(a.date.split('-')[2],10);var c=document.getElementById('att_'+a.student_id+'_'+d);if(c){c.innerText=a.status;if(a.status==='H')c.classList.add('bg-green-100','text-green-700');else if(a.status==='S')c.classList.add('bg-blue-100','text-blue-700');else if(a.status==='I')c.classList.add('bg-yellow-100','text-yellow-700');else if(a.status==='A')c.classList.add('bg-red-100','text-red-700');}});}}catch(err){console.error('Load:',err);}updateRecap();}
function updateRecap(){document.querySelectorAll('tr').forEach(function(r){var im=r.querySelector('td[id^="att_"]');if(im){var sid=im.id.split('_')[1];var h=0,s=0,i=0,a=0;r.querySelectorAll('td[id^="att_"]').forEach(function(c){var v=c.innerText.trim()||'';if(v==='H')h++;else if(v==='S')s++;else if(v==='I')i++;else if(v==='A')a++;});var rh=document.getElementById('recap_h_'+sid);if(rh)rh.innerText=h;var rs=document.getElementById('recap_s_'+sid);if(rs)rs.innerText=s;var ri=document.getElementById('recap_i_'+sid);if(ri)ri.innerText=i;var ra=document.getElementById('recap_a_'+sid);if(ra)ra.innerText=a;}});}
async function saveAttendance(){var dv=document.getElementById('att_date').value;if(!dv){showToast('Pilih tanggal!','error');return;}var m=dv.substring(0,7);var all=await DB.get('students');var sc=document.getElementById('att_class').value;var sts=sc?all.filter(function(s){return s.class_id===sc;}):all;if(sts.length===0){showToast('Tidak ada siswa.','info');return;}var sids=sts.map(function(s){return s.id;});var rows=[];for(var i=0;i<sts.length;i++){var s=sts[i];for(var d=1;d<=currentDaysInMonth;d++){var c=document.getElementById('att_'+s.id+'_'+d);var st=c?.innerText.trim()||'';if(st==='H'||st==='S'||st==='I'||st==='A'){rows.push({user_id:currentUser.id,student_id:s.id,date:m+'-'+String(d).padStart(2,'0'),status:st,subject:'Umum'});}}}showToast('Menyimpan...','info');try{if(sids.length>0){var dr=await sb.from('attendance').delete().eq('user_id',currentUser.id).in('student_id',sids).gte('date',m+'-01').lte('date',m+'-'+String(currentDaysInMonth).padStart(2,'0'));if(dr.error)console.error('Del:',dr.error);}if(rows.length>0){var ir=await sb.from('attendance').insert(rows);if(ir.error)throw ir.error;}showToast('Absensi tersimpan!','success');}catch(err){console.error('Save:',err);showToast('Gagal: '+(err.message||'Unknown'),'error');}await loadAttendanceData();}

var kls_audioCtx = null;
var kls_ytPlayer = null;
var kls_ytApiLoaded = false;

function kls_loadYouTubeApi() {
    if (kls_ytApiLoaded) return;
    var tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    var firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
    kls_ytApiLoaded = true;
}

function kls_initYTPlayer() {
    if (!document.getElementById('kls-yt-player')) {
        var div = document.createElement('div');
        div.id = 'kls-yt-player';
        div.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0;';
        document.body.appendChild(div);
    }

    window.onYouTubeIframeAPIReady = function() {
        kls_ytPlayer = new YT.Player('kls-yt-player', {
            videoId: 'c6xBncftsUU', 
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'loop': 1,
                'playlist': 'c6xBncftsUU', 
                'mute': 0
            },
            events: {
                'onReady': function(event) {
                    event.target.setVolume(30); 
                    event.target.playVideo();
                }
            }
        });
    };
}

function kls_unlockAudio() {
    if (!kls_audioCtx) kls_audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (kls_audioCtx.state === 'suspended') {
        kls_audioCtx.resume().catch(function(e){ console.error("Audio resume failed", e); });
    }
}

function playBuzzerHorn() {
    kls_unlockAudio();
    var ctx = kls_audioCtx;
    var freqs = [196.00, 261.63, 329.63, 392.00, 523.25];
    var masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.8, ctx.currentTime + 0.03);
    masterGain.gain.setValueAtTime(0.8, ctx.currentTime + 0.4);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
    masterGain.connect(ctx.destination);
    freqs.forEach(function(f) {
        var osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = f;
        var gain = ctx.createGain();
        gain.gain.value = 0.2;
        osc.detune.value = Math.random() * 10 - 5;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.8);
    });
}

function playCorrectSound() {
    kls_unlockAudio(); 
    var ctx = kls_audioCtx;
    if(!ctx) return;
    var notes = [523.25, 659.25, 783.99, 1046.50]; 
    notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        var t = ctx.currentTime + i * 0.1;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.5, t + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
    });
}

function playWrongSound() {
    kls_unlockAudio(); 
    var ctx = kls_audioCtx;
    if(!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.4, ctx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.6);
}

            };

}

async function kls_start(id) {
    var k = (await DB.get('kuis_kelas')).find(function(x) { return x.id === id; });
    if (!k) return;
    
    kls_data.soal = JSON.parse(k.soal);
    kls_data.kelompok = k.kelompok.split(',').map(function(x){ return x.trim(); });
    kls_data.skor = {};
    kls_data.kelompok.forEach(function(t){ kls_data.skor[t] = 0; });
    kls_data.soalIndex = 0;
    kls_data.mode = k.mode;
    kls_data.timer = k.waktu;
    kls_data.poin = k.poin;
    kls_data.currentTeam = null;
    kls_data.isBuzzed = false;
    kls_data.isLocked = false;
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    
    kls_data.currentRoom = 'kls-' + Math.random().toString(36).substr(2, 6);
    await sb.from('kuis_buzzer').delete().eq('room', kls_data.currentRoom);
    
    if (kls_data.realtimeChannel) kls_data.realtimeChannel.unsubscribe();
    
    kls_data.realtimeChannel = sb.channel(kls_data.currentRoom, {
      config: { broadcast: { self: false } }
    })
      .on('broadcast', { event: 'buzz' }, function(payload) {
          if (payload && payload.message && payload.message.team) {
              if (kls_data.kelompok.includes(payload.message.team)) {
                  kls_buzz(payload.message.team); 
              }
          }
      })
      .on('broadcast', { event: 'request_sync' }, function(payload) {
          if (kls_data.realtimeChannel) {
              kls_data.realtimeChannel.send({
                  type: 'broadcast',
                  event: 'sync',
                  payload: { teams: kls_data.kelompok }
              });
          }
      })
      .subscribe();
      
    if (kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
    kls_data.fallbackInterval = setInterval(async function() {
        if (kls_data.isLocked || kls_data.isBuzzed || !kls_data.currentRoom) return;
        try {
            var res = await sb.from('kuis_buzzer').select('*').eq('room', kls_data.currentRoom).limit(1);
            if (res.data && res.data.length > 0) {
                var team = res.data[0].team;
                if (kls_data.kelompok.includes(team)) {
                    kls_buzz(team);
                    await sb.from('kuis_buzzer').delete().eq('room', kls_data.currentRoom);
                }
            }
        } catch(e) {}
    }, 200);
      
    kls_showJoinQR();
}

        html += '<div class="flex justify-between items-center border-2 '+scaleUp+' p-2 rounded-lg bg-slate-800/80">';

        html += '    <span class="text-xl">'+medals[i]+'</span> '+s[0];
        html += '  </span>';
        html += '  <div class="flex-none ml-2">';
        html += '    <div class="bg-gradient-to-r '+style.grad+' text-white px-2 py-1 rounded-md font-bold text-sm '+style.glow+'">'+s[1]+'</div>';
        html += '  </div>';
        html += '</div>';
    });
    return html;
}

function kls_buzz(team) {
    if (kls_data.isLocked) return; 
    if (kls_data.isBuzzed) return; 
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    
    kls_unlockAudio();
    playBuzzerHorn(); 
    
    kls_data.currentTeam = team;
    kls_data.isBuzzed = true;
    kls_renderLive();
}

function kls_answer(opt) {
    if (!kls_data.isBuzzed) {
        showToast('Tekan Buzzer dulu!', 'error');
        return;
    }
    if (kls_data.isLocked) return; 
    
    kls_data.isLocked = true; 
    if(kls_data.intervalId) clearInterval(kls_data.intervalId);
    kls_unlockAudio();
    
    var q = kls_data.soal[kls_data.soalIndex];
    var correct = q.answer;
    var isCorrect = opt.indexOf(correct + '.') === 0 || opt.startsWith(correct + '.');
    
    var teamStyleMap = {};
    kls_data.kelompok.forEach(function(t, i){ teamStyleMap[t] = kls_team_colors[i % kls_team_colors.length]; });
    
    document.querySelectorAll('#kls_live_container .opt-card').forEach(function(el) {
        var optText = decodeURIComponent(el.dataset.opt);
        var isThisCorrect = optText.indexOf(correct + '.') === 0 || optText.startsWith(correct + '.');
        
        el.removeAttribute('onclick'); 
        el.classList.remove('cursor-pointer', 'hover:scale-105', 'hover:brightness-110', 'opacity-50');
        el.classList.add('cursor-not-allowed');
        
        if(isThisCorrect) {
            el.className = 'opt-card bg-gradient-to-r from-green-400 to-emerald-500 p-4 rounded-xl border-2 border-green-300 text-white font-bold flex items-center gap-3 shadow-[0_0_20px_rgba(16,185,129,0.7)]';
            el.style.transform = 'scale(1.05)';
            el.innerHTML += '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>';
        } else if (optText === opt) {
            el.className = 'opt-card bg-gradient-to-r from-red-500 to-rose-600 p-4 rounded-xl border-2 border-red-300 text-white font-bold flex items-center gap-3 shadow-[0_0_20px_rgba(239,68,68,0.7)]';
            el.style.animation = 'kls_shake 0.4s ease-in-out';
            el.innerHTML += '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>';
        } else {
            el.className = 'opt-card bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-slate-500 opacity-50 flex items-center gap-3';
        }
    });
    
    var badgeStyle = teamStyleMap[kls_data.currentTeam] || { grad: 'from-slate-700 to-slate-800', glow: '' };
    var scoreBadge = document.createElement('div');
    scoreBadge.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[100] text-white text-4xl font-extrabold py-4 px-8 rounded-2xl flex items-center gap-2 bg-gradient-to-br '+badgeStyle.grad+' '+badgeStyle.glow;
    
    if (isCorrect) {
        playCorrectSound(); 
        kls_data.skor[kls_data.currentTeam] += kls_data.poin;
        scoreBadge.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg> +'+kls_data.poin;
        scoreBadge.style.animation = 'kls_bounce 0.5s ease-out';
        document.body.appendChild(scoreBadge);
        kls_confetti();
        showToast('🎉 BENAR! '+kls_data.currentTeam+' +'+kls_data.poin+' POIN', 'success');
    } else {
        playWrongSound(); 
        kls_data.skor[kls_data.currentTeam] -= Math.floor(kls_data.poin / 2);
        scoreBadge.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg> -'+Math.floor(kls_data.poin / 2);
        scoreBadge.style.animation = 'kls_shake 0.4s ease-in-out';
        document.body.appendChild(scoreBadge);
        showToast('❌ SALAH! Jawaban benar ditandai hijau.', 'error');
    }
    
    setTimeout(function() {
        scoreBadge.style.transition = 'opacity 0.5s, transform 0.5s';
        scoreBadge.style.opacity = '0';
        if(isCorrect) scoreBadge.style.transform = 'translate(-50%, -150%) scale(0.8)';
        else scoreBadge.style.transform = 'translate(-50%, 50%) scale(0.8)';
        setTimeout(function() { scoreBadge.remove(); }, 500);
    }, 1500);
    
    kls_updateScore();
    
    setTimeout(function() {
        kls_data.soalIndex++;
        kls_data.currentTeam = null;
        kls_data.isBuzzed = false;
        kls_data.isLocked = false;
        if (kls_data.soalIndex < kls_data.soal.length) {
            kls_renderLive();
        } else {
            kls_end();
        }
    }, 2500); 
}

function kls_skip() {
    if (confirm('Lewati soal ini? Tidak ada poin yang ditambahkan.')) {
        if(kls_data.intervalId) clearInterval(kls_data.intervalId);
        kls_data.isLocked = true;
        showToast('Soal dilewati.', 'info');
        setTimeout(function() {
            kls_data.soalIndex++;
            kls_data.currentTeam = null;
            kls_data.isBuzzed = false;
            kls_data.isLocked = false;
            if (kls_data.soalIndex < kls_data.soal.length) {
                kls_renderLive();
            } else {
                kls_end();
            }
        }, 500);
    }
}

function kls_startTimer() {
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    var timer = kls_data.timer;
    var timerEl = document.getElementById('kls_timer');
    if(timerEl) timerEl.innerText = timer;
    
    kls_data.intervalId = setInterval(function() {
        timer--;
        var el = document.getElementById('kls_timer');
        if (el) el.innerText = timer;
        
        if (timer <= 0) {
            clearInterval(kls_data.intervalId);
            kls_data.intervalId = null;
            showToast('⏳ Waktu habis!', 'error');
            kls_data.isLocked = true; 
            
            setTimeout(function() {
                kls_data.soalIndex++;
                kls_data.currentTeam = null;
                kls_data.isBuzzed = false;
                kls_data.isLocked = false;
                
                if (kls_data.soalIndex < kls_data.soal.length) {
                    kls_renderLive();
                } else {
                    kls_end();
                }
            }, 500);
        }
    }, 1000);
}

function kls_updateScore() {
    var el = document.getElementById('kls_scoreboard');
    if (el) {
        el.innerHTML = kls_renderScore();
        var divs = el.querySelectorAll('div');
        divs.forEach(function(d) {
            d.style.transition = 'all 0.5s ease';
            d.style.transform = 'scale(1.05)';
            setTimeout(function() { d.style.transform = 'scale(1)'; }, 500);
        });
    }
}

function kls_end() {
    if(kls_data.intervalId) clearInterval(kls_data.intervalId);
    if(kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
    stopBgMusic(); 
    kls_data.intervalId = null;
    kls_data.isLocked = false;
    kls_data.isBuzzed = false;
    if (kls_data.realtimeChannel) kls_data.realtimeChannel.unsubscribe();
    
    for(var i=0; i<5; i++) {
        setTimeout(kls_confetti, i * 300);
    }
    
    var sorted = Object.entries(kls_data.skor).sort(function(a, b) { return b[1] - a[1]; });
    var html = '<div class="bg-slate-950 p-8 rounded-3xl text-center shadow-2xl border border-white/10 overflow-hidden relative">';
    html += '  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 via-blue-500 to-purple-600" style="box-shadow: 0 0 10px rgba(59,130,246,0.8);"></div>';
    html += '  <div class="mb-6 mt-4">';
    html += '    <div class="inline-block p-4 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full shadow-xl mb-4" style="box-shadow: 0 0 25px rgba(251,191,36,0.6);"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg></div>';
    html += '    <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-yellow-400 to-orange-500 mt-2 tracking-wider" style="text-shadow: 0 0 20px rgba(251,191,36,0.4);">JUARA HARI INI</h2>';
    html += '    <p class="text-slate-300 mt-2 text-lg">Selamat kepada pemenang! 🎉</p>';
    html += '  </div>';
    html += '  <div class="space-y-4 max-w-md mx-auto">';
    
    var gold = 'border-yellow-400 bg-gradient-to-r from-yellow-500/20 to-amber-500/20';
    var silver = 'border-slate-300 bg-gradient-to-r from-slate-400/20 to-slate-300/20';
    var bronze = 'border-orange-300 bg-gradient-to-r from-orange-400/20 to-red-400/20';
    
    sorted.forEach(function(s, i) {
        var bg = i===0 ? gold : (i===1 ? silver : bronze);
        var medal = ['🥇','🥈','🥉'][i] || (i+1)+'️⃣';
        var scale = i===0 ? 'scale-105 shadow-[0_0_20px_rgba(251,191,36,0.3)]' : '';
        var textGlow = i===0 ? 'text-yellow-400' : i===1 ? 'text-slate-200' : 'text-orange-400';
        html += '    <div class="flex justify-between items-center p-5 rounded-2xl border-2 '+bg+' '+scale+' transition-all">';
        html += '      <span class="font-bold text-xl text-white flex items-center gap-4"><span class="text-3xl">'+medal+'</span> '+s[0]+'</span>';
        html += '      <span class="font-bold text-3xl '+textGlow+'" style="text-shadow: 0 0 10px rgba(255,255,255,0.3);">'+s[1]+'</span>';
        html += '    </div>';
    });
    html += '  </div>';
    html += '  <button onclick="document.getElementById(\'kls_live_container\').classList.add(\'hidden\')" class="mt-8 bg-slate-700 hover:bg-slate-600 text-white px-6 py-2.5 rounded-lg font-semibold transition flex items-center gap-2 mx-auto"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg> Kembali ke Daftar Kuis</button>';
    html += '</div>';
    
    document.getElementById('kls_live_container').innerHTML = html;
    
    kls_unlockAudio();
    playCorrectSound();
    setTimeout(playCorrectSound, 500);
    setTimeout(playCorrectSound, 1000);
}

function kls_stop() {
    if (confirm('Akhiri kuis sekarang? Skor akan langsung dihitung.')) {
        if(kls_data.intervalId) clearInterval(kls_data.intervalId);
        if(kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
        kls_end();
    }
}
