<title>GURU SMART - Sistem Manajemen Sekolah</title>
<script>
/* ============================================================
   DETEKSI & RENDER MODE BUZZER DI HEAD (sangat awal)
   ============================================================
   Strategi FINAL:
   1. Deteksi buzzer mode INSTAN saat head di-parse
   2. Override initApp/renderContent agar app utama tidak jalan
   3. Tambah CSS untuk hide elemen app utama + style UI buzzer
   4. Tampilkan overlay booting INSTAN (sebelum DOM siap)
   5. Daftarkan DOMContentLoaded handler untuk:
      - Bersihkan body
      - Bangun UI buzzer dengan inline CSS (tidak butuh Tailwind)
      - Hapus overlay booting
      - Poll sb (Supabase) hingga tersedia, lalu connect realtime
   
   PENTING: Tidak menunggu event 'load' (yang butuh semua CDN selesai).
   DOMContentLoaded cukup untuk render UI. Supabase di-poll terpisah.
   ============================================================ */
(function(){
  try {
    var hash = window.location.hash || '';
    var search = window.location.search || '';
    var isQueryBuzzer = (new URLSearchParams(search)).get('buzzer') === '1';
    var isHashBuzzer = hash.indexOf('#join-') === 0;
    if (!isHashBuzzer && !isQueryBuzzer) return;
    
    window.__BUZZER_MODE__ = true;
    
    // Override fungsi aplikasi utama agar tidak bisa dipanggil
    window.initApp = function(){ console.log('[Buzzer] initApp diblokir'); };
    window.renderContent = function(){ console.log('[Buzzer] renderContent diblokir'); };
    window.checkSession = function(){ return Promise.resolve(false); };
    
    // Parse room & teams dari URL
    var room = '';
    var initialTeams = [];
    if (isQueryBuzzer) {
        room = (new URLSearchParams(search)).get('room') || '';
        try { initialTeams = JSON.parse((new URLSearchParams(search)).get('teams') || '[]'); } catch (e) { initialTeams = []; }
    } else {
        var joinParts = hash.substring(6).split('--teams-');
        try { room = decodeURIComponent(joinParts[0] || ''); } catch (e) { room = joinParts[0] || ''; }
        try { if (joinParts.length > 1) initialTeams = JSON.parse(decodeURIComponent(joinParts.slice(1).join('--teams-'))); } catch (e) { initialTeams = []; }
    }
    if (!Array.isArray(initialTeams)) initialTeams = [];
    window.__BUZZER_ROOM__ = room;
    window.__BUZZER_TEAMS__ = initialTeams;
    
    document.title = "Buzzer Kuis Siswa";
    
    // Inject CSS: hide app utama + style UI buzzer (inline, tidak butuh Tailwind)
    var s = document.createElement('style');
    s.id = '__buzzer_css';
    s.textContent = [
      '#authScreen,#appScreen,#modalContainer,#toast,#printArea{display:none!important}',
      '*{box-sizing:border-box}',
      'html,body{margin:0!important;padding:0!important;min-height:100%!important;width:100%!important;background:#0f172a!important;color:#fff!important;font-family:Inter,Arial,sans-serif!important}',
      '#__buzzer_boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:Inter,Arial,sans-serif;font-size:18px;z-index:2147483647}',
      '#__buzzer_boot .bb-inner{text-align:center;padding:20px}',
      '#__buzzer_boot .bb-icon{font-size:48px;margin-bottom:12px;animation:bbpulse 1.2s ease-in-out infinite}',
      '@keyframes bbpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.92)}}',
      '#studentApp{min-height:100vh;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:clamp(14px,4vw,28px);padding-bottom:max(24px,env(safe-area-inset-bottom));text-align:center;background:#0f172a;color:#fff}',
      '#studentLogin,#studentBuzzer{width:100%;max-width:480px}',
      '#teamList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%}',
      '#buzzBtn{width:100%;min-height:clamp(230px,48vh,430px);padding:24px 12px;border:3px solid rgba(255,255,255,.25);border-radius:28px;box-shadow:0 12px 30px rgba(0,0,0,.35);color:#fff;font-weight:700;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;user-select:none;-webkit-user-select:none;touch-action:manipulation}',
      '.bb-hidden{display:none!important}'
    ].join('\n');
    document.documentElement.appendChild(s);
    
    // Tampilkan overlay booting INSTAN (sebelum body ada)
    function showBoot(){
      if(document.getElementById('__buzzer_boot'))return;
      var boot=document.createElement('div');
      boot.id='__buzzer_boot';
      boot.innerHTML='<div class="bb-inner"><div class="bb-icon">🔔</div><div>Memuat Buzzer Kuis...</div></div>';
      document.documentElement.appendChild(boot);
    }
    showBoot();
    
    // Fungsi utama: render UI buzzer + connect Supabase
    window.__renderBuzzerUI = function() {
      try {
        // Bersihkan body
        ['authScreen','appScreen','modalContainer','toast','printArea'].forEach(function(id){
          var el = document.getElementById(id);
          if(el) el.remove();
        });
        while(document.body && document.body.firstChild){ document.body.removeChild(document.body.firstChild); }
        
        // Bangun UI buzzer
        var room = window.__BUZZER_ROOM__ || '';
        var initialTeams = window.__BUZZER_TEAMS__ || [];
        var safeRoom = String(room).replace(/[<>&"]/g,function(c){return{'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;'}[c];});
        
        var appWrap = document.createElement('div');
        appWrap.id = 'studentApp';
        appWrap.innerHTML =
            '<div id="studentLogin">'
          +   '<h1 style="font-size:clamp(24px,6vw,32px);font-weight:800;color:#fff;margin:0 0 16px">🔔 Buzzer Online</h1>'
          +   '<p style="color:#cbd5e1;margin:0 0 32px">Pilih Nama Tim Kamu di bawah ini:</p>'
          +   '<div id="teamList"></div>'
          + '</div>'
          + '<div id="studentBuzzer" class="bb-hidden">'
          +   '<div id="buzzBtn" style="background:linear-gradient(135deg,#ef4444,#e11d48)">'
          +     '<span style="font-size:64px;margin-bottom:8px">🔔</span>'
          +     '<span style="font-size:clamp(30px,8vw,48px)">TEKAN</span>'
          +   '</div>'
          +   '<div id="buzzStatus" style="margin-top:24px;min-height:36px;color:#4ade80;font-weight:700;font-size:18px;display:flex;align-items:center;justify-content:center"></div>'
          +   '<button id="changeTeamBtn" style="margin-top:32px;color:#94a3b8;font-size:14px;background:none;border:none;text-decoration:underline;cursor:pointer;padding:10px 18px">Ganti Tim</button>'
          + '</div>'
          + '<p style="color:#64748b;font-size:12px;margin-top:48px">Tersambung ke Room: <span style="color:#4ade80;font-family:monospace">' + safeRoom + '</span></p>';
        document.body.appendChild(appWrap);
        
        // Hapus overlay booting
        var boot = document.getElementById('__buzzer_boot');
        if(boot) boot.remove();
        
        // Render teams
        var colors = [
          'linear-gradient(135deg,#ec4899,#e11d48)',
          'linear-gradient(135deg,#22d3ee,#3b82f6)',
          'linear-gradient(135deg,#a855f7,#d946ef)',
          'linear-gradient(135deg,#fb923c,#ef4444)'
        ];
        window.__buzzerRenderTeams = function(teams) {
          var list = document.getElementById('teamList');
          if (!list) return;
          list.innerHTML = '';
          teams.forEach(function(t, i) {
            var col = colors[i % colors.length];
            var btn = document.createElement('button');
            btn.style.cssText = 'min-height:108px;width:100%;border:0;border-radius:18px;padding:18px 8px;font-size:clamp(16px,4vw,22px);line-height:1.25;overflow-wrap:anywhere;touch-action:manipulation;background:'+col+';color:#fff;font-weight:700;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px';
            btn.innerHTML = '<span style="font-size:28px">🔔</span>' + t;
            btn.onclick = function() {
              if(typeof kls_unlockAudio === 'function') kls_unlockAudio();
              document.getElementById('studentLogin').classList.add('bb-hidden');
              document.getElementById('studentBuzzer').classList.remove('bb-hidden');
              var bigBtn = document.getElementById('buzzBtn');
              bigBtn.style.background = col;
              bigBtn.onclick = function() {
                if(typeof playBuzzerHorn === 'function') playBuzzerHorn();
                bigBtn.style.transform = 'scale(0.95)';
                setTimeout(function() { bigBtn.style.transform = ''; }, 200);
                var status = document.getElementById('buzzStatus');
                if(status) {
                  status.innerHTML = '✅ Sinyal Terkirim!';
                  setTimeout(function() { status.innerHTML = ''; }, 2000);
                }
                try {
                  if(window.__buzzerChannel) {
                    window.__buzzerChannel.send({ type: 'broadcast', event: 'buzz', payload: { team: t } });
                  }
                  if(typeof sb !== 'undefined' && sb && sb.from) {
                    sb.from('kuis_buzzer').insert([{ room: room, team: t, created_at: new Date().toISOString() }]).then(function(){}).catch(function(e){});
                  }
                } catch(err) { console.warn('Buzzer send error:', err); }
              };
            };
            list.appendChild(btn);
          });
        };
        
        if (initialTeams.length) window.__buzzerRenderTeams(initialTeams);
        else window.__buzzerRenderTeams(['GARUDA', 'ELANG', 'RAJAWALI', 'MERPATI']);
        
        var changeBtn = document.getElementById('changeTeamBtn');
        if(changeBtn){
          changeBtn.onclick = function() {
            document.getElementById('studentLogin').classList.remove('bb-hidden');
            document.getElementById('studentBuzzer').classList.add('bb-hidden');
          };
        }
        
        // Poll Supabase hingga tersedia, lalu connect realtime channel
        var pollCount = 0;
        var pollInterval = setInterval(function(){
          pollCount++;
          if (typeof sb !== 'undefined' && sb && sb.channel) {
            clearInterval(pollInterval);
            try {
              var ch = sb.channel(room, { config: { broadcast: { self: false } } })
                .on('broadcast', { event: 'sync' }, function(payload) {
                  if(payload && payload.message && payload.message.teams && window.__buzzerRenderTeams){
                    window.__buzzerRenderTeams(payload.message.teams);
                  }
                })
                .subscribe(function(status) {
                  if (status === 'SUBSCRIBED') {
                    ch.send({ type: 'broadcast', event: 'request_sync', payload: {} });
                  }
                });
              window.__buzzerChannel = ch;
            } catch(e) { console.warn('Buzzer channel error:', e); }
          } else if (pollCount > 60) {
            // 30 detik (60 x 500ms) tetap tidak ada sb — tampilkan warning kecil
            clearInterval(pollInterval);
            console.warn('Supabase tidak tersedia setelah 30s');
          }
        }, 500);
        
      } catch(err) {
        console.error('Buzzer render error:', err);
        // Tetap hapus overlay biar user tidak stuck di "Memuat"
        var boot = document.getElementById('__buzzer_boot');
        if(boot) boot.remove();
        // Tampilkan error ke user
        if(document.body){
          document.body.innerHTML = '<div style="position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0f172a;color:#fff;font-family:Arial;padding:20px;text-align:center"><div><div style="font-size:48px;margin-bottom:12px">⚠️</div><h2 style="margin:0 0 12px">Gagal Memuat Buzzer</h2><p style="color:#cbd5e1;margin:0">Silakan refresh halaman atau pindai ulang QR Code.</p><p style="color:#64748b;font-size:12px;margin-top:16px">'+String(err.message||err)+'</p></div></div>';
        }
      }
    };
    
    // Daftarkan DOMContentLoaded untuk render UI sesegera mungkin
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', window.__renderBuzzerUI);
    } else if (document.readyState === 'interactive') {
      // DOM sudah parse, langsung render
      setTimeout(window.__renderBuzzerUI, 0);
    } else if (document.readyState === 'complete') {
      // Sudah complete, langsung render
      setTimeout(window.__renderBuzzerUI, 0);
    }
    
    // FALLBACK: jika setelah 3 detik UI belum ke-render, paksa render
    setTimeout(function(){
      if(!document.getElementById('studentApp') && typeof window.__renderBuzzerUI === 'function'){
        console.warn('Buzzer fallback render triggered');
        try { window.__renderBuzzerUI(); } catch(e){ console.error(e); }
      }
    }, 3000);
    
  } catch(e) { 
    console.warn('Buzzer early-detect error:', e); 
  }
})();
</script>

<script>
/* ==================================================================
   GSAI BRIDGE v3 — Perbaikan "Puter AI tidak bisa generate"
   - Chat/Teks   : Pollinations AI (GRATIS, tanpa login/API key) -> Puter (cadangan)
   - Baca Gambar : Puter AI (cukup klik "Sambungkan AI" sekali saja)
   - Buat Gambar : PUTER AI IMG (puter.ai.txt2img) = JALUR TUNGGAL (TANPA cadangan Pollinations)
   -             Jika Puter gagal -> PEMBERITAHUAN LANGSUNG ke pengguna (tanpa fallback)
   - OCR Darurat : Tesseract.js langsung di browser (tanpa server)
   ================================================================== */
window.GSAI=(function(){
  var POLL_POST='https://text.pollinations.ai/openai';
  var POLL_GET='https://text.pollinations.ai/';
  var lastProvider='-';
  function hasPuter(){try{return (typeof puter!=='undefined')&&puter&&puter.ai&&typeof puter.ai.chat==='function';}catch(e){return false;}}
  function hasImageMsg(ms){try{for(var i=0;i<ms.length;i++){var c=ms[i]&&ms[i].content;if(Array.isArray(c)){for(var j=0;j<c.length;j++){if(c[j]&&c[j].type==='image_url')return true;}}}}catch(e){}return false;}
  function toStr(c){if(typeof c==='string')return c;if(Array.isArray(c))return c.map(function(p){return (p&&p.text)||'';}).join('\n');return '';}
  function toText(r){
    try{
      if(r==null)return '';
      if(typeof r==='string')return r;
      if(typeof r.message==='string')return r.message;
      if(r.message){var c=r.message.content;if(typeof c==='string')return c;if(Array.isArray(c))return toStr(c);}
      if(Array.isArray(r.choices)&&r.choices[0])return toText(r.choices[0].message);
      if(typeof r.text==='string'&&r.text)return r.text;
      if(typeof r.content==='string')return r.content;
      if(Array.isArray(r.content))return toStr(r.content);
      if(typeof r.reasoning==='string'&&r.reasoning.trim())return r.reasoning;
    }catch(e){}
    return '';
  }
  async function pollPost(ms){
    var body=JSON.stringify({model:'openai',messages:ms,private:true});
    for(var attempt=0;attempt<2;attempt++){
      var ctrl=new AbortController();var t=setTimeout(function(){ctrl.abort();},90000);
      try{
        var r=await fetch(POLL_POST,{method:'POST',headers:{'Content-Type':'application/json'},body:body,signal:ctrl.signal});
        if(r.status===429||r.status>=500){if(attempt===0){await new Promise(function(rs){setTimeout(rs,2500);});continue;}throw new Error('HTTP '+r.status);}
        if(!r.ok){var et='';try{et=(await r.text()).substring(0,140);}catch(e){}throw new Error('HTTP '+r.status+(et?' '+et:''));}
        var ct=(r.headers.get('content-type')||'')+'',txt='';
        if(ct.indexOf('json')>=0){txt=toText(await r.json());}else{txt=await r.text();}
        if(!txt||!txt.trim())throw new Error('Respon kosong');
        lastProvider='Pollinations (gratis)';return txt;
      }finally{clearTimeout(t);}
    }
    throw new Error('Pollinations gagal');
  }
  async function pollGet(ms){
    var sys='',parts=[];
    (ms||[]).forEach(function(m){var s=toStr(m.content);if(!s)return;if(m.role==='system'){sys+=(sys?'\n':'')+s;}else{parts.push((m.role==='assistant'?'Assistant: ':'User: ')+s);}});
    if(!parts.length)throw new Error('Tidak ada pesan');
    var p=(sys?sys+'\n\n':'')+parts.join('\n\n')+'\n\nAssistant:';
    var url=POLL_GET+encodeURIComponent(p.substring(0,3000))+'?model=openai&referrer=gurusmart';
    var r=await fetch(url);if(!r.ok)throw new Error('GET HTTP '+r.status);
    var txt=await r.text();
    if(txt&&txt.trim().charAt(0)==='{'){try{var j=JSON.parse(txt);if(j&&j.error)throw new Error('Err');var t2=toText(j);if(t2)txt=t2;}catch(e){}}
    if(!txt||!txt.trim())throw new Error('Respon kosong');
    lastProvider='Pollinations (gratis)';return txt;
  }
  async function puterChat(ms){
    if(!hasPuter())throw new Error('Pustaka Puter belum termuat');
    var signed=false;try{signed=puter.auth.isSignedIn();}catch(e){signed=false;}
    if(!signed){await puter.auth.signIn();}
    var models=[null,'gpt-4o-mini','gpt-4o','claude-3-5-sonnet-latest'];var lastErr=null;
    for(var i=0;i<models.length;i++){
      try{
        var res=models[i]?await puter.ai.chat(ms,{model:models[i]}):await puter.ai.chat(ms);
        var txt=toText(res);
        if(txt&&txt.trim()){lastProvider='Puter AI'+(models[i]?' ['+models[i]+']':'');return txt;}
      }catch(e){lastErr=e;}
    }
    throw lastErr||new Error('Puter AI gagal');
  }
  async function chat(ms){
    ms=ms||[];
    if(hasImageMsg(ms)){
      try{return await puterChat(ms);}
      catch(e){throw new Error('Fitur baca gambar membutuhkan Puter AI. Klik tombol "Sambungkan AI" di halaman Asisten AI (sekali saja), lalu ulangi. ('+(e.message||e)+')');}
    }
    var errs=[];
    try{return await pollPost(ms);}catch(e1){errs.push('P1:'+(e1.message||e1));}
    try{return await pollGet(ms);}catch(e2){errs.push('P2:'+(e2.message||e2));}
    try{return await puterChat(ms);}catch(e3){errs.push('Puter:'+(e3.message||e3));}
    throw new Error('Semua layanan AI gagal — '+errs.join(' | '));
  }
  function hasPuterImg(){try{return (typeof puter!=='undefined')&&puter&&puter.ai&&(typeof puter.ai.txt2img==='function'||typeof puter.ai.txtToImage==='function');}catch(e){return false;}}
  function extractImgSrc(el){
    try{
      if(typeof el==='string')return el;
      if(el&&el.tagName&&el.tagName.toLowerCase()==='img')return el.src||el.getAttribute('src')||'';
      if(el&&typeof el.src==='string'&&el.src)return el.src;
      if(el&&typeof el.url==='string'&&el.url)return el.url;
      if(el&&typeof el.toString==='function'){var s=el.toString();if(s&&(s.indexOf('http')===0||s.indexOf('data:image')===0))return s;}
    }catch(e){}
    return '';
  }
  function puterImgOnce(fn,prompt){
    return new Promise(function(res,rej){
      var to=setTimeout(function(){rej(new Error('Puter AI IMG timeout (180s)'));},180000);
      Promise.resolve().then(function(){return fn(prompt,false);}).then(function(el){
        clearTimeout(to);
        var s=extractImgSrc(el);
        if(s)res(s);else rej(new Error('Puter AI IMG tidak mengembalikan gambar'));
      }).catch(function(e){clearTimeout(to);rej(e);});
    });
  }
  async function puterImg(prompt){
    if(!hasPuterImg())throw new Error('Pustaka Puter IMG belum termuat');
    var signed=false;try{signed=puter.auth.isSignedIn();}catch(e){signed=false;}
    if(!signed){await puter.auth.signIn();}
    var fns=[];
    if(typeof puter.ai.txt2img==='function')fns.push(puter.ai.txt2img.bind(puter.ai));
    if(typeof puter.ai.txtToImage==='function')fns.push(puter.ai.txtToImage.bind(puter.ai));
    var lastErr=null;
    for(var i=0;i<fns.length;i++){
      try{var s=await puterImgOnce(fns[i],prompt);if(s){lastProvider='Puter AI IMG';return s;}}catch(e){lastErr=e;}
    }
    throw lastErr||new Error('Puter AI IMG gagal');
  }
  async function image(prompt,w,h){
    // JALUR TUNGGAL: PUTER AI IMG (puter.ai.txt2img) — TANPA cadangan Pollinations.
    // Parameter w/h dipertahankan demi kompatibilitas pemanggil lama; ukuran akhir
    // ditentukan oleh Puter AI IMG sendiri. Jika gagal -> pemberitahuan langsung.
    try{
      var src=await puterImg(prompt);
      if(src)return src;
      throw new Error('Puter AI IMG tidak mengembalikan gambar');
    }catch(e1){
      var m1=(e1&&(e1.message||e1))||'tidak diketahui';
      throw new Error('Puter AI gagal membuat gambar — '+m1+'. Klik tombol "🔗 Sambungkan AI" di bagian atas halaman (izinkan popup yang muncul), lalu coba lagi.');
    }
  }
  return {chat:chat,image:image,provider:function(){return lastProvider;}};
})();
window.gsDownloadImage=function(url,name){
  (async function(){
    try{
      var href=url,blob=null;
      try{var r=await fetch(url);if(r.ok)blob=await r.blob();}catch(e){}
      if(blob&&blob.size>0){try{href=URL.createObjectURL(blob);}catch(e){blob=null;href=url;}}
      var a=document.createElement('a');a.href=href;a.download=name||('Gambar_'+Date.now()+'.png');a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();document.body.removeChild(a);
      if(blob){setTimeout(function(){try{URL.revokeObjectURL(href);}catch(e){}},5000);}
      showToast('Gambar berhasil diunduh!','success');
    }catch(e){
      try{var w=window.open(url,'_blank');if(!w)throw new Error('popup diblokir');}catch(e2){showToast('Gagal unduh: '+(e2.message||e2),'error');}
    }
  })();
};
window.gsConnectPuter=async function(){
  try{
    if(typeof puter==='undefined'){showToast('Pustaka Puter belum termuat. Muat ulang halaman (refresh) lalu coba lagi. Tanpa Puter, gambar memakai mesin cadangan.','error');return;}
    var s=false;try{s=puter.auth.isSignedIn();}catch(e){}
    if(s){showToast('Puter AI sudah tersambung!','success');gsUpdateAuthChip();return;}
    showToast('Menyambungkan ke Puter AI... izinkan jendela yang muncul.','success');
    await puter.auth.signIn();
    showToast('Puter AI tersambung! Buat gambar (Puter AI IMG) & baca gambar siap dipakai.','success');
    gsUpdateAuthChip();
  }catch(e){

window.gsLocalOCR=function(dataUrl){
  return new Promise(function(resolve){
    var done=false;
    var finish=function(t){if(done)return;done=true;resolve((t||'').trim());};
    setTimeout(function(){finish('');},120000);
    try{
      var run=function(){
        try{
          if(typeof Tesseract==='undefined'){
            if(!document.getElementById('gsTessScript')){
              var s=document.createElement('script');s.id='gsTessScript';

              document.head.appendChild(s);
            }
            setTimeout(run,400);return;
          }
          Tesseract.recognize(dataUrl,'ind').then(function(r){finish(r&&r.data&&r.data.text);})
            .catch(function(){try{Tesseract.recognize(dataUrl,'eng').then(function(r2){finish(r2&&r2.data&&r2.data.text);}).catch(function(){finish('');});}catch(e){finish('');}});
        }catch(e){finish('');}
      };
      run();
    }catch(e){finish('');}
  });
};

async function generateScheduleImage(){var sc=await DB.get('schedules');var days=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu'];var timeSlots=['07:30-09:00','09:15-10:45','11:00-12:30'];var scheduleText='JADWAL PELAJARAN SEKOLAH MINGGUAN. ';var hasData=false;timeSlots.forEach(function(time){var startTime=time.split('-')[0];scheduleText+='Pada jam '+time+': ';days.forEach(function(day){var s=sc.find(function(x){return x.day===day&&x.start_time===startTime;});if(s){hasData=true;scheduleText+=day+' '+s.subject+'('+s.teacher+'), ';}else{scheduleText+=day+' kosong, ';}});scheduleText+='. ';});if(!hasData){showToast('Belum ada jadwal pelajaran. Tambahkan jadwal dulu!','error');return;}var promptText='Buatkan gambar poster jadwal pelajaran sekolah mingguan yang menarik dan berwarna-warni untuk siswa. Tampilkan jadwal berikut dalam bentuk tabel poster yang ramah anak dengan ilustrasi buku, pensil, dan elemen sekolah: '+scheduleText.substring(0,700)+' Gunakan desain kartun edukatif yang ceria dan mudah dibaca.';openModal('🎨 Generate Gambar Jadwal','<div class="space-y-4"><div class="bg-purple-50 dark:bg-slate-700 p-4 rounded-lg text-sm text-purple-700 dark:text-purple-300 border border-purple-200 dark:border-slate-600 flex items-start gap-2"><svg class="w-5 h-5 flex-none mt-0.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9.663 17h4.673M12 3v1m6.364 1.636l-.707.707M21 12h-1M4 12H3m3.343-5.657l-.707-.707m2.828 9.9a5 5 0 117.072 0l-.548.547A3.374 3.374 0 0014 18.469V19a2 2 0 11-4 0v-.531c0-.895-.356-1.754-.988-2.386l-.548-.547z"/></svg><span>Puter AI IMG akan membuatkan gambar poster jadwal pelajaran otomatis berdasarkan data jadwal sekolah Anda. Tunggu sebentar ya, proses generate gambar biasanya 15-60 detik.</span></div><div id="schedImgLoading" class="flex flex-col items-center justify-center py-12"><div class="relative w-20 h-20 mb-4"><div class="absolute inset-0 rounded-full border-4 bo // Penomoran ulang baris siswa pada satu kartu hari
function pkRenumber(listWrap){
    var n=1;var kids=listWrap.children;
    for(var i=0;i<kids.length;i++){
        var el=kids[i];
        if(el.classList&&el.classList.contains('pk-item')){
            var no=el.querySelector('.pk-no');
            if(no)no.textContent=n;
            n++;
        }else if(el.classList&&el.classList.contains('pk-filler')){
            var fno=el.querySelector('.pk-fno');
            if(fno)fno.textContent=n;
            n++;
        }else if(el.classList&&el.classList.contains('pk-empty')){
            el.remove();

    }
}

async function pkQuickAdd(day,classId,el){

    var student=raw,task='';
    var sep=raw.indexOf('|');

    if(!student){el.value='';return;}
    var fillerRow=el.closest('.pk-filler');
    if(el.getAttribute('data-pk-busy')==='1')return;
    el.setAttribute('data-pk-busy','1');
    el.disabled=true;el.classList.add('opacity-50');
    var res=await DB.insert('piket',{day:day,class_id:classId,student_name:student,task:task});
    el.disabled=false;el.classList.remove('opacity-50');
    if(!res||!res.length){el.removeAttribute('data-pk-busy');return;}
    var it=res[0];
    var sid=String(it.id==null?'':it.id).replace(/'/g,"\\'");

    el.value='';
    el.removeAttribute('data-pk-busy');
    var card=el.closest('.pk-card');
    var listWrap=card?card.querySelector('[data-pk-list]'):null;
    if(!listWrap){el.value='';renderPiket();return;}

    var focusEl=null;
    if(fillerRow){
        listWrap.replaceChild(rowDiv,fillerRow);
        var nfs=listWrap.querySelectorAll('.pk-filler .pk-input');
        if(nfs.length){focusEl=nfs[0];}
        else{var addInp=card.querySelector('.pk-add-input');if(addInp)focusEl=addInp;}
    }else{
        var filler=listWrap.querySelector('.pk-filler');
        if(filler){listWrap.insertBefore(rowDiv,filler);}else{listWrap.appendChild(rowDiv);}
        var fs2=listWrap.querySelectorAll('.pk-filler');
        if(fs2.length){fs2[fs2.length-1].remove();}
        focusEl=el;
    }
    pkRenumber(listWrap);
    if(focusEl){try{focusEl.focus();}catch(e2){}}
    showToast('Siswa piket ditambahkan!','success');
}
// Klik nama siswa di tabel -> edit langsung (Enter=simpan, Esc=batal)
function pkStartEdit(id,nameSpan){
    if(window.__pkEditing)return;
    var it=(window.__pkItems||{})[String(id)];
    if(!it)return;
    var rowDiv=nameSpan.closest('.pk-item');
    if(!rowDiv)return;
    window.__pkEditing=true;
    var cur=String(it.student_name==null?'':it.student_name);
    if(it.task)cur+=' | '+String(it.task);
    var inp=document.createElement('input');
    inp.type='text';
    inp.value=cur;
    inp.className='w-full px-2 py-1 border border-blue-400 rounded text-xs bg-white dark:bg-slate-700 dark:text-white text-slate-700 focus:outline-none';
    nameSpan.style.display='none';
    rowDiv.insertBefore(inp,nameSpan);
    inp.focus();inp.select();
    var finished=false;
    async function pkCommitEdit(){
        if(finished)return;finished=true;window.__pkEditing=false;
        var v=(inp.value||'').trim();
        if(!v||v===cur){inp.remove();nameSpan.style.display='';return;}
        var student=v,task='';
        var s2=v.indexOf('|');
        if(s2>-1){student=v.substring(0,s2).trim();task=v.substring(s2+1).trim();}
        if(!student){inp.remove();nameSpan.style.display='';showToast('Nama siswa tidak boleh kosong!','error');return;}
        var ok=await DB.update('piket',id,{student_name:student,task:task});
        if(ok){
            it.student_name=student;it.task=task;
            nameSpan.innerHTML='<b>'+pkEsc(student)+'</b>'+(task?'<br><span class="text-[10px] font-normal" style="color:#a855f7">🧹 '+pkEsc(task)+'</span>':'');
            showToast('Nama piket diperbarui!','success');
        }else{
            showToast('Gagal memperbarui nama piket.','error');
        }
        inp.remove();nameSpan.style.display='';
    }
    inp.onkeydown=function(e){
        if(e.key==='Enter'){e.preventDefault();pkCommitEdit();}
        else if(e.key==='Escape'){
            if(finished)return;finished=true;window.__pkEditing=false;
            inp.onblur=null;
            inp.remove();nameSpan.style.display='';
        }
    };
    inp.onblur=pkCommitEdit;
}

var scannerStarting=false;
var scannerLastText='';
var scannerLastAt=0;
var scannerProcessing=false;
async function startScanCamera(){
  var reader=document.getElementById('qr-reader');
  var status=document.getElementById('qr-status');
  if(!reader)return;
  if(typeof Html5Qrcode==='undefined'){
    if(status)status.innerText='Mesin pembaca QR tidak termuat. Periksa internet lalu muat ulang halaman.';
    return;
  }
  if(scannerStarting)return;
  scannerStarting=true;
  try{
    if(html5QrCode){
      try{await html5QrCode.stop();}catch(e){}
      try{html5QrCode.clear();}catch(e){}
      html5QrCode=null;
    }
    reader.style.width='100%';
    reader.style.maxWidth='100%';
    reader.style.minHeight='320px';
    reader.style.position='relative';
    scannerLastText='';
    scannerLastAt=0;
    scannerProcessing=false;
    html5QrCode=new Html5Qrcode('qr-reader',{verbose:false});
    var onScanSuccess=async function(decodedText){
      var now=Date.now();
      if(!decodedText || scannerProcessing || (decodedText===scannerLastText && now-scannerLastAt<0))return;
      scannerProcessing=true;
      scannerLastText=decodedText;scannerLastAt=now;
      var liveStatus=document.getElementById('qr-status');
      if(liveStatus)liveStatus.innerText='QR terdeteksi. Mengambil screenshot otomatis dan memverifikasi hasil...';
      /* Ambil snapshot otomatis dari frame kamera saat QR terdeteksi. Hasil dekode
         Html5Qrcode dipakai sebagai hasil utama agar proses tetap cepat dan stabil. */
      try{
        var scanVideo=reader.querySelector('video');
        if(!scanVideo){var scanVideos=reader.getElementsByTagName('video');scanVideo=scanVideos&&scanVideos.length?scanVideos[0]:null;}
        if(scanVideo){
          /* Tunggu frame kamera yang benar-benar siap, agar canvas tidak kosong. */
          if(!(scanVideo.videoWidth>0 && scanVideo.videoHeight>0)){
            await new Promise(function(resolve){var done=false;var finish=function(){if(done)return;done=true;resolve();};scanVideo.addEventListener('loadeddata',finish,{once:true});setTimeout(finish,500);});
          }
          if(scanVideo.videoWidth>0 && scanVideo.videoHeight>0){
            /* Tunggu satu frame baru lalu ambil gambar asli dari video kamera. */
            await new Promise(function(resolve){requestAnimationFrame(function(){resolve();});});
            var snapCanvas=document.createElement('canvas');
            snapCanvas.width=scanVideo.videoWidth;
            snapCanvas.height=scanVideo.videoHeight;
            var snapCtx=snapCanvas.getContext('2d',{willReadFrequently:true});
            if(!snapCtx)throw new Error('Canvas screenshot tidak tersedia');
            snapCtx.drawImage(scanVideo,0,0,snapCanvas.width,snapCanvas.height);
            window.lastQrScanScreenshot=snapCanvas.toDataURL('image/jpeg',0.96);
            window.lastQrScanText=decodedText;
            window.lastQrScanAt=new Date().toISOString();
            window.lastQrScanImage=snapCanvas;
            /* Screenshot hanya disimpan sementara di memori halaman; jangan unduh ke perangkat.
               Baca ulang QR dari gambar snapshot secara otomatis bila browser mendukungnya. */
            if('BarcodeDetector' in window){
              try{
                var qrDetector=new BarcodeDetector({formats:['qr_code']});
                var foundCodes=await qrDetector.detect(snapCanvas);
                if(foundCodes && foundCodes.length){
                  var matchedCode=foundCodes.find(function(item){return item.rawValue===decodedText;}) || foundCodes[0];
                  if(matchedCode && matchedCode.rawValue)decodedText=matchedCode.rawValue;
                }
              }catch(snapshotVerifyError){console.debug('Pembacaan ulang snapshot tidak tersedia; memakai hasil pembaca QR utama.',snapshotVerifyError);}
            }
          }else{throw new Error('Video kamera belum menghasilkan frame');}
        }else{throw new Error('Elemen video kamera tidak ditemukan');}
      }catch(snapshotError){console.warn('Screenshot otomatis tidak tersedia; tetap memakai hasil QR yang terdeteksi.',snapshotError);}
      if(liveStatus)liveStatus.innerText='QR berhasil difoto sementara dan dibaca otomatis. Memproses data...';
      await stopCameraStream();
      if(window.currentActId){await processActQRResult(window.currentActId,decodedText);}
      else{await processQRResult(decodedText);}
      scannerProcessing=false;
    };
    var config={
      /* Tingkatkan peluang membaca QR kecil: frame lebih sering dan area pemindaian lebih luas. */
      fps:30,
      qrbox:function(viewWidth,viewHeight){
        var side=Math.floor(Math.min(viewWidth*0.90,viewHeight*0.90,720));
        side=Math.max(100,side);
        return {width:Math.min(side,viewWidth),height:Math.min(side,viewHeight)};
      },
      aspectRatio:1,
      disableFlip:false,
      formatsToSupport:[Html5QrcodeSupportedFormats.QR_CODE],
      experimentalFeatures:{useBarCodeDetectorIfSupported:true},
      videoConstraints:{
        facingMode:'environment',
        width:{ideal:1920},
        height:{ideal:1080},
        frameRate:{ideal:30,max:30}
      }
    };
    var cameraConfig={facingMode:{ideal:'environment'}};
    var cameras=[];
    /* Pilih kamera secara berbeda untuk HP dan PC: HP utamakan kamera belakang,
       sedangkan PC utamakan webcam yang tersedia dan jangan asal memilih kamera terakhir. */
    try{
      cameras=await Html5Qrcode.getCameras();
      if(cameras&&cameras.length){
        var isMobileDevice=/Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent||'');
        var backCamera=cameras.find(function(c){return /back|rear|environment|belakang|traseira/i.test(c.label||'');});
        var frontCamera=cameras.find(function(c){return /front|user|integrated|webcam|facetime|hd camera/i.test(c.label||'');});
        cameraConfig=(isMobileDevice?(backCamera||cameras[0]):(frontCamera||cameras[0])).id;
      }
    }catch(cameraListError){console.warn('Daftar kamera tidak tersedia; memakai kamera default.',cameraListError);}
    /* Kompatibilitas webcam PC: coba resolusi standar lalu fallback ke batasan kamera
       yang lebih ringan jika webcam tidak menerima resolusi tinggi atau facingMode. */
    var scanFailure=null;
    var startOptions=[config,
      Object.assign({},config,{videoConstraints:{width:{ideal:1280},height:{ideal:720},frameRate:{ideal:24}}}),
      Object.assign({},config,{videoConstraints:{}})
    ];
    var cameraOptions=cameras.length?[cameraConfig,{facingMode:'environment'},cameras[0].id]:[cameraConfig,{facingMode:'user'},{facingMode:'environment'}];
    var started=false;
    for(var ci=0;ci<cameraOptions.length&&!started;ci++){
      for(var si=0;si<startOptions.length&&!started;si++){
        try{
          await html5QrCode.start(cameraOptions[ci],startOptions[si],onScanSuccess,function(){/* Terus pindai sampai QR terbaca. */});
          started=true;
        }catch(startErr){scanFailure=startErr;console.warn('Percobaan membuka kamera gagal; mencoba konfigurasi lain.',startErr);}
      }
    }
    if(!started)throw scanFailure||new Error('Tidak ada kamera yang berhasil dibuka');
    var video=reader.querySelector('video');
    if(video){
      /* Minta fokus otomatis berkelanjutan jika didukung kamera/browser. */
      try{
        var videoTrack=video.srcObject&&video.srcObject.getVideoTracks?video.srcObject.getVideoTracks()[0]:null;
        if(videoTrack&&videoTrack.applyConstraints){
          var supported=videoTrack.getCapabilities?videoTrack.getCapabilities():{};
          var focusConstraints={};
          if(supported.focusMode&&supported.focusMode.indexOf('continuous')!==-1)focusConstraints.focusMode='continuous';
          if(supported.zoom&&supported.zoom.max>1)focusConstraints.zoom=Math.min(supported.zoom.max,1.5);
          if(Object.keys(focusConstraints).length)await videoTrack.applyConstraints({advanced:[focusConstraints]});
        }
      }catch(focusError){console.warn('Fokus/zoom otomatis tidak didukung kamera ini.',focusError);}
      video.setAttribute('playsinline','true');
      video.setAttribute('autoplay','true');
      video.setAttribute('webkit-playsinline','true');
      video.muted=true;
      video.style.display='block';
      video.style.width='100%';
      video.style.height='100%';
      video.style.minHeight='320px';
      video.style.objectFit='contain';
    }
    var liveStatus=document.getElementById('qr-status');
    if(liveStatus)liveStatus.innerText='Kamera aktif. Arahkan QR ke bingkai dan tahan stabil; di PC pastikan webcam tidak sedang dipakai aplikasi lain. Scanner akan membaca otomatis saat QR terlihat jelas.';
  }catch(e){
    console.error('Scanner QR gagal:',e);
    var msg=(e&&e.name==='NotAllowedError')?'Izin kamera ditolak. Izinkan kamera di pengaturan browser.':
      (e&&e.name==='NotFoundError')?'Kamera tidak ditemukan pada perangkat ini.':
      (e&&e.name==='NotReadableError')?'Kamera sedang dipakai aplikasi lain. Tutup aplikasi kamera lain lalu coba lagi.':
      'Kamera gagal dibuka. Pastikan halaman HTTPS dan izin kamera aktif.';
    var liveStatus=document.getElementById('qr-status');
    if(liveStatus)liveStatus.innerText=msg;
    if(html5QrCode){try{await html5QrCode.clear();}catch(ignore){}html5QrCode=null;}
  }finally{scannerStarting=false;}
}

  var scanner=html5QrCode;
  if(!scanner)return;
  html5QrCode=null;
  try{await scanner.stop();}catch(e){}

async function buildRaporHTML(studentId,results){var student=results[0].find(function(s){return String(s.id)===String(studentId);});if(!student)return '';var classes=results[1].find(function(c){return String(c.id)===String(student.class_id);});var grades=results[2].filter(function(g){return String(g.student_id)===String(studentId);});var subjects=results[3];var profile=results[4][0]||{};var gradeRows='';var totalScore=0;var totalSubjects=0;subjects.forEach(function(sub){var subGrades=grades.filter(function(g){return String(g.subject_id)===String(sub.id);});if(subGrades.length>0){var avgScore=Math.round(subGrades.reduce(function(sum,g){return sum+(Number(g.score)||0);},0)/subGrades.length);var predikat=avgScore>=90?'A':avgScore>=80?'B':avgScore>=70?'C':'D';gradeRows+='<tr><td style="padding:8px;border:1px solid #000;">'+sub.name+'</td><td style="padding:8px;border:1px solid #000;text-align:center;">'+(sub.kkm??'-')+'</td><td style="padding:8px;border:1px solid #000;text-align:center;">'+avgScore+'</td><td style="padding:8px;border:1px solid #000;text-align:center;">'+predikat+'</td></tr>';totalScore+=avgScore;totalSubjects++;}});var finalAvg=totalSubjects?(totalScore/totalSubjects).toFixed(1):0;var kopHTML=await generateKopHTML();var dateStr=new Date().toLocaleDateString('id-ID',{dateStyle:'long'});return '<div class="rapor-page" style="font-family:Arial;color:#000;page-break-after:always;break-after:page;">'+kopHTML+'<h3 style="text-align:center;margin:20px 0;">RAPOR SISWA</h3><table class="rapor-info-table" style="width:100%;margin-bottom:20px;"><tr><td style="width:100px;">Nama</td><td style="width:200px;">: '+(student.name||'-')+'</td><td style="width:100px;">Kelas</td><td>: '+(classes?.name||'-')+'</td></tr><tr><td>NIS</td><td>: '+(student.nis||'-')+'</td><td>Semester</td><td>: '+(profile.semester||'-')+'</td></tr></table><table style="width:100%;border-collapse:collapse;"><thead><tr style="background:#eee;"><th style="padding:8px;border:1px solid #000;">Mapel</ async function printRapor(studentId){try{var results=await Promise.all([DB.get('students'),DB.get('classes'),DB.get('grades'),DB.get('subjects'),DB.get('school_profile')]);var html=await buildRaporHTML(studentId,results);if(!html){showToast('Data siswa tidak ditemukan.','error');return;}html=html.replace('page-break-after:always;break-after:page;','page-break-after:auto;break-after:auto;');openPrintPreview(html);}catch(e){console.error('Cetak rapor gagal:',e);showToast('Gagal menyiapkan rapor.','error');}}
async function printAllRapor(){try{var results=await Promise.all([DB.get('students'),DB.get('classes'),DB.get('grades'),DB.get('subjects'),DB.get('school_profile')]);var students=results[0]||[];if(!students.length){showToast('Belum ada data siswa untuk dicetak.','error');return;}var pages=[];for(var i=0;i<students.length;i++){var page=await buildRaporHTML(students[i].id,results);if(page)pages.push(page);}if(!pages.length){showToast('Rapor tidak dapat dibuat.','error');return;}openPrintPreview(pages.join(''));}catch(e){console.error('Cetak semua rapor gagal:',e);showToast('Gagal menyiapkan semua rapor.','error');}}

 var data={name:document.getElementById('p_name')?.value||'',address:document.getElementById('p_address')?.value||'',principal:document.getElementById('p_principal')?.value||'',principal_nip:document.getElementById('p_principal_nip')?.value||'',kop_line1:document.getElementById('kop_line1')?.value||'',kop_line1b:document.getElementById('kop_line1b')?.value||'',kop_line2:document.getElementById('kop_line2')?.value||'',kop_line3:document.getElementById('kop_line3')?.value||''};

window.importAllDataJSON=function(event){var file=event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=async function(e){try{var data=JSON.parse(e.target.result);showToast('Mengimpor data, mohon tunggu...','info');var tables=Object.keys(data);for(var i=0;i<tables.length;i++){var t=tables[i];var rows=data[t];if(rows&&rows.length>0){var mappedRows=rows.map(function(r){return{...r,user_id:currentUser.id};});var res=await sb.from(t).upsert(mappedRows).select();if(res.error){console.error('Error importing table '+t+':',res.error);}}}showToast('Import data berhasil!','success');navigate('dashboard');}catch(err){showToast('Gagal import: '+err.message,'error');}};reader.readAsText(file);};
async function uploadAvatar(){
  var fileInput = document.getElementById('avatarFile');
  var file = fileInput.files[0];
  var btn = document.getElementById('btnUploadAvatar');
  
  if(!file){
    showToast('Silakan pilih file foto terlebih dahulu!','error');
    return;
  }
  
  if(!file.type.startsWith('image/')){
    showToast('File harus berupa gambar.','error');
    return;
  }
  
  if(btn){
    btn.disabled = true;
    btn.innerText = 'Sedang Mengunggah...';
  }
  
  showToast('Mengunggah foto profil...','info');
  
  try {
    // Ambil ekstensi file asli agar tidak corrupt
    var ext = (file.name.split('.').pop() || 'jpg').toLowerCase().replace(/[^a-z0-9]/g,'');
    if(ext.length > 4) ext = 'jpg'; // Fallback jika ekstensi aneh
    var fileName = 'user_'+currentUser.id+'_'+Date.now()+'.'+ext;
    
    var r = await sb.storage.from('avatars').upload(fileName, file, {
      cacheControl: '3600',
      upsert: false
    });
    
    if(r.error) throw r.error;
    
    var url = sb.storage.from('avatars').getPublicUrl(r.data.path).data.publicUrl;
    
    // Update tabel users
    var updRes = await sb.from('users').update({ avatar_url: url }).eq('id', currentUser.id);
    if(updRes.error) throw updRes.error;
    
    // Update local state & UI
    currentUser.avatar_url = url;
    localStorage.setItem('gs_currentUser', JSON.stringify(currentUser));
    
    var userAvatarEl = document.getElementById('userAvatar');
    if(userAvatarEl) userAvatarEl.src = url;
    
    var prevAvatarEl = document.getElementById('prevAvatar');
    if(prevAvatarEl) prevAvatarEl.src = url;
    
    showToast('Foto profil berhasil diperbarui!','success');
    fileInput.value = ''; // Reset input file
  } catch(err) {
    console.error('Upload Avatar Error:', err);
    showToast('Gagal upload: ' + (err.message || 'Unknown error'), 'error');
  } finally {
    if(btn){
      btn.disabled = false;
      btn.innerText = 'Upload Foto';
    }
  }
}

function addSchoolLogoToCardQR(qrTarget,logoUrl){

  if(!qrTarget.isConnected)return;
  var existing=qrTarget.querySelector('img.qr-school-logo');
  if(existing)existing.remove();
  var logo=document.createElement('img');
  logo.className='qr-school-logo';logo.alt='Logo sekolah pada QR';logo.src=logoUrl;
  logo.onerror=function(){logo.remove();};
  qrTarget.appendChild(logo);

 else setTimeout(finish,150);
}

}

function playBuzzerHorn() {
    kls_unlockAudio();
    var ctx = kls_audioCtx;
    var freqs = [196.00, 261.63, 329.63, 392.00, 523.25];
    var masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.8, ctx.currentTime + 0.03);
    masterGain.gain.setValueAtTime(0.8, ctx.currentTime + 0.4);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
    masterGain.connect(ctx.destination);
    freqs.forEach(function(f) {
        var osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = f;
        var gain = ctx.createGain();
        gain.gain.value = 0.2;
        osc.detune.value = Math.random() * 10 - 5;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.8);
    });
}

function playCorrectSound() {
    kls_unlockAudio(); 
    var ctx = kls_audioCtx;
    if(!ctx) return;
    var notes = [523.25, 659.25, 783.99, 1046.50]; 
    notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        var t = ctx.currentTime + i * 0.1;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.5, t + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
    });
}

// Parser JSON soal tangguh: merapikan output AI yang dibungkus teks/markdown
function gsParseSoalJSON(raw){
    try{
        var t=String(raw||'').trim();
        if(!t)return null;
        t=t.replace(/```json/gi,'').replace(/```/g,'').trim();
        function tryParse(s){
            try{
                var a=JSON.parse(s);
                if(!Array.isArray(a))return null;
                var clean=[];
                for(var i=0;i<a.length;i++){
                    var it=a[i]||{};
                    var q=String(it.text||it.pertanyaan||it.question||'').trim();
                    var ops=it.options||it.opsi||it.pilihan;
                    if(!q||!Array.isArray(ops)||ops.length<2)continue;
                    var ans=String(it.answer||it.jawaban||it.kunci||'').trim().charAt(0).toUpperCase();
                    if(!ans||'ABCD'.indexOf(ans)<0)ans='A';
                    var cleanOps=ops.map(function(o,oi){
                        var s2=String(o==null?'':o).trim();
                        s2=s2.replace(/^\**\s*[A-Da-d][\.\):]\s*/,'').replace(/\*+/g,'').trim();
                        return String.fromCharCode(65+oi)+'. '+s2;
                    });
                    clean.push({text:q,options:cleanOps,answer:ans});
                }
                return clean.length?clean:null;
            }catch(e){return null;}
        }
        var r1=tryParse(t);
        if(r1)return r1;
        var s=t.indexOf('['),e2=t.lastIndexOf(']');
        if(s>=0&&e2>s){
            var cand=t.substring(s,e2+1).replace(/,\s*([\]}])/g,'$1');
            var r2=tryParse(cand);
            if(r2)return r2;
        }
        return null;
    }catch(e){return null;}
}

function kls_confetti() {
    var colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6'];
    for (var i = 0; i < 50; i++) {
        var conf = document.createElement('div');
        conf.style.position = 'fixed';
        conf.style.zIndex = '9999';
        conf.style.left = Math.random() * 100 + 'vw';
        conf.style.top = '-20px';
        conf.style.width = '12px';
        conf.style.height = '12px';
        conf.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        conf.style.borderRadius = Math.random() > 0.5 ? '50%' : '0';
        conf.style.boxShadow = '0 0 10px ' + conf.style.backgroundColor;
        conf.style.transform = 'rotate(' + Math.random() * 360 + 'deg)';
        conf.style.transition = 'top 2.5s ease-out, transform 2.5s ease-out, opacity 2.5s ease-out';
        document.body.appendChild(conf);
        setTimeout(function() {
            conf.style.top = '100vh';
            conf.style.transform = 'rotate(720deg) translateX(50px)';
            conf.style.opacity = '0';
        }, 50);
        setTimeout(function() { conf.remove(); }, 3000);
    }
}

var kls_audioCtx = null;
var kls_ytPlayer = null;

function kls_loadYouTubeApi() {
    if (kls_ytApiLoaded) return;

function kls_initYTPlayer() {
    if (!document.getElementById('kls-yt-player')) {
        var div = document.createElement('div');
        div.id = 'kls-yt-player';
        div.style.cssText = 'position:fixed; top:-9999px; left:-9999px; width:1px; height:1px; opacity:0;';
        document.body.appendChild(div);
    }

    window.onYouTubeIframeAPIReady = function() {
        kls_ytPlayer = new YT.Player('kls-yt-player', {
            videoId: 'c6xBncftsUU', 
            playerVars: {
                'autoplay': 1,
                'controls': 0,
                'loop': 1,
                'playlist': 'c6xBncftsUU', 
                'mute': 0
            },
            events: {
                'onReady': function(event) {
                    event.target.setVolume(30); 
                    event.target.playVideo();
                }
            }
        });
    };
}

function kls_unlockAudio() {
    if (!kls_audioCtx) kls_audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (kls_audioCtx.state === 'suspended') {
        kls_audioCtx.resume().catch(function(e){ console.error("Audio resume failed", e); });
    }
}

function playBuzzerHorn() {
    kls_unlockAudio();
    var ctx = kls_audioCtx;
    var freqs = [196.00, 261.63, 329.63, 392.00, 523.25];
    var masterGain = ctx.createGain();
    masterGain.gain.setValueAtTime(0.0001, ctx.currentTime);
    masterGain.gain.exponentialRampToValueAtTime(0.8, ctx.currentTime + 0.03);
    masterGain.gain.setValueAtTime(0.8, ctx.currentTime + 0.4);
    masterGain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.8);
    masterGain.connect(ctx.destination);
    freqs.forEach(function(f) {
        var osc = ctx.createOscillator();
        osc.type = 'sawtooth';
        osc.frequency.value = f;
        var gain = ctx.createGain();
        gain.gain.value = 0.2;
        osc.detune.value = Math.random() * 10 - 5;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start(ctx.currentTime);
        osc.stop(ctx.currentTime + 0.8);
    });
}

function playCorrectSound() {
    kls_unlockAudio(); 
    var ctx = kls_audioCtx;
    if(!ctx) return;
    var notes = [523.25, 659.25, 783.99, 1046.50]; 
    notes.forEach(function(freq, i) {
        var osc = ctx.createOscillator();
        var gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = freq;
        var t = ctx.currentTime + i * 0.1;
        gain.gain.setValueAtTime(0.0001, t);
        gain.gain.exponentialRampToValueAtTime(0.5, t + 0.05); 
        gain.gain.exponentialRampToValueAtTime(0.0001, t + 0.4);
        osc.start(t);
        osc.stop(t + 0.4);
    });
}

function playWrongSound() {
    kls_unlockAudio(); 
    var ctx = kls_audioCtx;
    if(!ctx) return;
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(200, ctx.currentTime);
    osc.frequency.exponentialRampToValueAtTime(50, ctx.currentTime + 0.6);
    gain.gain.setValueAtTime(0.4, ctx.currentTime); 
    gain.gain.exponentialRampToValueAtTime(0.0001, ctx.currentTime + 0.6);
    osc.start(ctx.currentTime);
    osc.stop(ctx.currentTime + 0.6);
}

async function kls_loadList() {
    var box = document.getElementById('kls_list');
    if (!box) return;
    box.innerHTML = '<div class="col-span-full text-center py-10 text-slate-500"><span class="inline-block animate-spin mr-2">⟳</span> Memuat daftar kuis...</div>';

    try {
        if (!currentUser || !currentUser.id) {
            box.innerHTML = '<div class="col-span-full text-center py-8 text-amber-600 bg-amber-50 rounded-xl">Sesi pengguna belum aktif. Silakan keluar lalu masuk kembali.</div>';
            return;
        }

        // Ambil data kuis langsung agar pesan error database tidak tertelan oleh DB.get().
        var result = await sb.from('kuis_kelas')
            .select('*')
            .eq('user_id', currentUser.id)
            .order('created_at', { ascending: false });

        if (result.error) {
            console.error('Gagal memuat kuis kelas:', result.error);
            box.innerHTML = '<div class="col-span-full text-center py-8 px-4 text-red-600 bg-red-50 dark:bg-red-900/20 rounded-xl"><b>Daftar kuis gagal dimuat.</b><p class="mt-2 text-sm">' +
                String(result.error.message || 'Periksa tabel kuis_kelas dan izin akses Supabase.').replace(/[&<>"]/g, function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}) +

            return String(v == null ? '' : v).replace(/[&<>"]/g, function(c) {
                return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];
            });
        };
        var html = '';
        list.forEach(function(k) {

            }

            var id = String(k.id == null ? '' : k.id).replace(/'/g, "\\'");
            var title = esc(k.title || k.nama_kuis || 'Kuis tanpa judul');
            var mode = esc(k.mode || 'Rebutan');
            html += '<div class="group relative bg-white dark:bg-slate-800 border-2 border-slate-100 dark:border-slate-700 rounded-2xl p-5 flex flex-col justify-between transition-all hover:shadow-xl hover:-translate-y-1 hover:border-blue-300 dark:hover:border-blue-700 overflow-hidden">';
            html += '<div class="absolute top-0 right-0 w-24 h-24 bg-gradient-to-br from-blue-50 to-indigo-50 dark:from-slate-700 dark:to-slate-700 rounded-full -mr-12 -mt-12 group-hover:scale-150 transition-transform duration-500 pointer-events-none"></div>';

            html += '</div></div>';
        });

async function kls_start(id) {
    var k = (await DB.get('kuis_kelas')).find(function(x) { return x.id === id; });
    if (!k) return;
    
    kls_data.soal = JSON.parse(k.soal);
    kls_data.kelompok = k.kelompok.split(',').map(function(x){ return x.trim(); });
    kls_data.skor = {};
    kls_data.kelompok.forEach(function(t){ kls_data.skor[t] = 0; });
    kls_data.soalIndex = 0;
    kls_data.mode = k.mode;
    kls_data.timer = k.waktu;
    kls_data.poin = k.poin;
    kls_data.currentTeam = null;
    kls_data.isBuzzed = false;
    kls_data.isLocked = false;
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    
    kls_data.currentRoom = 'kls-' + Math.random().toString(36).substr(2, 6);
    await sb.from('kuis_buzzer').delete().eq('room', kls_data.currentRoom);
    
    if (kls_data.realtimeChannel) kls_data.realtimeChannel.unsubscribe();
    
    kls_data.realtimeChannel = sb.channel(kls_data.currentRoom, {
      config: { broadcast: { self: false } }
    })
      .on('broadcast', { event: 'buzz' }, function(payload) {
          if (payload && payload.message && payload.message.team) {
              if (kls_data.kelompok.includes(payload.message.team)) {
                  kls_buzz(payload.message.team); 
              }
          }
      })
      .on('broadcast', { event: 'request_sync' }, function(payload) {
          if (kls_data.realtimeChannel) {
              kls_data.realtimeChannel.send({
                  type: 'broadcast',
                  event: 'sync',
                  payload: { teams: kls_data.kelompok }
              });
          }
      })
      .subscribe();
      
    if (kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
    kls_data.fallbackInterval = setInterval(async function() {
        if (kls_data.isLocked || kls_data.isBuzzed || !kls_data.currentRoom) return;
        try {
            var res = await sb.from('kuis_buzzer').select('*').eq('room', kls_data.currentRoom).limit(1);
            if (res.data && res.data.length > 0) {
                var team = res.data[0].team;
                if (kls_data.kelompok.includes(team)) {
                    kls_buzz(team);
                    await sb.from('kuis_buzzer').delete().eq('room', kls_data.currentRoom);
                }
            }
        } catch(e) {}
    }, 200);
      
    kls_showJoinQR();
}

    var joinUrl = hostUrl + '#join-' + encodeURIComponent(joinRoom) + '--teams-' + encodeURIComponent(JSON.stringify(joinTeams));

function kls_renderScore() {
    var sorted = Object.entries(kls_data.skor).sort(function(a, b) { return b[1] - a[1]; });
    var medals = ['🥇', '🥈', '🥉', '4️⃣'];
    var teamStyleMap = {};
    kls_data.kelompok.forEach(function(t, i){ teamStyleMap[t] = kls_team_colors[i % kls_team_colors.length]; });
    
    var html = '';
    sorted.forEach(function(s, i) {
        var style = teamStyleMap[s[0]] || { grad: 'from-slate-500 to-slate-600', glow: '' };
        var scaleUp = i===0 ? 'border-yellow-400' : 'border-slate-700';
        html += '<div class="flex justify-between items-center border-2 '+scaleUp+' p-2 rounded-lg bg-slate-800/80">';
        html += '  <span class="text-white text-sm font-bold flex items-center gap-2 truncate">';
        html += '    <span class="text-xl">'+medals[i]+'</span> '+s[0];
        html += '  </span>';
        html += '  <div class="flex-none ml-2">';
        html += '    <div class="bg-gradient-to-r '+style.grad+' text-white px-2 py-1 rounded-md font-bold text-sm '+style.glow+'">'+s[1]+'</div>';
        html += '  </div>';
        html += '</div>';
    });
    return html;
}

function kls_buzz(team) {
    if (kls_data.isLocked) return; 
    if (kls_data.isBuzzed) return; 
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    
    kls_unlockAudio();
    playBuzzerHorn(); 
    
    kls_data.currentTeam = team;
    kls_data.isBuzzed = true;
    kls_renderLive();
}

function kls_answer(opt) {
    if (!kls_data.isBuzzed) {
        showToast('Tekan Buzzer dulu!', 'error');
        return;
    }
    if (kls_data.isLocked) return; 
    
    kls_data.isLocked = true; 
    if(kls_data.intervalId) clearInterval(kls_data.intervalId);
    kls_unlockAudio();
    
    var q = kls_data.soal[kls_data.soalIndex];
    var correct = q.answer;
    var isCorrect = opt.indexOf(correct + '.') === 0 || opt.startsWith(correct + '.');
    
    var teamStyleMap = {};
    kls_data.kelompok.forEach(function(t, i){ teamStyleMap[t] = kls_team_colors[i % kls_team_colors.length]; });
    
    document.querySelectorAll('#kls_live_container .opt-card').forEach(function(el) {
        var optText = decodeURIComponent(el.dataset.opt);
        var isThisCorrect = optText.indexOf(correct + '.') === 0 || optText.startsWith(correct + '.');
        
        el.removeAttribute('onclick'); 
        el.classList.remove('cursor-pointer', 'hover:scale-105', 'hover:brightness-110', 'opacity-50');
        el.classList.add('cursor-not-allowed');
        
        if(isThisCorrect) {
            el.className = 'opt-card bg-gradient-to-r from-green-400 to-emerald-500 p-4 rounded-xl border-2 border-green-300 text-white font-bold flex items-center gap-3 shadow-[0_0_20px_rgba(16,185,129,0.7)]';
            el.style.transform = 'scale(1.05)';
            el.innerHTML += '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg>';
        } else if (optText === opt) {
            el.className = 'opt-card bg-gradient-to-r from-red-500 to-rose-600 p-4 rounded-xl border-2 border-red-300 text-white font-bold flex items-center gap-3 shadow-[0_0_20px_rgba(239,68,68,0.7)]';
            el.style.animation = 'kls_shake 0.4s ease-in-out';
            el.innerHTML += '<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 ml-auto" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg>';
        } else {
            el.className = 'opt-card bg-slate-800 p-4 rounded-xl border-2 border-slate-700 text-slate-500 opacity-50 flex items-center gap-3';
        }
    });
    
    var badgeStyle = teamStyleMap[kls_data.currentTeam] || { grad: 'from-slate-700 to-slate-800', glow: '' };
    var scoreBadge = document.createElement('div');
    scoreBadge.className = 'fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-[100] text-white text-4xl font-extrabold py-4 px-8 rounded-2xl flex items-center gap-2 bg-gradient-to-br '+badgeStyle.grad+' '+badgeStyle.glow;
    
    if (isCorrect) {
        playCorrectSound(); 
        kls_data.skor[kls_data.currentTeam] += kls_data.poin;
        scoreBadge.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M5 13l4 4L19 7" /></svg> +'+kls_data.poin;
        scoreBadge.style.animation = 'kls_bounce 0.5s ease-out';
        document.body.appendChild(scoreBadge);
        kls_confetti();
        showToast('🎉 BENAR! '+kls_data.currentTeam+' +'+kls_data.poin+' POIN', 'success');
    } else {
        playWrongSound(); 
        kls_data.skor[kls_data.currentTeam] -= Math.floor(kls_data.poin / 2);
        scoreBadge.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" class="h-10 w-10" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M6 18L18 6M6 6l12 12" /></svg> -'+Math.floor(kls_data.poin / 2);
        scoreBadge.style.animation = 'kls_shake 0.4s ease-in-out';
        document.body.appendChild(scoreBadge);
        showToast('❌ SALAH! Jawaban benar ditandai hijau.', 'error');
    }
    
    setTimeout(function() {
        scoreBadge.style.transition = 'opacity 0.5s, transform 0.5s';
        scoreBadge.style.opacity = '0';
        if(isCorrect) scoreBadge.style.transform = 'translate(-50%, -150%) scale(0.8)';
        else scoreBadge.style.transform = 'translate(-50%, 50%) scale(0.8)';
        setTimeout(function() { scoreBadge.remove(); }, 500);
    }, 1500);
    
    kls_updateScore();
    
    setTimeout(function() {
        kls_data.soalIndex++;
        kls_data.currentTeam = null;
        kls_data.isBuzzed = false;
        kls_data.isLocked = false;
        if (kls_data.soalIndex < kls_data.soal.length) {
            kls_renderLive();
        } else {
            kls_end();
        }
    }, 2500); 
}

function kls_skip() {
    if (confirm('Lewati soal ini? Tidak ada poin yang ditambahkan.')) {
        if(kls_data.intervalId) clearInterval(kls_data.intervalId);
        kls_data.isLocked = true;
        showToast('Soal dilewati.', 'info');
        setTimeout(function() {
            kls_data.soalIndex++;
            kls_data.currentTeam = null;
            kls_data.isBuzzed = false;
            kls_data.isLocked = false;
            if (kls_data.soalIndex < kls_data.soal.length) {
                kls_renderLive();
            } else {
                kls_end();
            }
        }, 500);
    }
}

function kls_startTimer() {
    if(kls_data.intervalId) clearInterval(kls_data.intervalId); 
    var timer = kls_data.timer;
    var timerEl = document.getElementById('kls_timer');
    if(timerEl) timerEl.innerText = timer;
    
    kls_data.intervalId = setInterval(function() {
        timer--;
        var el = document.getElementById('kls_timer');
        if (el) el.innerText = timer;
        
        if (timer <= 0) {
            clearInterval(kls_data.intervalId);
            kls_data.intervalId = null;
            showToast('⏳ Waktu habis!', 'error');
            kls_data.isLocked = true; 
            
            setTimeout(function() {
                kls_data.soalIndex++;
                kls_data.currentTeam = null;
                kls_data.isBuzzed = false;
                kls_data.isLocked = false;
                
                if (kls_data.soalIndex < kls_data.soal.length) {
                    kls_renderLive();
                } else {
                    kls_end();
                }
            }, 500);
        }
    }, 1000);
}

function kls_updateScore() {
    var el = document.getElementById('kls_scoreboard');
    if (el) {
        el.innerHTML = kls_renderScore();
        var divs = el.querySelectorAll('div');
        divs.forEach(function(d) {
            d.style.transition = 'all 0.5s ease';
            d.style.transform = 'scale(1.05)';
            setTimeout(function() { d.style.transform = 'scale(1)'; }, 500);
        });
    }
}

function kls_end() {
    if(kls_data.intervalId) clearInterval(kls_data.intervalId);
    if(kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
    stopBgMusic(); 
    kls_data.intervalId = null;
    kls_data.isLocked = false;
    kls_data.isBuzzed = false;
    if (kls_data.realtimeChannel) kls_data.realtimeChannel.unsubscribe();
    
    for(var i=0; i<5; i++) {
        setTimeout(kls_confetti, i * 300);
    }
    
    var sorted = Object.entries(kls_data.skor).sort(function(a, b) { return b[1] - a[1]; });
    var html = '<div class="bg-slate-950 p-8 rounded-3xl text-center shadow-2xl border border-white/10 overflow-hidden relative">';
    html += '  <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-green-400 via-blue-500 to-purple-600" style="box-shadow: 0 0 10px rgba(59,130,246,0.8);"></div>';
    html += '  <div class="mb-6 mt-4">';
    html += '    <div class="inline-block p-4 bg-gradient-to-br from-yellow-400 to-orange-500 rounded-full shadow-xl mb-4" style="box-shadow: 0 0 25px rgba(251,191,36,0.6);"><svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11.049 2.927c.3-.921 1.603-.921 1.902 0l1.519 4.674a1 1 0 00.95.69h4.915c.969 0 1.371 1.24.588 1.81l-3.976 2.888a1 1 0 00-.363 1.118l1.518 4.674c.3.922-.755 1.688-1.538 1.118l-3.976-2.888a1 1 0 00-1.176 0l-3.976 2.888c-.783.57-1.838-.196-1.538-1.118l1.518-4.674a1 1 0 00-.363-1.118l-3.976-2.888c-.783-.57-.38-1.81.588-1.81h4.914a1 1 0 00.951-.69l1.519-4.674z" /></svg></div>';
    html += '    <h2 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 via-yellow-400 to-orange-500 mt-2 tracking-wider" style="text-shadow: 0 0 20px rgba(251,191,36,0.4);">JUARA HARI INI</h2>';
    html += '    <p class="text-slate-300 mt-2 text-lg">Selamat kepada pemenang! 🎉</p>';
    html += '  </div>';
    html += '  <div class="space-y-4 max-w-md mx-auto">';
    
    var gold = 'border-yellow-400 bg-gradient-to-r from-yellow-500/20 to-amber-500/20';
    var silver = 'border-slate-300 bg-gradient-to-r from-slate-400/20 to-slate-300/20';
    var bronze = 'border-orange-300 bg-gradient-to-r from-orange-400/20 to-red-400/20';
    
    sorted.forEach(function(s, i) {
        var bg = i===0 ? gold : (i===1 ? silver : bronze);
        var medal = ['🥇','🥈','🥉'][i] || (i+1)+'️⃣';
        var scale = i===0 ? 'scale-105 shadow-[0_0_20px_rgba(251,191,36,0.3)]' : '';
        var textGlow = i===0 ? 'text-yellow-400' : i===1 ? 'text-slate-200' : 'text-orange-400';
        html += '    <div class="flex justify-between items-center p-5 rounded-2xl border-2 '+bg+' '+scale+' transition-all">';
        html += '      <span class="font-bold text-xl text-white flex items-center gap-4"><span class="text-3xl">'+medal+'</span> '+s[0]+'</span>';
        html += '      <span class="font-bold text-3xl '+textGlow+'" style="text-shadow: 0 0 10px rgba(255,255,255,0.3);">'+s[1]+'</span>';
        html += '    </div>';
    });
    html += '  </div>';
    html += '  <button onclick="document.getElementById(\'kls_live_container\').classList.add(\'hidden\')" class="mt-8 bg-slate-700 hover:bg-slate-600 text-white px-6 py-2.5 rounded-lg font-semibold transition flex items-center gap-2 mx-auto"><svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18" /></svg> Kembali ke Daftar Kuis</button>';
    html += '</div>';
    
    document.getElementById('kls_live_container').innerHTML = html;
    
    kls_unlockAudio();
    playCorrectSound();
    setTimeout(playCorrectSound, 500);
    setTimeout(playCorrectSound, 1000);
}

function kls_stop() {
    if (confirm('Akhiri kuis sekarang? Skor akan langsung dihitung.')) {
        if(kls_data.intervalId) clearInterval(kls_data.intervalId);
        if(kls_data.fallbackInterval) clearInterval(kls_data.fallbackInterval);
        kls_end();
    }
}

// (early-detect). Script ini hanya sebagai fallback pengaman: jika

(function() {
    if (!window.__BUZZER_MODE__) return; // Bukan mode buzzer, skip
    // Jika UI buzzer sudah dirender oleh head script, tidak perlu apa-apa
    if (document.getElementById('studentApp')) return;
    // Head script gagal render — paksa render sekarang
    if (typeof window.__renderBuzzerUI === 'function') {
        try { window.__renderBuzzerUI(); } catch(e){ console.error('Buzzer fallback error:', e); }
    }
})();

 if(!root)return;

<script>
/* Format profesional untuk seluruh ekspor Excel; data dan proses ekspor asli tetap dipertahankan. */
(function(){
  if(typeof XLSX==='undefined'||!XLSX.writeFile||XLSX.__guruExcelFormatInstalled)return;
  var originalWriteFile=XLSX.writeFile;
  XLSX.writeFile=function(wb,filename,opts){
    try{
      (wb.SheetNames||[]).forEach(function(sheetName){
        var ws=wb.Sheets[sheetName]; if(!ws||!ws['!ref'])return;
        var range=XLSX.utils.decode_range(ws['!ref']);
        var border={top:{style:'thin',color:{rgb:'CBD5E1'}},bottom:{style:'thin',color:{rgb:'CBD5E1'}},left:{style:'thin',color:{rgb:'CBD5E1'}},right:{style:'thin',color:{rgb:'CBD5E1'}}};
        var headerRows=[];
        for(var r=range.s.r;r<=range.e.r;r++){
          var vals=[]; for(var c=range.s.c;c<=range.e.c;c++){var cc=ws[XLSX.utils.encode_cell({r:r,c:c})];vals.push(cc?String(cc.v==null?'':cc.v).trim():'');}
          if(vals.some(function(v){return v==='No';})&&vals.some(function(v){return v==='Nama';})&&(vals.some(function(v){return v==='NIS';})||vals.some(function(v){return /^Tgl\s*\d+$/i.test(v);})))headerRows.push(r);
        }
        for(var r=range.s.r;r<=range.e.r;r++){
          var rowHasValue=false; for(var c=range.s.c;c<=range.e.c;c++){var x=ws[XLSX.utils.encode_cell({r:r,c:c})];if(x&&x.v!==undefined&&x.v!==null&&String(x.v)!==''){rowHasValue=true;break;}}
          if(!rowHasValue)continue;
          for(var c=range.s.c;c<=range.e.c;c++){
            var addr=XLSX.utils.encode_cell({r:r,c:c}); var cell=ws[addr]; if(!cell)continue;
            cell.s=cell.s||{};
            cell.s.alignment={horizontal:'center',vertical:'center',wrapText:true};
            cell.s.border=border;
            if(headerRows.indexOf(r)!==-1){cell.s.fill={patternType:'solid',fgColor:{rgb:'1E3A8A'}};cell.s.font={bold:true,color:{rgb:'FFFFFF'},name:'Arial',sz:10};}
            else if(typeof cell.v==='string'&&(/^(DATA SISWA|DAFTAR HADIR SISWA|DAFTAR HADIR KEGIATAN)$/.test(cell.v.trim()))){cell.s.fill={patternType:'solid',fgColor:{rgb:'DBEAFE'}};cell.s.font={bold:true,color:{rgb:'1E3A8A'},name:'Arial',sz:12};}
            else if(r<=4&&typeof cell.v==='string'&&cell.v.trim()){cell.s.font={bold:r===1||r===3,color:{rgb:'1F2937'},name:'Arial',sz:r===1?14:10};}
            else {cell.s.font=Object.assign({name:'Arial',sz:10},cell.s.font||{});if((r%2)===0)cell.s.fill={patternType:'solid',fgColor:{rgb:'F8FAFC'}};}
          }
        }
        ws['!rows']=ws['!rows']||[];
        for(var r=range.s.r;r<=range.e.r;r++)if(headerRows.indexOf(r)!==-1)ws['!rows'][r]=Object.assign({},ws['!rows'][r]||{},{hpt:30});
        ws['!autofilter']=ws['!autofilter']||{ref:XLSX.utils.encode_range({s:{r:headerRows.length?headerRows[0]:range.s.r,c:range.s.c},e:range.e})};
      });
    }catch(e){console.warn('Pemformatan Excel:',e);}
    return originalWriteFile.call(this,wb,filename,opts);
  };
  XLSX.__guruExcelFormatInstalled=true;
})();
</script>
<script>
/* ==================================================================
   FOTO GURU — Upload & tampilkan foto di halaman Data Guru
   - Kolom Foto di tabel + avatar inisial jika belum ada foto
   - Upload via form Tambah/Edit Guru (otomatis dikompres, sisi maks 400px)
   - Klik foto di tabel = pratinjau • klik avatar kosong = tambah foto
   - Disimpan sebagai dataURL di kolom 'photo' (teks) tabel teachers
   ================================================================== */
(function(){
  var TCH_PLACEHOLDER='data:image/svg+xml;charset=UTF-8,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="50" fill="#e2e8f0"/><circle cx="50" cy="38" r="17" fill="#94a3b8"/><path d="M15 94c4-19 19-27 35-27s31 8 35 27z" fill="#94a3b8"/></svg>');
  window.TCH_PHOTO_PLACEHOLDER=TCH_PLACEHOLDER;
  window.gsTeacherInitials=function(n){var s=String(n||'').trim();if(!s)return '?';var p=s.split(/\s+/).slice(0,2);return p.map(function(w){return w.charAt(0).toUpperCase();}).join('')||'?';};
  function gsCompressImage(file,maxSide,quality){
    return new Promise(function(res,rej){
      if(!file){rej(new Error('Tidak ada file'));return;}
      if(file.type&&file.type.indexOf('image/')!==0){rej(new Error('File bukan gambar'));return;}
      var fr=new FileReader();
      fr.onload=function(){
        var img=new Image();
        img.onload=function(){
          try{
            var w=img.naturalWidth||img.width||1,h=img.naturalHeight||img.height||1;
            var sc=Math.min(1,(parseInt(maxSide,10)||400)/Math.max(w,h));
            var cw=Math.max(1,Math.round(w*sc)),ch=Math.max(1,Math.round(h*sc));
            var cv=document.createElement('canvas');cv.width=cw;cv.height=ch;
            var ctx=cv.getContext('2d');
            ctx.fillStyle='#ffffff';ctx.fillRect(0,0,cw,ch);
            ctx.drawImage(img,0,0,cw,ch);
            var du=cv.toDataURL('image/jpeg',(typeof quality==='number'?quality:0.85));
            if(!du||du.indexOf('data:image')!==0){rej(new Error('Hasil kompresi kosong'));return;}
            res(du);
          }catch(e){rej(e);}
        };
        img.onerror=function(){rej(new Error('Format gambar tidak didukung browser'));};
        img.src=fr.result;
      };
      fr.onerror=function(){rej(new Error('Gagal membaca file'));};
      fr.readAsDataURL(file);
    });
  }
  window.gsCompressImage=gsCompressImage;
  window.tchPhotoPicked=async function(ev){
    var inp=ev&&ev.target;var f=inp&&inp.files&&inp.files[0];
    if(!f)return;
    var hid=document.getElementById('tch_photo'),pv=document.getElementById('tch_photo_preview');
    if(!hid||!pv){showToast('Formulir foto tidak ditemukan.','error');return;}
    try{
      showToast('Memproses foto...','info');
      var du=await gsCompressImage(f,400,0.85);
      hid.value=du;pv.src=du;
      showToast('Foto siap. Klik "Simpan" untuk menyimpan.','success');
    }catch(e){showToast('Gagal memproses foto: '+(e.message||e),'error');}
    finally{if(inp)inp.value='';}
  };
  window.tchPhotoClear=function(){
    var hid=document.getElementById('tch_photo'),pv=document.getElementById('tch_photo_preview');
    if(hid)hid.value='__GS_CLEAR__';
    if(pv)pv.src=TCH_PLACEHOLDER;
  };
  window.teacherPhotoAction=function(id){
    return DB.get('teachers').then(function(list){
      var t=null;for(var i=0;i<(list||[]).length;i++){if(list[i].id===id){t=list[i];break;}}
      if(!t)return;
      if(t.photo){
        openModal('📷 Foto Guru',
          '<div class="text-center">'
          +'<img src="'+t.photo+'" alt="Foto guru" class="max-w-full rounded-xl mx-auto shadow-md bg-slate-100 dark:bg-slate-700" style="max-height:60vh;object-fit:contain">'
          +'<p class="text-sm font-semibold text-slate-700 dark:text-slate-200 mt-3">'+String(t.name||'')+(t.subject?' • '+String(t.subject):'')+'</p>'
          +'<div class="flex justify-center gap-2 mt-4"><button onclick="closeModal();teacherForm(\''+id+'\')" class="bg-amber-500 hover:bg-amber-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">✏️ Ganti Foto</button></div>'
          +'</div>');
      }else{
        showToast('Guru ini belum punya foto. Unggah lewat formulir berikut.','info');
        teacherForm(id);
      }
    }).catch(function(e){showToast('Gagal memuat data guru: '+(e.message||e),'error');});
  };
  window.gsPhotoColumnHelp=function(){
    openModal('⚠️ Kolom "photo" Belum Ada',
      '<div class="text-sm text-slate-600 dark:text-slate-300 space-y-2">'
      +'<p>Fitur <b>Foto Guru</b> membutuhkan kolom <b>photo</b> (bertipe teks) pada tabel <b>teachers</b> di Supabase.</p>'
      +'<p class="font-semibold">Cara memperbaiki:</p>'
      +'<p>1. Buka <b>Supabase → SQL Editor</b>.</p>'
      +'<p>2. Jalankan SQL berikut:</p>'
      +'<pre class="p-3 bg-slate-100 dark:bg-slate-900 rounded-lg overflow-x-auto text-[11px] leading-relaxed whitespace-pre-wrap">alter table teachers add column if not exists photo text;</pre>'
      +'<p>3. Muat ulang halaman, lalu ulangi unggah foto.</p>'
      +'</div>');
  };
})();
</script>
