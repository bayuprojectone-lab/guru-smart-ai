        async function loadAttendanceData() {
            const dateVal = document.getElementById('att_date')?.value || new Date().toISOString().split('T')[0];
            const month = dateVal.substring(0, 7);
            const { data: attData, error } = await sb.from('attendance')
                .select('*')
                .eq('user_id', currentUser.id)
                .gte('date', `${month}-01`)
                .lte('date', `${month}-31`);

            if (error) {
                console.error("Error loading attendance:", error);
                return;
            }

            if (attData) {
                attData.forEach(att => {
                    const day = new Date(att.date).getDate();
                    const cell = document.getElementById(`att_${att.student_id}_${day}`);
                    if (cell) {
                        cell.innerText = att.status;
                        cell.style.color = att.status === 'H' ? 'green' : att.status === 'A' ? 'red' : 'orange';
                    }
                });
                updateRecap();
            }
        }

        window.setAttendance = function(studentId, day, status) {
            const cell = document.getElementById(`att_${studentId}_${day}`);
            const isDouble = cell.innerText === status;
            status = isDouble ? '' : document.getElementById('att_status_global').value;
            cell.innerText = status;
            cell.style.color = status === 'H' ? 'green' : status === 'A' ? 'red' : status === '' ? '' : 'orange';
            updateRecap();
        }

        function updateRecap() {
            document.querySelectorAll('tr').forEach(row => {
                const idMatch = row.querySelector('td[id^="att_"]');
                if (idMatch) {
                    const studentId = idMatch.id.split('_')[1];
                    let h=0, s=0, i=0, a=0;
                    for(let d=1; d<=31; d++) {
                        const cell = document.getElementById(`att_${studentId}_${d}`);
                        const val = cell?.innerText || '';
                        if (val === 'H') h++;
                        else if (val === 'S') s++;
                        else if (val === 'I') i++;
                        else if (val === 'A') a++;
                    }
                    const recapH = document.getElementById(`recap_h_${studentId}`);
                    if (recapH) recapH.innerText = h;
                    const recapS = document.getElementById(`recap_s_${studentId}`);
                    if (recapS) recapS.innerText = s;
                    const recapI = document.getElementById(`recap_i_${studentId}`);
                    if (recapI) recapI.innerText = i;
                    const recapA = document.getElementById(`recap_a_${studentId}`);
                    if (recapA) recapA.innerText = a;
                }
            });
        }

        async function startNativeScanner() {
            const date = document.getElementById('att_date').value;
            if(!date){ showToast('Pilih tanggal absensi dahulu!', 'error'); return; }
            
            openModal('Scan QR Siswa', `
                <div id="qr-reader" style="width: 100%; max-width: 400px; margin: 0 auto; border-radius: 12px; overflow: hidden;"></div>
                <p class="text-center text-sm mt-3 text-slate-500 dark:text-slate-400">Arahkan kamera ke QR Code siswa.</p>
                <div id="qr-status" class="text-center text-xs text-blue-500 mt-2">Memulai kamera...</div>
                
                <div class="mt-4 border-top pt-4 dark:border-slate-700">
                    <p class="text-xs text-slate-500 dark:text-slate-400 text-center mb-2">Jika tidak terbaca, input NIS manual di bawah:</p>
                    <div class="flex gap-2">
                        <input type="text" id="manual-nis-input" placeholder="Masukkan NIS" class="flex-1 px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white text-sm">
                        <button onclick="manualInputNIS()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Cari</button>
                    </div>
                </div>
            `);

            const statusEl = document.getElementById('qr-status');

            try {
                html5QrCode = new Html5Qrcode("qr-reader");
                const config = {
                    fps: 10,
                    qrbox: (videoWidth, videoHeight) => {
                        const minEdge = Math.min(videoWidth, videoHeight);
                        const size = Math.floor(minEdge * 0.7);
                        return { width: size, height: size };
                    },
                    aspectRatio: 1.333
                };
                
                await html5QrCode.start(
                    { facingMode: "environment" },
                    config,
                    (decodedText) => {
                        stopCameraStream();
                        playBeep();
                        processQRResult(decodedText);
                    },
                    (errorMessage) => {
                        // Ignore
                    }
                );
                
                statusEl.innerText = "Kamera aktif. Arahkan ke QR Code.";
                statusEl.className = "text-center text-xs text-green-500 mt-2";

            } catch (err) {
                console.error("Kamera Error:", err);
                statusEl.innerText = "Gagal mengakses kamera otomatis. Silakan gunakan input manual NIS di bawah.";
                statusEl.className = "text-center text-xs text-red-500 mt-2";
                showToast('Gagal akses kamera. Gunakan input manual.', 'error');
            }
        }

        function playBeep() {
            try {
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const oscillator = audioCtx.createOscillator();
                const gainNode = audioCtx.createGain();
                oscillator.connect(gainNode);
                gainNode.connect(audioCtx.destination);
                oscillator.type = 'sine';
                oscillator.frequency.value = 1000;
                gainNode.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start();
                oscillator.stop(audioCtx.currentTime + 0.5);
            } catch(e) {
                console.log("Audio play error", e);
            }
        }

        window.manualInputNIS = async function() {
            const inputVal = document.getElementById('manual-nis-input').value.trim();
            if(inputVal) {
                closeModal();
                processQRResult(inputVal);
            } else {
                showToast('NIS tidak boleh kosong!', 'error');
            }
        }

        function stopCameraStream() {
            if (html5QrCode) {
                html5QrCode.stop().then(() => {
                    html5QrCode.clear();
                    html5QrCode = null;
                }).catch((err) => {
                    console.error("Error stopping camera", err);
                    html5QrCode = null;
                });
            }
        }

        async function processQRResult(decodedText) {
            const students = await DB.get('students');
            const std = students.find(s => s.nis === decodedText);
            if (std) {
                const dateVal = document.getElementById('att_date').value;
                if (!dateVal) { showToast('Pilih tanggal dahulu!', 'error'); return; }
                const day = new Date(dateVal).getDate();
                const cell = document.getElementById(`att_${std.id}_${day}`);
                if (cell) {
                    cell.innerText = 'H';
                    cell.style.color = 'green';
                    updateRecap();
                    showToast(`✅ ${std.name} berhasil absen!`, 'success');
                } else {
                    showToast(`Siswa tidak ditemukan di daftar absensi.`, 'error');
                }
            } else {
                showToast(`QR Code tidak dikenali: ${decodedText}`, 'error');
            }
        }

        async function saveAttendance() { 
            const students = await DB.get('students');
            const dateVal = document.getElementById('att_date').value;
            if(!dateVal){ showToast('Pilih tanggal!', 'error'); return; }
            const day = new Date(dateVal).getDate();
            let saved = 0;
            let errors = 0;
            
            for(const s of students) {
                const cell = document.getElementById(`att_${s.id}_${day}`);
                const status = cell?.innerText || '';
                
                if (status !== '') {
                    try {
                        const { data: existingAtt } = await sb.from('attendance')
                            .select('id, status')
                            .eq('student_id', s.id)
                            .eq('date', dateVal)
                            .eq('user_id', currentUser.id)
                            .maybeSingle(); 
                            
                        if (existingAtt) {
                            const { error: updateErr } = await sb.from('attendance')
                                .update({ status })
                                .eq('id', existingAtt.id)
                                .eq('user_id', currentUser.id);
                            if (updateErr) throw updateErr;
                            saved++;
                        } else {
                            const { error: insertErr } = await sb.from('attendance')
                                .insert([{ 
                                    user_id: currentUser.id,
                                    student_id: s.id, 
                                    date: dateVal, 
                                    status, 
                                    subject: 'Umum' 
                                }]);
                            if (insertErr) throw insertErr;
                            saved++;
                        }
                    } catch (err) {
                        console.error("Error saving attendance for", s.name, err);
                        errors++;
                    }
                }
            }
            
            if (errors > 0) {
                showToast(`Gagal menyimpan ${errors} data. Cek console.`, 'error');
            } else {
                showToast(`${saved} data absensi tersimpan!`, 'success');
            }

            await loadAttendanceData();

ikat</th></tr></thead><tbody>${gradeRows || `<tr><td colspan="4" style="text-align:center; padding: 10px; border: 1px solid #000;">Belum ada nilai</td></tr>`}</tbody><tfoot><tr><td colspan="2" style="padding: 8px; border: 1px solid #000; text-align: right;">Rata-rata:</td><td colspan="2" style="padding: 8px; border: 1px solid #000; text-align: center;">${finalAvg}</td></tr></tfoot></table></div>`; openPrintPreview(printableHTML); }

        let recognition = null;
        function toggleVoiceInput() {
            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
            const micBtn = document.getElementById('aiMicBtn');
            const micIcon = document.getElementById('micIcon');
            const input = document.getElementById('aiInput');

            if (!SpeechRecognition) {
                showToast('Browser Anda tidak mendukung Voice Note. Gunakan Chrome.', 'error');
                return;
            }

            if (recognition && recognition.isListening) {
                recognition.stop();
                recognition.isListening = false;
                micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-white');
                return;
            }

            recognition = new SpeechRecognition();
            recognition.lang = 'id-ID';
            recognition.interimResults = true;
            recognition.isListening = true;

            let finalTranscript = '';
            let baseText = input.value ? input.value + ' ' : '';

            recognition.onstart = () => {
                micBtn.classList.add('bg-red-500', 'text-white', 'animate-pulse');
                micBtn.classList.remove('bg-slate-200', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-white');
                showToast('Mendengarkan... Klik lagi untuk berhenti', 'info');
            };

            recognition.onresult = (event) => {
                let interimTranscript = '';
                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript += event.results[i][0].transcript;
                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                input.value = baseText + finalTranscript + interimTranscript;
                input.scrollTop = input.scrollHeight;
            };

            recognition.onerror = (event) => {
                showToast('Error Mikrofon: ' + event.error, 'error');
                recognition.isListening = false;
                micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                micBtn.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-white');
            };

            recognition.onend = () => {
                if (recognition.isListening) {
                    recognition.isListening = false;
                    micBtn.classList.remove('bg-red-500', 'text-white', 'animate-pulse');
                    micBtn.classList.add('bg-slate-200', 'dark:bg-slate-700', 'text-slate-600', 'dark:text-white');
                    if (input.value.trim() !== '') {
                        sendAI();
                    }
                }
            };

            try {
                recognition.start();
            } catch (e) {
                console.error(e);
            }
        }

        async function handleAIImageUpload(event) { const file = event.target.files[0]; if (!file) return; const btn=document.getElementById('aiSendBtn'); btn.disabled=true; btn.innerText='Memproses Gambar...'; const box=document.getElementById('aiMessages'); const reader = new FileReader(); reader.onload = async (e) => { const imgUrl = e.target.result; const userMsgDiv = document.createElement('div'); userMsgDiv.className = 'flex justify-end fade-in'; userMsgDiv.innerHTML = `<div class="max-w-[80%] rounded-xl px-2 py-2 bg-blue-600 text-white shadow-sm"><div class="text-xs opacity-70 mb-1 px-2">Anda (Gambar)</div><img src="${imgUrl}" class="rounded-lg max-w-full h-auto"></div>`; box.appendChild(userMsgDiv); const typingDiv = document.createElement('div'); typingDiv.id = 'typingIndicator'; typingDiv.className = 'flex justify-start fade-in'; typingDiv.innerHTML = `<div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1 text-gray-500 dark:text-slate-400">Asisten AI</div><div class="animate-pulse text-blue-600">Sedang membaca teks gambar (OCR)...</div></div>`; box.appendChild(typingDiv); box.scrollTop = box.scrollHeight; try { const messages = [ { role: 'user', content: [ { type: 'text', text: "Baca semua teks yang ada di gambar ini dan munculkan persis seperti aslinya. Jika ada struktur paragraf atau list, format menggunakan markdown." }, { type: 'image_url', image_url: { url: imgUrl } } ] } ]; const res = await puter.ai.chat(messages); let extractedText = typeof res === 'string' ? res : (res?.message?.content || res?.text || ''); document.getElementById('typingIndicator')?.remove(); if (!extractedText || !extractedText.trim()) { throw new Error("Tidak ada teks terdeteksi di gambar."); } const formattedHTML = marked.parse(extractedText); lastAIFormattedHTML = formattedHTML; const aiMsgDiv = document.createElement('div'); aiMsgDiv.className = 'flex justify-start fade-in'; aiMsgDiv.innerHTML = `<div class="max-w-[95%] rounded-
