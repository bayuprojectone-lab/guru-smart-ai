window.generateKuisAI=async function(){
var promptText=document.getElementById('k_ai_prompt').value.trim();if(!promptText){showToast('Masukkan perintah AI terlebih dahulu.','error');return;}
var btn=event.target;btn.disabled=true;btn.innerText='AI Berpikir...';
try{
var sysPrompt='Anda adalah generator soal kuis. Buatkan soal pilihan ganda berdasarkan perintah user. WAJIB balas dengan format JSON Array murni tanpa teks pembuka atau penutup. Format: [{"text":"Pertanyaan...","options":["A. Opsi1","B. Opsi2","C. Opsi3","D. Opsi4"],"answer":"A"}]';
var res=await callAIWithAutoUpgrade([{role:'system',content:sysPrompt},{role:'user',content:promptText}]);
var content=typeof res==='string'?res:(res?.message?.content||res?.text||'');
var jsonStr=content.replace(/```json/g,'').replace(/```/g,'').trim();var qsArr=JSON.parse(jsonStr);
var c=document.getElementById('questionsContainer');c.innerHTML='';
qsArr.forEach(function(q){var opts=q.options.map(function(o){return o.replace(/^[A-D]\.\s*/i,'');});window.addQuestionBlock();var lastBlock=c.lastChild;lastBlock.querySelector('.q-text').value=q.text;lastBlock.querySelector('.q-opt').value=opts.join(',');lastBlock.querySelector('.q-ans').value=q.answer.toUpperCase();});
showToast('Soal berhasil dibuat oleh AI!','success');
}catch(err){console.error('AI Kuis Error:',err);showToast('Gagal generate via AI. Coba lagi.','error');}
finally{btn.disabled=false;btn.innerText='⚡ Generate AI';}
};

window.addQuestionBlock=function(){
var c=document.getElementById('questionsContainer');if(c.querySelector('p'))c.innerHTML='';var i=c.children.length+1;
c.insertAdjacentHTML('beforeend','<div class="border p-3 mb-3 rounded-lg dark:border-slate-600 space-y-2 question-block"><div class="flex justify-between"><span class="font-semibold text-sm">Soal '+i+'</span><button type="button" onclick="this.parentElement.parentElement.remove()" class="text-xs text-red-500">Hapus</button></div><textarea class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white q-text" placeholder="Teks soal..."></textarea><input type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white q-opt" placeholder="Pisahkan opsi dengan koma (cth: A,B,C,D)"><input type="text" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white q-ans" placeholder="Jawaban benar (cth: A)"></div>');
};

async function startKuis(kuisId){
var k=(await DB.get('kuis')).find(function(x){return x.id===kuisId;});if(!k)return;
var qs=k.questions?(typeof k.questions==='string'?JSON.parse(k.questions):k.questions):[];
var html='<form id="kuisSubmitForm" class="space-y-5">';
qs.forEach(function(q,i){html+='<div class="bg-slate-50 dark:bg-slate-700 p-4 rounded-lg"><p class="font-semibold text-sm text-slate-800 dark:text-white mb-2">'+(i+1)+'. '+q.text+'</p><div class="space-y-2">';q.options.forEach(function(opt){html+='<label class="flex items-center gap-2 cursor-pointer"><input type="radio" name="q_'+i+'" value="'+opt+'" class="w-4 h-4 text-blue-600"><span class="text-sm text-slate-700 dark:text-slate-300">'+opt+'</span></label>';});html+='</div></div>';});
html+='<button type="submit" class="w-full bg-green-600 text-white py-2 rounded-lg font-semibold">Kumpulkan Jawaban</button></form>';
openModal(k.title,html);
document.getElementById('kuisSubmitForm').onsubmit=async function(e){e.preventDefault();var correct=0;qs.forEach(function(q,i){var selected=document.querySelector('input[name="q_'+i+'"]:checked');if(selected&&selected.value===q.answer)correct++;});var score=Math.round((correct/qs.length)*100);await DB.insert('kuis_answers',{kuis_id:kuisId,student_id:currentUser.id,student_name:currentUser.name,score:score});closeModal();showToast('Kuis selesai! Nilai: '+score,'success');renderKuisSiswa();};
}

<th style="padding:8px;border:1px solid #000;">Nilai</th><th style="padding:8px;border:1px solid #000;">Predikat</th></tr></thead><tbody>'+(gradeRows||'<tr><td colspan="4" style="text-align:center;padding:10px;border:1px solid #000;">Belum ada nilai</td></tr>')+'</tbody><tfoot><tr><td colspan="2" style="padding:8px;border:1px solid #000;text-align:right;">Rata-rata:</td><td colspan="2" style="padding:8px;border:1px solid #000;text-align:center;">'+finalAvg+'</td></tr></tfoot></table><div style="display:flex;justify-content:space-between;margin-top:50px;font-size:12px;"><div style="text-align:center;width:45%;"><p>Mengetahui,</p><p>Kepala Sekolah</p><br><br><br><p style="font-weight:bold;text-decoration:underline;">'+(profile.principal||'-')+'</p><p>NIP. '+(profile.principal_nip||'-')+'</p></div><div style="text-align:center;width:45%;"><p>'+dateStr+'</p><p>Wali Kelas</p><br><br><br><p style="font-weight:bold;text-decoration:underline;">'+(classes?.homeroom||currentUser.name)+'</p></div></div></div>';openPrintPreview(raporHTML);}

function previewFile(event,imgId){var file=event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=function(e){var url=e.target.result;var sm=document.getElementById(imgId);if(sm){sm.src=url;sm.style.display='block';}updateKopPreview();};reader.readAsDataURL(file);}
function updateKopPreview(){var l1=document.getElementById('kop_line1')?.value||'NAMA DINAS';var l1b=document.getElementById('kop_line1b')?.value||'';var l2=document.getElementById('kop_line2')?.value||'Nama Sekolah';var l3=document.getElementById('kop_line3')?.value||'Alamat | Telp';var area=document.getElementById('kopPreviewArea');if(!area)return;var leftImg=document.getElementById('prevLogoLeft')?.src||'';var rightImg=document.getElementById('prevLogoRight')?.src||'';var line1bHTML=l1b.trim()?'<p style="margin:2px 0 0;font-size:14px;font-weight:bold;text-transform:uppercase;color:#000;line-height:1.8;">'+l1b+'</p>':'';area.innerHTML='<div style="display:flex;justify-content:space-between;align-items:center;width:100%;gap:10px;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:20px;font-family:Arial;"><div style="width:90px;height:90px;display:flex;align-items:center;justify-content:flex-start;"><img src="'+leftImg+'" onerror="this.style.display=\'none\'" style="max-width:100%;max-height:100%;object-fit:contain;"></div><div style="text-align:center;flex:1;min-width:0;"><h2 style="margin:0;font-size:18px;font-weight:bold;text-transform:uppercase;color:#000;line-height:1.8;">'+l1+'</h2>'+line1bHTML+'<p style="margin:4px 0 0;font-size:14px;font-weight:bold;text-transform:uppercase;color:#000;line-height:1.8;">'+l2+'</p><p style="margin:2px 0 0;font-size:12px;color:#000;line-height:1.8;">'+l3+'</p></div><div style="width:90px;height:90px;display:flex;align-items:center;justify-content:flex-end;"><img src="'+rightImg+'" onerror="this.style.display=\'none\'" style="max-width:100%;max-height:100%;object-fit:contain;"></div></div>';}
async function saveKopData(profileId){var data={name:document.getElementById('p_name').value,address:document.getElementById('p_address').value,principal:document.getElementById('p_principal').value,principal_nip:document.getElementById('p_principal_nip').value,kop_line1:document.getElementById('kop_line1').value,kop_line1b:document.getElementById('kop_line1b').value,kop_line2:document.getElementById('kop_line2').value,kop_line3:document.getElementById('kop_line3').value};var lf=document.getElementById('logoLeftFile').files[0];var rf=document.getElementById('logoRightFile').files[0];showToast('Menyimpan...','info');if(lf){var ext=lf.name.split('.').pop();var r=await sb.storage.from('avatars').upload('kop_left_'+Date.now()+'.'+ext,lf);if(!r.error)data.logo_left=sb.storage.from('avatars').getPublicUrl(r.data.path).data.publicUrl;}if(rf){var ext=rf.name.split('.').pop();var r=await sb.storage.from('avatars').upload('kop_right_'+Date.now()+'.'+ext,rf);if(!r.error)data.logo_right=sb.storage.from('avatars').getPublicUrl(r.data.path).data.publicUrl;}var s=await saveSchoolProfile(data,profileId||null);if(s)renderSettings();}
async function generateKopHTML(){var profile=(await DB.get('school_profile'))[0]||{};if(!profile.kop_line1&&!profile.logo_left)return'';var l1=profile.kop_line1||profile.name||'NAMA SEKOLAH';var l1b=profile.kop_line1b||'';var l2=profile.kop_line2||profile.address||'Alamat Sekolah';var l3=profile.kop_line3||'Email | Telp';var ll=profile.logo_left?'<img src="'+profile.logo_left+'" style="max-width:90px;max-height:90px;object-fit:contain;">':'';var rl=profile.logo_right?'<img src="'+profile.logo_right+'" style="max-width:90px;max-height:90px;object-fit:contain;">':'';var l1bHTML=l1b.trim()?'<p style="margin:2px 0 0;font-size:18px;font-weight:bold;text-transform:uppercase;line-height:1.8;">'+l1b+'</p>':'';return'<div style="display:flex;justify-content:space-between;align-items:center;border-bottom:3px double #000;padding-bottom:10px;margin-bottom:25px;font-family:Arial;"><div style="width:90px;height:90px;display:flex;align-items:center;justify-content:center;">'+ll+'</div><div style="text-align:center;flex:1;padding:0 20px;"><h2 style="margin:0;font-size:16px;font-weight:bold;text-transform:uppercase;line-height:0.5;">'+l1+'</h2>'+l1bHTML+'<p style="margin:4px 0 0;font-size:20px;font-weight:bold;text-transform:uppercase;line-height:0.5;">'+l2+'</p><p style="margin:2px 0 0;font-size:12px;line-height:2;">'+l3+'</p></div><div style="width:90px;height:90px;display:flex;align-items:center;justify-content:center;">'+rl+'</div></div>';}
async function saveSchoolProfileData(profileId){var data={name:document.getElementById('p_name').value,address:document.getElementById('p_address').value,principal:document.getElementById('p_principal').value,principal_nip:document.getElementById('p_principal_nip').value};var s=await saveSchoolProfile(data,profileId||null);if(s)renderSettings();}
async function saveSchoolProfile(data,id){var result=null;if(id){var r=await sb.from('school_profile').update(data).eq('id',id).eq('user_id',currentUser.id).select();if(r.error){showToast('Gagal: '+r.error.message,'error');return false;}result=r.data;}else{var r=await sb.from('school_profile').insert([{...data,user_id:currentUser.id}]).select();if(r.error){showToast('Gagal: '+r.error.message,'error');return false;}result=r.data;}if(result){showToast('Profil disimpan!','success');return true;}return false;}
async function exportAllDataJSON(){showToast('Mengumpulkan data...','info');var tables=['students','teachers','classes','subjects','schedules','attendance','grades','assignments','materi','keuangan','announcements','activity_attendance','activity_records','kurikulum','kuis','kuis_answers','school_profile'];var backupData={};for(var i=0;i<tables.length;i++){var t=tables[i];backupData[t]=await DB.get(t);}var dataStr=JSON.stringify(backupData,null,2);var blob=new Blob([dataStr],{type:"application/json"});var url=URL.createObjectURL(blob);var a=document.createElement('a');a.href=url;a.download="Backup_Guru_Smart_"+new Date().toISOString().split('T')[0]+".json";document.body.appendChild(a);a.click();document.body.removeChild(a);URL.revokeObjectURL(url);showToast('Data berhasil diexport ke JSON!','success');}
window.importAllDataJSON=function(event){var file=event.target.files[0];if(!file)return;var reader=new FileReader();reader.onload=async function(e){try{var data=JSON.parse(e.target.result);showToast('Mengimpor data, mohon tunggu...','info');var tables=Object.keys(data);for(var i=0;i<tables.length;i++){var t=tables[i];var rows=data[t];if(rows&&rows.length>0){var mappedRows=rows.map(function(r){return{...r,user_id:currentUser.id};});var res=await sb.from(t).upsert(mappedRows).select();if(res.error){console.error('Error importing table '+t+':',res.error);}}}showToast('Import data berhasil!','success');navigate('dashboard');}catch(err){showToast('Gagal import: '+err.message,'error');}};reader.readAsText(file);};
async function uploadAvatar(){var file=document.getElementById('avatarFile').files[0];if(!file){showToast('Pilih file!','error');return;}showToast('Mengunggah...','info');var r=await sb.storage.from('avatars').upload('user_'+currentUser.id+'_'+Date.now()+'.jpg',file);if(r.error){showToast('Gagal: '+r.error.message,'error');return;}var url=sb.storage.from('avatars').getPublicUrl(r.data.path).data.publicUrl;await DB.update('users',currentUser.id,{avatar_url:url});currentUser.avatar_url=url;localStorage.setItem('gs_currentUser',JSON.stringify(currentUser));document.getElementById('userAvatar').src=url;document.getElementById('prevAvatar').src=url;showToast('Foto diperbarui!','success');}
</script>

dLogo');img.src=url;img.style.display='block';showToast('Logo disimpan!','success');});document.getElementById('cardSignInput').addEventListener('change',async function(e){var f=e.target.files[0];if(!f)return;showToast('Upload TTD...','info');var ext=f.name.split('.').pop();var r=await sb.storage.from('avatars').upload('sign_'+currentUser.id+'_'+Date.now()+'.'+ext,f);if(r.error){showToast('Gagal: '+r.error.message,'error');return;}var url=sb.storage.from('avatars').getPublicUrl(r.data.path).data.publicUrl;var pd=(await DB.get('school_profile'))[0]||{};if(pd.id)await sb.from('school_profile').update({principal_sign:url}).eq('id',pd.id).eq('user_id',currentUser.id);else await sb.from('school_profile').insert([{principal_sign:url,user_id:currentUser.id}]).select();document.getElementById('cardSignName').innerText='Tersimpan';var img=document.getElementById('cardSign');img.src=url;img.style.display='block';showToast('TTD disimpan!','success');});}

var wbCanvas=null,wbCtx=null,wbDrawing=false,wbLastX=0,wbLastY=0,wbStartX=0,wbStartY=0;
var wbColor='#1e3a8a',wbSize=3,wbTool='pen',wbHistory=[],wbSnapshot=null;

function initWhiteboard(){
  wbCanvas=document.getElementById('whiteboardCanvas');
  if(!wbCanvas)return;
  var newCanvas=wbCanvas.cloneNode(false);
  wbCanvas.parentNode.replaceChild(newCanvas,wbCanvas);
  wbCanvas=newCanvas;
  wbCanvas.width=1000;
  wbCanvas.height=600;
  wbCtx=wbCanvas.getContext('2d');
  wbCtx.fillStyle='#ffffff';
  wbCtx.fillRect(0,0,1000,600);
  wbCtx.lineCap='round';
  wbCtx.lineJoin='round';
  wbSnapshot=wbCanvas.toDataURL();
  wbHistory=[];

  wbCanvas.addEventListener('mousedown',function(e){
    e.preventDefault();
    var p=wbGetPos(e);
    wbStartDraw(p.x,p.y);
  });
  wbCanvas.addEventListener('mousemove',function(e){
    var p=wbGetPos(e);
    wbDraw(p.x,p.y);
  });
  wbCanvas.addEventListener('mouseup',function(){wbStopDraw();});
  wbCanvas.addEventListener('mouseleave',function(){wbStopDraw();});

  wbCanvas.addEventListener('touchstart',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var p=wbGetPosTouch(t);
    wbStartDraw(p.x,p.y);
  },{passive:false});
  wbCanvas.addEventListener('touchmove',function(e){
    e.preventDefault();
    var t=e.touches[0];
    var p=wbGetPosTouch(t);
    wbDraw(p.x,p.y);
  },{passive:false});
  wbCanvas.addEventListener('touchend',function(e){
    e.preventDefault();
    wbStopDraw();
  },{passive:false});
}

function wbGetPos(e){
  var rect=wbCanvas.getBoundingClientRect();
  var scaleX=wbCanvas.width/rect.width;
  var scaleY=wbCanvas.height/rect.height;
  return{x:(e.clientX-rect.left)*scaleX,y:(e.clientY-rect.top)*scaleY};
}
function wbGetPosTouch(t){
  var rect=wbCanvas.getBoundingClientRect();
  var scaleX=wbCanvas.width/rect.width;
  var scaleY=wbCanvas.height/rect.height;
  return{x:(t.clientX-rect.left)*scaleX,y:(t.clientY-rect.top)*scaleY};
}

function wbSaveState(){
  try{
    if(wbHistory.length>20)wbHistory.shift();
    wbHistory.push(wbCanvas.toDataURL());
  }catch(e){}
}

function wbStartDraw(x,y){
  wbDrawing=true;
  wbLastX=x;wbLastY=y;wbStartX=x;wbStartY=y;
  wbSaveState();
  if(wbTool==='pen'||wbTool==='eraser'){
    wbCtx.beginPath();
    wbCtx.moveTo(x,y);
    wbCtx.lineTo(x+0.1,y+0.1);
    wbCtx.strokeStyle=wbTool==='eraser'?'#ffffff':wbColor;
    wbCtx.lineWidth=wbTool==='eraser'?wbSize*4:wbSize;
    wbCtx.stroke();
  }
}

function wbDraw(x,y){
  if(!wbDrawing)return;
  if(wbTool==='pen'){
    wbCtx.strokeStyle=wbColor;
    wbCtx.lineWidth=wbSize;
    wbCtx.globalCompositeOperation='source-over';
    wbCtx.lineTo(x,y);
    wbCtx.stroke();
  }else if(wbTool==='eraser'){
    wbCtx.strokeStyle='#ffffff';
    wbCtx.lineWidth=wbSize*4;
    wbCtx.globalCompositeOperation='source-over';
    wbCtx.lineTo(x,y);
    wbCtx.stroke();
  }else if(wbTool==='line'||wbTool==='rect'||wbTool==='circle'){
    if(wbSnapshot){
      var img=new Image();
      img.onload=function(){
        wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
        wbCtx.drawImage(img,0,0);
        drawShape(x,y);
      };
      img.src=wbSnapshot;
    }
  }
  wbLastX=x;wbLastY=y;
}

function drawShape(x,y){
  wbCtx.strokeStyle=wbColor;
  wbCtx.lineWidth=wbSize;
  wbCtx.globalCompositeOperation='source-over';
  if(wbTool==='line'){
    wbCtx.beginPath();
    wbCtx.moveTo(wbStartX,wbStartY);
    wbCtx.lineTo(x,y);
    wbCtx.stroke();
  }else if(wbTool==='rect'){
    wbCtx.strokeRect(wbStartX,wbStartY,x-wbStartX,y-wbStartY);
  }else if(wbTool==='circle'){
    var rx=Math.abs(x-wbStartX)/2;
    var ry=Math.abs(y-wbStartY)/2;
    var cx=(wbStartX+x)/2;
    var cy=(wbStartY+y)/2;
    wbCtx.beginPath();
    wbCtx.ellipse(cx,cy,Math.max(1,rx),Math.max(1,ry),0,0,2*Math.PI);
    wbCtx.stroke();
  }
}

function wbStopDraw(){
  if(!wbDrawing)return;
  wbDrawing=false;
  wbCtx.globalCompositeOperation='source-over';
  if(wbTool==='line'||wbTool==='rect'||wbTool==='circle'){
    wbSnapshot=wbCanvas.toDataURL();
  }
}

window.wbSetTool=function(tool){

  });
  var btnMap={'pen':'wbToolPen','eraser':'wbToolEraser','line':'wbToolLine','rect':'wbToolRect','circle':'wbToolCircle'};
  var btn=document.getElementById(btnMap[tool]);
  if(btn){
    btn.classList.add('active','bg-blue-600','text-white');
    btn.classList.remove('bg-slate-200','dark:bg-slate-600','text-slate-700','dark:text-white');
  }
  if(wbCanvas)wbCanvas.style.cursor=tool==='eraser'?'cell':'crosshair';
  if((tool==='line'||tool==='rect'||tool==='circle')&&wbCanvas){
    wbSnapshot=wbCanvas.toDataURL();
  }
};

window.wbUndo=function(){
  if(wbHistory.length===0){showToast('Tidak ada riwayat.','info');return;}
  var lastState=wbHistory.pop();
  var img=new Image();
  img.onload=function(){
    wbCtx.clearRect(0,0,wbCanvas.width,wbCanvas.height);
    wbCtx.drawImage(img,0,0);
    wbSnapshot=wbCanvas.toDataURL();
  };
  img.src=lastState;
};

window.retryOCR=async function(){
  if(!soalCapturedDataUrl)return;
  var ocrDisplay=document.getElementById('ocrTextDisplay');
  if(ocrDisplay)ocrDisplay.innerHTML='<div class="flex items-center text-blue-500 font-medium"><div class="ocr-loading-dot"></div><div class="ocr-loading-dot"></div><div class="ocr-loading-dot"></div><span class="ml-2">AI sedang membaca teks...</span></div>';
  await performOCR();
};

async function performOCR(){
  if(!soalCapturedDataUrl)return;
  try{
    var messages=[{role:'user',content:[{type:'text',text:"Baca semua teks yang ada pada gambar soal ini. Keluarkan murni teksnya saja tanpa kalimat pengantar."},{type:'image_url',image_url:{url:soalCapturedDataUrl}}]}];
    var res=await puter.ai.chat(messages);
    var extractedText=typeof res==='string'?res:(res?.message?.content||res?.text||'');
    tempOcrText=extractedText.trim();
    var ocrDisplay=document.getElementById('ocrTextDisplay');
    if(ocrDisplay){if(tempOcrText){ocrDisplay.innerHTML='<p class="text-slate-700 dark:text-slate-200">'+escapeHTML(tempOcrText)+'</p>';}else{ocrDisplay.innerHTML='<p class="text-amber-500 text-center italic">Tidak ada teks terdeteksi.</p>';}}
  }catch(err){
    console.error('OCR Error:',err);
    var ocrDisplay=document.getElementById('ocrTextDisplay');
    if(ocrDisplay)ocrDisplay.innerHTML='<p class="text-red-500 text-center italic">Gagal memindai teks. Anda tetap bisa melanjutkan ke Koreksi AI.</p>';
  }
}

function formatSoalHTML(rawText){
  var text=rawText||'';
  var svgRegex=/```svg\s*([\s\S]*?)```/gi;
  var svgMatch;
  while((svgMatch=svgRegex.exec(text))!==null){
    var rawSvg=svgMatch[1].trim();
    if(!rawSvg.startsWith('<svg')){
      rawSvg='<svg '+rawSvg;
    }
    text=text.replace(svgMatch[0], rawSvg);
  }
  var fh=marked.parse(text);
  return fh;
}
