    <script>
        const SUPABASE_URL = 'https://urslwiueyqhoykjhxmqq.supabase.co';
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVyc2x3aXVleXFob3lramh4bXFxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk2NTIxMDgsImV4cCI6MjEwNTIyODEwOH0.cRHI2m9lasLJ6yX2vc1ioxJGm7bLRsCIptmiNtpz5go';
        const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY, {
            auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true }
        });
        const AI_IMG = 'https://z-cdn-media.chatglm.cn/files/c0012e5b-65ba-49de-82f7-0299446846c6.png?auth_key=1889545451-57dd1e872dbb4149bdea975407d31530-0-fbdde3c3db36637028abfb484d301ec8';

        const DB = {
            get: async (table) => { const { data, error } = await sb.from(table).select('*').eq('user_id', currentUser.id); if (error) { console.error(`Error fetching ${table}:`, error); return []; } return data; },
            insert: async (table, payload) => { const { data, error } = await sb.from(table).insert([{ ...payload, user_id: currentUser.id }]).select(); if (error) { console.error(`Error inserting ${table}:`, error); showToast('Gagal menyimpan data', 'error'); return null; } return data; },
            update: async (table, id, payload) => { const { data, error } = await sb.from(table).update(payload).eq('id', id).eq('user_id', currentUser.id).select(); if (error) { console.error(`Error updating ${table}:`, error); showToast('Gagal mengupdate data', 'error'); return null; } return data; },
            remove: async (table, id) => { const { error } = await sb.from(table).delete().eq('id', id).eq('user_id', currentUser.id); if (error) { console.error(`Error deleting ${table}:`, error); showToast('Gagal menghapus data', 'error'); return false; } return true; }
        };

        let currentUser = null; let currentPage = 'dashboard';
        let aiMode = 'chat'; 
        let generatedImages = []; 

        function toggleAuth(form) { if(form === 'register') { document.getElementById('loginForm').classList.add('hidden'); document.getElementById('registerForm').classList.remove('hidden'); } else { document.getElementById('registerForm').classList.add('hidden'); document.getElementById('loginForm').classList.remove('hidden'); } }
        document.getElementById('registerForm').addEventListener('submit', async (e) => { 
            e.preventDefault(); 
            const name = document.getElementById('regName').value; 
            const email = document.getElementById('regEmail').value; 
            const password = document.getElementById('regPassword').value; 
            const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } }); 
            if (error) { showToast('Gagal daftar: ' + error.message, 'error'); return; } 
            let newUserId = data.user?.id;
            let newUserEmail = data.user?.email;
            if (newUserId) {
                await sb.from('users').upsert({ id: newUserId, name: name, username: newUserEmail, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' });
                currentUser = { id: newUserId, email: newUserEmail, name: name, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' }; 
                localStorage.setItem('gs_currentUser', JSON.stringify(currentUser)); 
                showToast('Pendaftaran berhasil!', 'success'); 
                initApp(); 
            } else {
                showToast('Pendaftaran berhasil! Silakan login.', 'success'); 
                toggleAuth('login'); 
                document.getElementById('loginEmail').value = email; 
            } 
        });
        
        document.getElementById('loginForm').addEventListener('submit', async (e) => { 
            e.preventDefault(); 
            const email = document.getElementById('loginEmail').value; 
            const password = document.getElementById('loginPassword').value; 
            const { data, error } = await sb.auth.signInWithPassword({ email, password }); 
            if (error) { showToast('Login gagal: ' + error.message, 'error'); return; } 
            let userData = null;
            const { data: userDataRes } = await sb.from('users').select('*').eq('id', data.user.id).maybeSingle();
            if (userDataRes) {
                userData = userDataRes;
            } else {
                const { data: newUserData } = await sb.from('users').upsert({ 
                    id: data.user.id, name: email.split('@')[0], username: email, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' 
                }).select().maybeSingle();
                if (newUserData) userData = newUserData;
                else userData = { name: email, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' };
            }
            currentUser = { 
                id: data.user.id, email: data.user.email, name: userData?.name || data.user.email, 
                role: userData?.role || 'guru', avatar_url: userData?.avatar_url || AI_IMG,
                is_premium: userData?.is_premium || false, payment_status: userData?.payment_status || 'Belum Bayar',
                payment_sender: userData?.payment_sender || ''
            }; 
            localStorage.setItem('gs_currentUser', JSON.stringify(currentUser)); 
            showToast('Login berhasil!', 'success');
            initApp(); 
        });
        
        async function logout() { await sb.auth.signOut(); localStorage.removeItem('gs_currentUser'); currentUser = null; location.reload(); }
        async function checkSession() { 
            const { data, error } = await sb.auth.getSession(); 
            if (data.session) { 
                await sb.auth.refreshSession(); 
                let userData = null;
                const { data: userDataRes } = await sb.from('users').select('*').eq('id', data.session.user.id).maybeSingle();
                if (userDataRes) userData = userDataRes;
                else {
                    const { data: newUserData } = await sb.from('users').upsert({ 
                        id: data.session.user.id, name: data.session.user.email.split('@')[0], username: data.session.user.email, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' 
                    }).select().maybeSingle();
                    if (newUserData) userData = newUserData;
                    else userData = { name: data.session.user.email, role: 'guru', is_premium: false, payment_status: 'Belum Bayar' };
                }
                currentUser = { 
                    id: data.session.user.id, email: data.session.user.email, name: userData.name || data.session.user.email, 
                    role: userData.role || 'guru', avatar_url: userData.avatar_url || AI_IMG,
                    is_premium: userData.is_premium || false, payment_status: userData.payment_status || 'Belum Bayar',
                    payment_sender: userData.payment_sender || ''
                }; 
                return true; 
            } 
            return false; 
        }

        function showToast(message, type = 'info') { const toast = document.getElementById('toast'); const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800'; toast.className = `fixed bottom-5 right-5 z-[60] ${bg} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 fade-in`; toast.innerHTML = `<span>${message}</span>`; toast.classList.remove('hidden'); setTimeout(() => toast.classList.add('hidden'), 3000); }
        function toggleDarkMode() { document.documentElement.classList.toggle('dark'); document.getElementById('iconSun').classList.toggle('hidden'); document.getElementById('iconMoon').classList.toggle('hidden'); localStorage.setItem('gs_darkMode', document.documentElement.classList.contains('dark')); if(currentPage === 'dashboard') renderDashboard(); }
        if (localStorage.getItem('gs_darkMode') === 'true') { document.documentElement.classList.add('dark'); document.getElementById('iconSun').classList.remove('hidden'); document.getElementById('iconMoon').classList.add('hidden'); }
        function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
        function openModal(title, contentHtml) { document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = contentHtml; document.getElementById('modalContainer').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalContainer').classList.add('hidden'); }
        function closeLightbox() { document.getElementById('imgLightbox').classList.add('hidden'); }
        function openLightbox(src) { document.getElementById('lightboxImg').src = src; document.getElementById('imgLightbox').classList.remove('hidden'); }

        const menus = [
            { id: 'dashboard', label: 'Dashboard', icon: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6', roles: ['admin', 'guru', 'siswa'] },

        async function renderKurikulum() { const subjects = await DB.get('subjects'); const kurikulumData = await DB.get('kurikulum'); document.getElementById('content').innerHTML = `<div class="mb-6 bg-gradient-to-r from-indigo-500 to-purple-600 rounded-xl p-6 text-white shadow-lg"><h2 class="text-2xl font-bold mb-2">📚 Perangkat Ajar Kurikulum</h2><p class="text-indigo-100 text-sm">Buat dan kelola dokumen kurikulum: CP, TP, ATP, Modul Ajar, RPP, Program Tahunan, hingga LKPD</p></div><div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4 mb-6">${kurikulumTypes.map(t => `<button onclick="generateKurikulum('${t.id}', '${t.label}')" class="bg-gradient-to-br ${t.color} p-5 rounded-xl text-white text-left shadow-md hover:scale-105 transition-transform"><svg class="w-8 h-8 mb-2" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${t.icon}"></path></svg><h3 class="font-bold text-sm">${t.label}</h3><p class="text-xs opacity-90 mt-1">${t.desc}</p></button>`).join('')}</div><div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><h3 class="font-bold text-slate-800 dark:text-white mb-4">Dokumen Tersimpan</h3><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-50 dark:bg-slate-700 text-xs uppercase"><tr><th class="px-4 py-3">Jenis</th><th class="px-4 py-3">Mapel</th><th class="px-4 py-3">Judul</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Aksi</th></tr></thead><tbody class="divide-y dark:divide-slate-700">${kurikulumData.length ? kurikulumData.map(k => { const sub = subjects.find(s => s.id === k.subject_id); const typeLabel = kurikulumTypes.find(t => t.id === k.type)?.label || k.type; return `<tr><td class="px-4 py-3"><span class="text-xs bg-blue-100 text-blue-700 px-2 py-1 rounded">${typeLabel}</span></td><td class="px-4 py-3">${sub?.name || '-'}</td><td class="px-4 py-3 font-medium">${k.title}</td><td class="px-4 py-3">${k.class_name || '-'}</td><td class="px-4 py-3 flex gap-2"><button onclick="viewKurikulum('${k.id}')" class="text-blue-500">Lihat</button><button onclick="printKurikulumDoc('${k.id}')" class="text-green-500">Cetak</button><button onclick="deleteData('kurikulum', '${k.id}', renderKurikulum)" class="text-red-500">Hapus</button></td></tr>`; }).join('') : `<tr><td colspan="5" class="text-center py-4 text-slate-500">Belum ada dokumen. Gunakan tombol di atas untuk membuat.</td></tr>`}</tbody></table></div></div>`; }
        async function generateKurikulum(type, typeLabel) { 
            const subjects = await DB.get('subjects'); 
            const classes = await DB.get('classes'); 
            if(subjects.length === 0 || classes.length === 0) { showToast('Harap tambahkan Mata Pelajaran & Kelas dahulu!', 'error'); return; }
            openModal(`Buat ${typeLabel} dengan AI`, `

                <div class="bg-blue-50 dark:bg-slate-700 p-3 rounded-lg text-sm text-blue-700 dark:text-blue-300">💡 AI akan membuatkan <strong>${typeLabel}</strong> secara otomatis. Lengkapi detail di bawah ini.</div>
                <div><label class="block text-sm mb-1">Mata Pelajaran</label><select id="kSubject" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required>${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div>

                <div><label class="block text-sm mb-1">Fase</label><select id="kPhase" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"><option>Fase A</option><option>Fase B</option><option>Fase C</option><option>Fase D</option><option>Fase E</option><option>Fase F</option></select></div>
                <button type="submit" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 text-white py-2.5 rounded-lg font-semibold flex items-center justify-center gap-2">
                    <svg class="animate-spin hidden h-5 w-5" fill="none" viewBox="0 0 24 24"><circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle><path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path></svg>
                    <span id="btnText">⚡ Generate dengan AI</span>
                </button>
            </form>`); 
            document.getElementById('kurikulumForm').onsubmit = async (e) => { 
                e.preventDefault(); 
                const btn = document.querySelector('#kurikulumForm button[type="submit"]'); const btnText = document.getElementById('btnText'); const spinner = btn.querySelector('svg');
                btn.disabled = true; btnText.innerText = 'AI Sedang Menyusun Dokumen...'; spinner.classList.remove('hidden');
                const subjectId = document.getElementById('kSubject').value; const classSelect = document.getElementById('kClass'); const className = classSelect.options[classSelect.selectedIndex].dataset.name; const topic = document.getElementById('kTopic').value; const phase = document.getElementById('kPhase').value; const subject = subjects.find(s => s.id === subjectId);

        async function viewKurikulum(id) { const doc = (await DB.get('kurikulum')).find(k => k.id === id); if(!doc) return; const typeLabel = kurikulumTypes.find(t => t.id === doc.type)?.label || doc.type; openModal(typeLabel, `<div class="ai-output text-gray-800 dark:text-white">${marked.parse(doc.content)}</div><div class="mt-4 flex gap-2"><button onclick="printKurikulumDoc('${doc.id}')" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm flex-1">🖨️ Cetak / PDF</button><button onclick="closeModal()" class="bg-slate-500 text-white px-4 py-2 rounded-lg text-sm">Tutup</button></div>`); }

        async function generateImage() {
            const promptEl = document.getElementById('imgPrompt');
            const prompt = promptEl.value.trim();
            if(!prompt) { showToast('Masukkan deskripsi gambar dulu!', 'error'); return; }

            const style = document.getElementById('imgStyle').value;
            const ratio = document.getElementById('imgRatio').value;
            
            let fullPrompt = prompt;
            if(style) fullPrompt += `, ${style}`;
            
            const ratioMap = { 'square': '1024x1024', 'landscape': '1280x720', 'portrait': '720x1280' };
            const resolution = ratioMap[ratio] || '1024x1024';
            fullPrompt += `, high quality, detailed, ${resolution}`;

            const btn = document.getElementById('imgGenerateBtn');
            const btnText = document.getElementById('imgBtnText');
            const spinner = document.getElementById('imgSpinner');
            const loading = document.getElementById('imgLoading');
            const result = document.getElementById('imgResult');

            btn.disabled = true; btnText.innerText = 'Membuat...'; spinner.classList.remove('hidden');
            loading.classList.remove('hidden');
            result.classList.add('hidden');

            try {
                // PERBAIKAN ERROR MISSING MODEL: Menambahkan parameter model 'dall-e-3'
                const imgElement = await puter.ai.txt2img(fullPrompt, false, { model: 'dall-e-3' });
                
                const imgUrl = typeof imgElement === 'string' ? imgElement : (imgElement.src || imgElement.toString());
                
                loading.classList.add('hidden');
                
                result.classList.remove('hidden');
                result.innerHTML = `
                <div class="img-card bg-slate-50 dark:bg-slate-700 rounded-xl p-4">
                    <div class="flex justify-between items-center mb-3">
                        <div class="flex-1 min-w-0">

                            <p class="text-sm font-medium text-slate-700 dark:text-slate-200 truncate">${escapeHTML(prompt)}</p>
                        </div>
                        <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full ml-2">✓ Selesai</span>
                    </div>
                    <div class="relative group cursor-pointer" onclick="openLightbox('${imgUrl}')">
                        <img src="${imgUrl}" class="w-full rounded-lg shadow-md max-h-[500px] object-contain bg-white" alt="${escapeHTML(prompt)}">
                        <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-center justify-center">

                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                            Download
                        </a>
                        <button onclick="saveImgToDB('${imgUrl}', '${escapeHTML(prompt).replace(/'/g, "\\'")}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-sm py-2 rounded-lg font-semibold flex items-center justify-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
                            Simpan
                        </button>
                        <button onclick="document.getElementById('imgPrompt').value='${escapeHTML(prompt).replace(/'/g, "\\'")}'; generateImage();" class="bg-purple-600 hover:bg-purple-700 text-white text-sm py-2 px-3 rounded-lg font-semibold flex items-center justify-center gap-1">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        </button>
                    </div>
                </div>`;

                generatedImages.unshift({ url: imgUrl, prompt: prompt, time: new Date().toLocaleString('id-ID') });

                renderImgHistory();

                showToast('Gambar berhasil dibuat!', 'success');
            } catch(err) {
                loading.classList.add('hidden');
                
                // Fallback: Jika DALL-E 3 error, coba gunakan Stable Diffusion XL
                try {
                    showToast('Mencoba model alternatif...', 'info');
                    const imgElementFallback = await puter.ai.txt2img(fullPrompt, false, { model: 'stable-diffusion-xl' });
                    const imgUrlFallback = typeof imgElementFallback === 'string' ? imgElementFallback : (imgElementFallback.src || imgElementFallback.toString());
                    
                    loading.classList.add('hidden');
                    result.classList.remove('hidden');
                    result.innerHTML = `
                    <div class="img-card bg-slate-50 dark:bg-slate-700 rounded-xl p-4">
                        <div class="flex justify-between items-center mb-3">
                            <div class="flex-1 min-w-0">
                                <p class="text-xs text-slate-500 dark:text-slate-400 mb-1">Prompt:</p>
                                <p class="text-sm font-medium text-slate-700 dark:text-slate-200 truncate">${escapeHTML(prompt)}</p>
                            </div>
                            <span class="text-xs bg-green-100 text-green-700 px-2 py-1 rounded-full ml-2">✓ Selesai</span>

                        <div class="relative group cursor-pointer" onclick="openLightbox('${imgUrlFallback}')">

                            <div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg flex items-center justify-center">

                            </div>
                        </div>
                        <div class="flex gap-2 mt-3">
                            <a href="${imgUrlFallback}" download="gambar-ai-${Date.now()}.png" class="flex-1 bg-blue-600 hover:bg-blue-700 text-white text-sm py-2 rounded-lg font-semibold flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                                Download
                            </a>
                            <button onclick="saveImgToDB('${imgUrlFallback}', '${escapeHTML(prompt).replace(/'/g, "\\'")}')" class="flex-1 bg-green-600 hover:bg-green-700 text-white text-sm py-2 rounded-lg font-semibold flex items-center justify-center gap-1">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 5a2 2 0 012-2h10a2 2 0 012 2v16l-7-3.5L5 21V5z" /></svg>
                                Simpan
                            </button>
                        </div>
                    </div>`;
                    
                    generatedImages.unshift({ url: imgUrlFallback, prompt: prompt, time: new Date().toLocaleString('id-ID') });
                    if(generatedImages.length > 20) generatedImages = generatedImages.slice(0, 20);
                    renderImgHistory();
                    showToast('Gambar berhasil dibuat!', 'success');
                    
                } catch (err2) {
                    loading.classList.add('hidden');
                    showToast('Gagal membuat gambar: Server AI sedang sibuk. Coba lagi nanti.', 'error');
                    console.error('Image gen error:', err2);
                }
            } finally {
                btn.disabled = false; btnText.innerText = 'Generate Gambar'; spinner.classList.add('hidden');
            }
        }

        async function saveImgToDB(url, prompt) {
            const result = await DB.insert('materi', { 
                title: 'Gambar AI: ' + prompt.substring(0, 30), 
                description: prompt, 
                subject_id: null, 
                class_id: null, 
                link: url 
            });
            if(result) showToast('Gambar disimpan ke Materi Ajar!', 'success');
        }

            const input = document.getElementById('aiInput');
            if(!input) return;
            input.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault(); 
                    sendAI();
                }
            });
        }

        function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

        function formatSoalHTML(rawText) {
            let text = rawText;
            let kunciSection = '';
            const kunciMatch = text.match(/\n?\**(?:Kunci Jawaban|Jawaban)[*:]*\s*\n([\s\S]*?)$/i);
            if (kunciMatch) {
                const kunciText = kunciMatch[1].trim();
                const kunciLines = kunciText.split('\n').filter(l => l.trim());
                let kunciHTML = '<div class="kunci-jawaban-section hide-on-print"><h3>📋 KUNCI JAWABAN</h3><div class="kunci-jawaban-grid">';
                kunciLines.forEach(line => { const m = line.match(/(\d+)\s*[.):\s]\s*([A-D])/i); if (m) { kunciHTML += `<span>${m[1]}. ${m[2].toUpperCase()}</span>`; } });
                kunciHTML += '</div></div>';
                kunciSection = kunciHTML;
                text = text.replace(kunciMatch[0], '');
            }
            const simplePattern = /(?:\*\*)?(\d+)[\.\)]\s*\*?\s*([\s\S]*?)(?=(?:\*\*)?\d+[\.\)]\s*\*?\s|$)/g;
            let match; const soalBlocks = []; let hasQuestions = false;
            while ((match = simplePattern.exec(text)) !== null) {
                const num = match[1]; const block = match[2];
                const optPattern = /(?:^|\n)\s*([A-D])[\.\)\s]\s*(.+?)(?=(?:\n\s*[A-D][\.\)\s])|(?:\n\s*(?:Jawaban|Kunci)[:\s])|$)/g;
                const options = []; let optMatch;
                while ((optMatch = optPattern.exec(block)) !== null) { options.push({ label: optMatch[1].toUpperCase(), text: optMatch[2].trim() }); }
                if (options.length >= 2) {
                    hasQuestions = true;
                    const questionText = block.substring(0, block.search(new RegExp(`\\s*${options[0].label}[\\.\\)\\s]`))).trim();
                    let correctAnswer = null;
                    const ansPatterns = [/(?:Jawaban|Kunci)[:\s]*\*?\*?\s*([A-D])/i, /\[BENAR[:\s]*([A-D])\]/i, /\(BENAR[:\s]*([A-D])\)/i, /\*([A-D])\s*\(BENAR\)/i, /([A-D])\s*\(BENAR\)/i, /([A-D])\s*\[BENAR\]/i, /✅\s*([A-D])/i, /([A-D])\s*✅/i];
                    for (const ap of ansPatterns) { const am = block.match(ap); if (am) { correctAnswer = am[1].toUpperCase(); break; } }
                    if (!correctAnswer && kunciMatch) { const kunciText = kunciMatch[1]; const kunciLine = kunciText.match(new RegExp(`${num}\\s*[.):\\s]\\s*([A-D])`, 'i')); if (kunciLine) correctAnswer = kunciLine[1].toUpperCase(); }
                    soalBlocks.push({ num, question: questionText, options, correct: correctAnswer, fullMatch: match[0] });
                }
            }
            if (hasQuestions && soalBlocks.length > 0) {
                let soalHTML = '<div class="soal-container">';
                soalBlocks.forEach(sb => {
                    let qText = sb.question.replace(/^\*+|\*+$/g, '').replace(/_+/g, '').trim();
                    qText = qText.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
                    soalHTML += `<div class="soal-item"><div class="soal-header"><span class="soal-number">${sb.num}.</span><span class="soal-text">${qText}</span></div><div class="soal-opts"><div class="opt-col">`;
                    const half = Math.ceil(sb.options.length / 2);
                    sb.options.forEach((opt, index) => {
                        if (index === half) soalHTML += `</div><div class="opt-col">`;
                        const isCorrect = opt.label === sb.correct;
                        soalHTML += `<div class="soal-opt ${isCorrect ? 'correct' : ''}"><span class="opt-label">${opt.label}.</span><span class="opt-text">${opt.text}</span></div>`;
                    });
                    soalHTML += `</div></div>`;
                    if (sb.correct) { soalHTML += `<div class="soal-answer hide-on-print">Jawaban: <strong>${sb.correct}</strong></div>`; }
                    soalHTML += `</div>`;
                });
                soalHTML += '</div>';
                let tempText = text;
                soalBlocks.forEach(sb => { const escaped = sb.fullMatch.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); tempText = tempText.replace(new RegExp(escaped, 's'), '|||SOAL_MARKER|||'); });
                const nonSoalParts = tempText.split('|||SOAL_MARKER|||').filter(p => p.trim());
                let finalHTML = '';
                nonSoalParts.forEach(part => { if (part.trim()) { finalHTML += marked.parse(part.trim()); } });
                finalHTML += soalHTML + kunciSection;
                return finalHTML;
            }
            return marked.parse(text) + kunciSection;
        }

        let lastAIFormattedHTML = '';
        async function sendAI(){
            const input=document.getElementById('aiInput');
            if(!input || !input.value.trim()) return;
            const prompt=input.value.trim();
            input.value='';
            
            const btn=document.getElementById('aiSendBtn');
            btn.disabled=true; btn.innerText='Memproses...';
            
            ['aiPrintBtn', 'aiWordBtn', 'aiPrintKeyBtn'].forEach(id => document.getElementById(id).classList.add('hidden'));
            
            const box=document.getElementById('aiMessages');
            
            box.innerHTML += `<div class="flex justify-end fade-in"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-blue-600 text-white shadow-sm"><div class="text-xs opacity-70 mb-1">Anda</div><div class="whitespace-pre-wrap">${escapeHTML(prompt)}</div></div></div>`;
            
            box.innerHTML += `<div id="typingIndicator" class="flex justify-start fade-in"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1 text-gray-500">Asisten AI</div><div class="animate-pulse text-blue-600">Sedang mengetik...</div></div></div>`;
            
            box.scrollTop = box.scrollHeight;

            try{
                const ctx=await getSchoolContext();
                
                const sys = `Anda adalah Asisten AI Guru. Data sekolah: ${JSON.stringify(ctx)}. Saat membuat soal pilihan ganda, WAJIB gunakan format PLAIN TEXT berikut:
1. Pertanyaan lengkap di sini?
A. Pilihan A
B. Pilihan B
C. Pilihan C
D. Pilihan D
Jawaban: B

ATURAN: Hanya 4 pilihan (A, B, C, D) tanpa E. Tulis "Jawaban: X" di akhir setiap soal. Di bagian paling akhir, buat ringkasan "Kunci Jawaban:".`;
                
                aiChatHistory.push({role:'user', content:prompt});
                
                const res = await puter.ai.chat([{role:'system',content:sys}, ...aiChatHistory]);
                let ans = typeof res==='string' ? res : (res.message?.content || '');
                
                aiChatHistory.push({role:'assistant', content:ans});

                document.getElementById('typingIndicator')?.remove();

                const formattedHTML = formatSoalHTML(ans);
                lastAIFormattedHTML = formattedHTML;
                
                box.innerHTML += `<div class="flex justify-start fade-in"><div class="max-w-[95%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1 text-gray-500">Asisten AI</div><div class="ai-output text-gray-800">${formattedHTML}</div></div></div>`;
                
                box.scrollTop = box.scrollHeight;

                ['aiPrintBtn', 'aiWordBtn', 'aiPrintKeyBtn'].forEach(id => document.getElementById(id).classList.remove('hidden'));
            }catch(e){
                document.getElementById('typingIndicator')?.remove();
                showToast('Error AI: ' + e.message,'error');
            }finally{
                btn.disabled=false; btn.innerText='Kirim';
            }
        }

        function printAIResult(includeAnswerKey = false) { 
            if(!lastAIFormattedHTML) return; 
            let cleanHTML = lastAIFormattedHTML;
            
            if(!includeAnswerKey) {
                cleanHTML = cleanHTML.replace(/<div class="kunci-jawaban-section[^"]*"[^>]*>[\s\S]*?<\/div><\/div>/g, '');
                cleanHTML = cleanHTML.replace(/<div class="soal-answer[^"]*"[^>]*>[\s\S]*?<\/div>/g, '');
                cleanHTML = cleanHTML.replace(/class="soal-opt[^"]*correct[^"]*"/g, 'class="soal-opt"');
            } else {
                cleanHTML = cleanHTML.replace(/hide-on-print/g, '');
            }
            
            document.getElementById('printArea').innerHTML = `
            <div style="font-family: 'Times New Roman', Georgia, serif; color: #000; padding: 0; margin: 0; width: 100%;">
                <div style="text-align: center; border-bottom: 3px solid #000; padding-bottom: 15px; margin-bottom: 25px;">
                    <h2 style="margin:0; font-size: 18px;">SOAL PILIHAN GANDA</h2>
                    <p style="margin: 5px 0 0; font-size: 12px;">Dibuat oleh GURU SMART</p>
                </div>
                <div class="ai-output" style="color: #000; margin: 0; padding: 0;">${cleanHTML}</div>
            </div>`; 
            window.print(); 
        }

        function exportToWord() {
            if(!lastAIFormattedHTML) { showToast('Tidak ada teks untuk diekspor', 'error'); return; }
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = lastAIFormattedHTML;
            
            tempDiv.querySelectorAll('.kunci-jawaban-section, .soal-answer').forEach(el => el.remove());
            tempDiv.querySelectorAll('.soal-opt.correct').forEach(el => el.classList.remove('correct'));
            
            tempDiv.querySelectorAll('.soal-item').forEach(item => {
                item.style.marginBottom = '18px';
                item.style.paddingBottom = '15px';
                item.style.borderBottom = '1px solid #eee';
                item.style.overflow = 'hidden'; 
            });
            tempDiv.querySelectorAll('.soal-header').forEach(header => {
                header.style.marginBottom = '8px';
            });
            tempDiv.querySelectorAll('.soal-number').forEach(num => {
                num.style.fontWeight = 'bold';
                num.style.marginRight = '8px';
            });
            tempDiv.querySelectorAll('.soal-text').forEach(text => {
                text.style.fontWeight = '600';
                text.style.lineHeight = '1.6';
            });
            
            tempDiv.querySelectorAll('.soal-opts').forEach(optsDiv => {
                optsDiv.style.display = 'block';
                optsDiv.style.width = '100%';
                optsDiv.style.marginLeft = '25px';
                optsDiv.style.marginTop = '8px';
                
                const cols = optsDiv.querySelectorAll('.opt-col');
                cols.forEach(col => {
                    col.style.display = 'inline-block';
                    col.style.width = '48%';
                    col.style.verticalAlign = 'top';
                    col.style.styleFloat = 'left';
                    col.style.cssFloat = 'left';
                    col.style.marginRight = '2%';
                });
            });
            
            let cleanHTML = tempDiv.innerHTML;
            
            const header = `<html xmlns:o='urn:schemas-microsoft-com:office:office' xmlns:w='urn:schemas-microsoft-com:office:word' xmlns='http://www.w3.org/TR/REC-html40'><head><meta charset='utf-8'><title>Soal - GURU SMART</title>
            <style>
                @page { size: 21cm 29.7cm; margin: 2cm; }
                body { font-family: 'Times New Roman', Georgia, serif; font-size: 12pt; color: #000; line-height: 1.5; }
                h2 { text-align: center; font-size: 16pt; margin-bottom: 5px; }
                p { text-align: center; font-size: 10pt; margin-top: 0; }
            </style></head><body>
            <div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;">
                <h2>SOAL PILIHAN GANDA</h2>
                <p>Dibuat oleh GURU SMART</p>
            </div>`;
            
            const footer = `</body></html>`;
            const sourceHTML = header + cleanHTML + footer;
            
            const blob = new Blob(['\ufeff', sourceHTML], {type: 'application/msword'});
            const url = URL.createObjectURL(blob);
            const fileDownload = document.createElement("a");
            fileDownload.href = url;
            fileDownload.download = 'Soal_Guru_Smart.doc';
            document.body.appendChild(fileDownload);
            fileDownload.click();
            document.body.removeChild(fileDownload);
            URL.revokeObjectURL(url);
            showToast('Berhasil diekspor ke Word', 'success');
        }
