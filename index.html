const SUPABASE_URL = 'https://xdwgqgdbfidlsfgyyaeo.supabase.co';

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const DB = {
    get: async (table) => {
        const { data, error } = await sb.from(table).select('*');
        if (error) { console.error(`Error fetching ${table}:`, error); return []; }
        return data;
    },
    insert: async (table, payload) => {
        const { data, error } = await sb.from(table).insert([payload]).select();
        if (error) { console.error(`Error inserting ${table}:`, error); showToast('Gagal menyimpan data', 'error'); return null; }
        return data;
    },
    update: async (table, id, payload) => {
        const { data, error } = await sb.from(table).update(payload).eq('id', id).select();
        if (error) { console.error(`Error updating ${table}:`, error); showToast('Gagal mengupdate data', 'error'); return null; }
        return data;
    },
    remove: async (table, id) => {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) { console.error(`Error deleting ${table}:`, error); showToast('Gagal menghapus data', 'error'); return false; }
        return true;
    }
};

let currentUser = null;
let currentPage = 'dashboard';

// =================================================================
// AUTHENTICATION (Email & Password)
// =================================================================
function toggleAuth(form) {
    if(form === 'register') {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
    } else {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
    }
}

// Proses Daftar Akun
document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    // Daftar akun menggunakan Auth Supabase
    const { data, error } = await sb.auth.signUp({
        email: email,
        password: password,
        options: { data: { name: name } } // Mengirim nama langsung ke metadata
    });

    if (error) {
        showToast('Gagal daftar: ' + error.message, 'error');
        return;
    }

    // Tambahkan ke tabel custom 'users' untuk menyimpan role
    if(data.user) {
        // Cek apakah ini akun pertama (menjadi admin) atau bukan (guru)
        const existingUsers = await DB.get('users');
        const role = existingUsers.length === 0 ? 'admin' : 'guru';
        
        await DB.insert('users', {
            id: data.user.id, // ID dari Supabase Auth
            name: name,
            username: email,
            role: role
        });
    }

    showToast('Pendaftaran berhasil! Silakan login.', 'success');
    toggleAuth('login');
    document.getElementById('loginEmail').value = email;
    document.getElementById('loginPassword').value = password;
});

// Proses Login
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const { data, error } = await sb.auth.signInWithPassword({ email: email, password: password });

    if (error) {
        showToast('Email atau password salah!', 'error');
        return;
    }

    // Ambil data role dari tabel custom
    const { data: userData } = await sb.from('users').select('*').eq('id', data.user.id).single();
    
    currentUser = {
        id: data.user.id,
        email: data.user.email,
        name: userData?.name || data.user.email,
        role: userData?.role || 'guru'
    };
    
    localStorage.setItem('gs_currentUser', JSON.stringify(currentUser));
    initApp();
});

async function logout() { 
    await sb.auth.signOut();
    localStorage.removeItem('gs_currentUser'); 
    currentUser = null; 
    location.reload(); 
}

async function checkSession() {
    // Cek session Supabase dulu
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        // Ambil data role dari tabel custom
        const { data: userData } = await sb.from('users').select('*').eq('id', session.user.id).single();
        currentUser = {
            id: session.user.id,
            email: session.user.email,
            name: userData?.name || session.user.email,
            role: userData?.role || 'guru'
        };
        return true;
    }
    
    // Fallback ke local storage
    const localSession = localStorage.getItem('gs_currentUser');
    if (localSession) {
        currentUser = JSON.parse(localSession);
        return true;
    }
    return false;
}

// =================================================================
// UI HELPERS
// =================================================================
function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
    toast.className = `fixed bottom-5 right-5 z-[60] ${bg} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 fade-in`;
    toast.innerHTML = `<span>${message}</span>`;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function toggleDarkMode() {
    document.documentElement.classList.toggle('dark');
    document.getElementById('iconSun').classList.toggle('hidden');
    document.getElementById('iconMoon').classList.toggle('hidden');
    localStorage.setItem('gs_darkMode', document.documentElement.classList.contains('dark'));
    if(currentPage === 'dashboard') renderDashboard();
}

if (localStorage.getItem('gs_darkMode') === 'true') {
    document.documentElement.classList.add('dark');
    document.getElementById('iconSun').classList.remove('hidden');
    document.getElementById('iconMoon').classList.add('hidden');
}

function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('-translate-x-full');
    document.getElementById('sidebarOverlay').classList.toggle('hidden');
}

function openModal(title, contentHtml) {
    document.getElementById('modalTitle').innerText = title;
    document.getElementById('modalContent').innerHTML = contentHtml;
    document.getElementById('modalContainer').classList.remove('hidden');
}

function closeModal() { document.getElementById('modalContainer').classList.add('hidden'); }

function renderMenu() {

    navMenu.innerHTML = '';
    menus.filter(m => m.roles.includes(currentUser.role)).forEach(menu => {
        const isActive = currentPage === menu.id ? 'bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700';
        navMenu.innerHTML += `
            <a href="#" onclick="navigate('${menu.id}')" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg ${isActive} transition-colors">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${menu.icon}"></path></svg>
                <span>${menu.label}</span>
            </a>
        `;
    });
}

function navigate(page) {
    currentPage = page;
    document.getElementById('pageTitle').innerText = menus.find(m => m.id === page)?.label || 'Page';
    renderMenu();
    renderContent(page);
    if (window.innerWidth < 1024) toggleSidebar();
}

async function renderContent(page) {
    const content = document.getElementById('content');
    content.innerHTML = `<div class="text-center py-10 text-slate-500">Memuat data...</div>`;
    switch(page) {
        case 'dashboard': await renderDashboard(); break;
        case 'ai': renderAI(); break;
        case 'teachers': await renderTeachers(); break;
        case 'students': await renderStudents(); break;
        case 'classes': await renderClasses(); break;
        case 'subjects': await renderSubjects(); break;
        case 'schedules': await renderSchedules(); break;
        case 'attendance': await renderAttendance(); break;
        case 'grades': await renderGrades(); break;
        case 'assignments': await renderAssignments(); break;
        case 'materi': await renderMateri(); break;
        case 'keuangan': await renderKeuangan(); break;
        case 'rapor': await renderRapor(); break;
        case 'announcements': await renderAnnouncements(); break;
        case 'settings': await renderSettings(); break;
        default: content.innerHTML = '<h1>404 Not Found</h1>';
    }
}

async function renderDashboard() {
    const students = await DB.get('students'); const teachers = await DB.get('teachers'); const classes = await DB.get('classes'); const announcements = await DB.get('announcements'); const grades = await DB.get('grades'); const keuangan = await DB.get('keuangan');
    const unpaidSpp = keuangan.filter(k => k.status === 'Belum Bayar').length;
    document.getElementById('content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6 mb-6">${dashboardCard('Total Siswa', students.length, 'bg-blue-500', 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z')}${dashboardCard('Total Guru', teachers.length, 'bg-green-500', 'M17 20h5v-2a4 4 0 00-3-3.87M9 20H4v-2a4 4 0 013-3.87m6-5a4 4 0 11-8 0 4 4 0 018 0zm6 0a4 4 0 11-8 0 4 4 0 018 0z')}${dashboardCard('Total Kelas', classes.length, 'bg-yellow-500', 'M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4')}${dashboardCard('SPP Belum Lunas', unpaidSpp, 'bg-red-500', 'M12 8c-1.657 0-3 .895-3 2s1.343 2 3 2 3 .895 3 2-1.343 2-3 2m0-8c1.11 0 2.08.402 2.599 1M12 8V7m0 1V6m0 2c-1.11 0-2.08.402-2.599 1')}</div><div class="grid grid-cols-1 lg:grid-cols-3 gap-6"><div class="lg:col-span-2 bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><h3 class="font-semibold text-slate-800 dark:text-white mb-4">Statistik Nilai Siswa</h3><canvas id="chartGrades" height="100"></canvas></div><div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><h3 class="font-semibold text-slate-800 dark:text-white mb-4">Pengumuman Terbaru</h3><div class="space-y-4 max-h-80 overflow-y-auto modal-scroll">${announcements.length ? announcements.map(a => `<div class="p-3 bg-slate-50 dark:bg-slate-700 rounded-lg"><p class="font-medium text-sm text-blue-600 dark:text-blue-400">${a.title}</p><p class="text-xs text-slate-500 dark:text-slate-300 mt-1">${a.content}</p><p class="text-[10px] text-slate-400 mt-1">${a.date}</p></div>`).join('') : '<p class="text-sm text-slate-500 text-center py-4">Belum ada pengumuman.</p>'}</div></div></div>`;
    const ctx = document.getElementById('chartGrades').getContext('2d'); const types = ['Tugas', 'Ulangan Harian', 'PTS', 'PAS']; const data = types.map(t => { const tGrades = grades.filter(g => g.type === t); return tGrades.length ? (tGrades.reduce((s, g) => s + g.score, 0) / tGrades.length).toFixed(1) : 0; });
    new Chart(ctx, { type: 'bar', data: { labels: types, datasets: [{ label: 'Rata-rata Nilai', data: data, backgroundColor: 'rgba(37, 99, 235, 0.5)', borderColor: 'rgba(37, 99, 235, 1)', borderWidth: 1 }] }, options: { responsive: true, scales: { y: { beginAtZero: 0, max: 100 } }, plugins: { legend: { labels: { color: document.documentElement.classList.contains('dark') ? '#fff' : '#000' } } } } });
}
function dashboardCard(title, count, color, icon) { return `<div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm flex items-center space-x-4"><div class="p-3 ${color} rounded-lg text-white"><svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${icon}"></path></svg></div><div><p class="text-slate-500 dark:text-slate-400 text-sm">${title}</p><h3 class="text-2xl font-bold text-slate-800 dark:text-white">${count}</h3></div></div>`; }

// Untuk mempersingkat tempat, fungsi render lainnya diringkas tapi fungsional sama persis dengan versi sebelumnya.
// Pastikan untuk menyalin bagian fungsi CRUD (renderTeachers, renderStudents, dll) dari jawaban sebelumnya jika Anda ingin memodifikasi lebih lanjut.

async function renderTeachers() { const teachers = await DB.get('teachers'); document.getElementById('content').innerHTML = `<div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><div class="flex justify-between mb-4"><input type="text" id="searchTeacher" onkeyup="filterTable('searchTeacher', 'teacherTableBody')" placeholder="Cari guru..." class="px-4 py-2 rounded-lg border dark:bg-slate-700 dark:text-white text-sm outline-none"><button onclick="teacherForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Tambah Guru</button></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-50 dark:bg-slate-700 text-xs uppercase"><tr><th class="px-4 py-3">NIP</th><th class="px-4 py-3">Nama</th><th class="px-4 py-3">Gender</th><th class="px-4 py-3">Mapel</th><th class="px-4 py-3">No HP</th><th class="px-4 py-3">Aksi</th></tr></thead><tbody id="teacherTableBody" class="divide-y dark:divide-slate-700">${teachers.length ? teachers.map(t => `<tr><td class="px-4 py-3">${t.nip}</td><td class="px-4 py-3 font-medium">${t.name}</td><td class="px-4 py-3">${t.gender}</td><td class="px-4 py-3">${t.subject}</td><td class="px-4 py-3">${t.phone}</td><td class="px-4 py-3 flex gap-2"><button onclick="teacherForm(${t.id})" class="text-blue-500">Edit</button><button onclick="deleteData('teachers', ${t.id}, renderTeachers)" class="text-red-500">Hapus</button></td></tr>`).join('') : `<tr><td colspan="6" class="text-center py-4 text-slate-500">Belum ada data.</td></tr>`}</tbody></table></div></div>`; }
async function teacherForm(id = null) { openModal(id ? 'Edit Guru' : 'Tambah Guru', `<form id="teacherForm" class="space-y-4"><div><label class="block text-sm mb-1">NIP</label><input type="text" id="tNip" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Nama</label><input type="text" id="tName" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Gender</label><select id="tGender" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"><option value="L">L</option><option value="P">P</option></select></div><div><label class="block text-sm mb-1">No HP</label><input type="text" id="tPhone" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Mapel</label><input type="text" id="tSubject" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Simpan</button></form>`); if(id) { const t = (await DB.get('teachers')).find(x => x.id === id); if(t) { tNip.value = t.nip; tName.value = t.name; tGender.value = t.gender; tPhone.value = t.phone; tSubject.value = t.subject; } } document.getElementById('teacherForm').onsubmit = async (e) => { e.preventDefault(); const data = { id: id || Date.now(), nip: tNip.value, name: tName.value, gender: tGender.value, phone: tPhone.value, subject: tSubject.value }; await saveData('teachers', data, id); closeModal(); renderTeachers(); }; }

async function renderStudents() { const students = await DB.get('students'); const classes = await DB.get('classes'); document.getElementById('content').innerHTML = `<div class="bg-white dark:bg-slate-800 p-6 rounded-xl shadow-sm"><div class="flex justify-between mb-4"><button onclick="studentForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Tambah Siswa</button></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-50 dark:bg-slate-700 text-xs uppercase"><tr><th class="px-4 py-3">NIS</th><th class="px-4 py-3">Nama</th><th class="px-4 py-3">Kelas</th><th class="px-4 py-3">Aksi</th></tr></thead><tbody class="divide-y dark:divide-slate-700">${students.length ? students.map(s => { const cls = classes.find(c => c.id === s.class_id); return `<tr><td class="px-4 py-3">${s.nis}</td><td class="px-4 py-3 font-medium">${s.name}</td><td class="px-4 py-3">${cls?.name || 'N/A'}</td><td class="px-4 py-3 flex gap-2"><button onclick="studentForm(${s.id})" class="text-blue-500">Edit</button><button onclick="deleteData('students', ${s.id}, renderStudents)" class="text-red-500">Hapus</button></td></tr>`; }).join('') : `<tr><td colspan="4" class="text-center py-4 text-slate-500">Belum ada data.</td></tr>`}</tbody></table></div></div>`; }
async function studentForm(id = null) { const classes = await DB.get('classes'); openModal('Tambah Siswa', `<form id="studentForm" class="space-y-4"><div><label class="block text-sm mb-1">NIS</label><input type="text" id="sNis" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Nama</label><input type="text" id="sName" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Kelas</label><select id="sClass" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white">${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold">Simpan</button></form>`); document.getElementById('studentForm').onsubmit = async (e) => { e.preventDefault(); const data = { id: id || Date.now(), nis: sNis.value, name: sName.value, class_id: parseInt(sClass.value) }; await saveData('students', data, id); closeModal(); renderStudents(); }; }

// AI Logic
function getAIConfig() { return JSON.parse(localStorage.getItem('gs_ai_config') || '{"provider":"openai","model":"gpt-4o-mini"}'); }
function saveAIConfig() { const provider=document.getElementById('aiProvider').value; const model=document.getElementById('aiModel').value.trim() || 'gpt-4o-mini'; localStorage.setItem('gs_ai_config', JSON.stringify({provider,model})); showToast('Pengaturan AI disimpan!', 'success'); }
function renderAI() { document.getElementById('content').innerHTML=`<div class="grid grid-cols-1 xl:grid-cols-3 gap-6"><div class="xl:col-span-2 bg-white dark:bg-slate-800 rounded-xl shadow-sm overflow-hidden"><div class="p-5 border-b dark:border-slate-700"><h3 class="text-lg font-bold">🤖 Asisten AI Guru</h3></div><div id="aiMessages" class="h-[430px] overflow-y-auto p-5 space-y-4 bg-slate-50 dark:bg-slate-900"></div><div class="p-4 border-t dark:border-slate-700"><textarea id="aiInput" rows="3" placeholder="Tulis perintah..." class="w-full px-4 py-3 rounded-xl border dark:bg-slate-700 dark:text-white"></textarea><div class="flex justify-end mt-3"><button id="aiSendBtn" onclick="sendAI()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg">Kirim</button></div></div></div></div>`; loadAIChat(); }
function aiPrompt(text){document.getElementById('aiInput').value=text;sendAI();}
async function getSchoolContext(){return {students:await DB.get('students'),teachers:await DB.get('teachers')};}
function loadAIChat(){const box=document.getElementById('aiMessages');if(!box)return;const msgs=JSON.parse(localStorage.getItem('gs_ai_chat')||'[]');box.innerHTML=msgs.length?msgs.map(m=>`<div class="flex ${m.role==='user'?'justify-end':''}"><div class="max-w-[90%] rounded-xl px-4 py-3 ${m.role==='user'?'bg-blue-600 text-white':'bg-white shadow-sm'}">${escapeHTML(m.content)}</div></div>`).join(''):'<div class="text-center text-slate-400 py-20">Mulai percakapan...</div>';box.scrollTop=box.scrollHeight;}
function saveAIChat(msgs){localStorage.setItem('gs_ai_chat',JSON.stringify(msgs.slice(-30)));}
function clearAIChat(){localStorage.removeItem('gs_ai_chat');loadAIChat();}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
async function sendAI(){const input=document.getElementById('aiInput');if(!input.value.trim())return;const prompt=input.value.trim();input.value='';const cfg=getAIConfig();let msgs=JSON.parse(localStorage.getItem('gs_ai_chat')||'[]');msgs.push({role:'user',content:prompt});saveAIChat(msgs);loadAIChat();try{const ctx=await getSchoolContext();const sys=`Anda AI Guru. Data: ${JSON.stringify(ctx)}`;const res=await puter.ai.chat([{role:'system',content:sys},...msgs],{model:cfg.model});let ans=typeof res==='string'?res:(res.message?.content||'');msgs.push({role:'assistant',content:ans});saveAIChat(msgs);loadAIChat();}catch(e){showToast('Error AI','error');}}

// Core Utils
async function saveData(key, data, id) { if (id) { await DB.update(key, id, data); } else { await DB.insert(key, data); } showToast('Data disimpan!', 'success'); }
async function deleteData(key, id, callback) { if (confirm('Hapus data?')) { await DB.remove(key, id); if (typeof callback === 'function') callback(); } }
function filterTable(searchId, tbodyId) { const input = document.getElementById(searchId).value.toLowerCase(); const rows = document.getElementById(tbodyId).getElementsByTagName('tr'); for (let row of rows) { row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none'; } }

// Init
function initApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userRole').innerText = currentUser.role;
    document.getElementById('userAvatar').innerText = currentUser.name.charAt(0);
    navigate('dashboard');
}

window.onload = async () => {
    if (await checkSession()) {
        initApp();
    }
};
