const DB = {
    get: async (table) => {
        const { data, error } = await sb.from(table).select('*');
        if (error) { console.error(`Error fetching ${table}:`, error); return []; }
        return data;
    },
    insert: async (table, payload) => {
        const { data, error } = await sb.from(table).insert([payload]).select();
        if (error) { console.error(`Error inserting ${table}:`, error); showToast('Gagal menyimpan data', 'error'); return null; }
        return data;
    },
    update: async (table, id, payload) => {
        const { data, error } = await sb.from(table).update(payload).eq('id', id).select();
        if (error) { console.error(`Error updating ${table}:`, error); showToast('Gagal mengupdate data', 'error'); return null; }
        return data;
    },
    remove: async (table, id) => {
        const { error } = await sb.from(table).delete().eq('id', id);
        if (error) { console.error(`Error deleting ${table}:`, error); showToast('Gagal menghapus data', 'error'); return false; }
        return true;
    }
};

let currentUser = null;
let currentPage = 'dashboard';

// =================================================================
// AUTHENTICATION
// =================================================================
function toggleAuth(form) {
    if(form === 'register') {
        document.getElementById('loginForm').classList.add('hidden');
        document.getElementById('registerForm').classList.remove('hidden');
    } else {
        document.getElementById('registerForm').classList.add('hidden');
        document.getElementById('loginForm').classList.remove('hidden');
    }
}

document.getElementById('registerForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    const password = document.getElementById('regPassword').value;

    const { data, error } = await sb.auth.signUp({ email, password, options: { data: { name } } });
    if (error) { showToast('Gagal daftar: ' + error.message, 'error'); return; }

    const existingUsers = await DB.get('users');
    const role = existingUsers.length === 0 ? 'admin' : 'guru';

    if(data.user) {
        await DB.insert('users', { id: data.user.id, name, username: email, role });
    }

    if (data.session) {
        currentUser = { id: data.user.id, email: data.user.email, name, role };
        localStorage.setItem('gs_currentUser', JSON.stringify(currentUser));
        showToast('Pendaftaran berhasil! Mengalihkan ke Dashboard...', 'success');
        initApp();
    } else {
        showToast('Pendaftaran berhasil! Cek email untuk verifikasi, lalu login.', 'success');
        toggleAuth('login');
        document.getElementById('loginEmail').value = email;
    }
});

document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const email = document.getElementById('loginEmail').value;
    const password = document.getElementById('loginPassword').value;
    
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) { showToast('Login gagal: ' + error.message, 'error'); return; }

    const { data: userData } = await sb.from('users').select('*').eq('id', data.user.id).single();
    currentUser = { id: data.user.id, email: data.user.email, name: userData?.name || data.user.email, role: userData?.role || 'guru', avatar_url: userData?.avatar_url || AI_IMG };
    localStorage.setItem('gs_currentUser', JSON.stringify(currentUser));
    initApp();
});

async function logout() { await sb.auth.signOut(); localStorage.removeItem('gs_currentUser'); currentUser = null; location.reload(); }
async function checkSession() {
    const { data: { session } } = await sb.auth.getSession();
    if (session) {
        const { data: userData } = await sb.from('users').select('*').eq('id', session.user.id).single();
        currentUser = { id: session.user.id, email: session.user.email, name: userData?.name || session.user.email, role: userData?.role || 'guru', avatar_url: userData?.avatar_url || AI_IMG };
        return true;
    }
    const localSession = localStorage.getItem('gs_currentUser');
    if (localSession) { currentUser = JSON.parse(localSession); return true; }
    return false;
}

// =================================================================

function showToast(message, type = 'info') {
    const toast = document.getElementById('toast');
    const bg = type === 'success' ? 'bg-green-600' : type === 'error' ? 'bg-red-600' : 'bg-slate-800';
    toast.className = `fixed bottom-5 right-5 z-[60] ${bg} text-white px-4 py-3 rounded-lg shadow-lg flex items-center space-x-2 fade-in`;
    toast.innerHTML = `<span>${message}</span>`;
    toast.classList.remove('hidden');
    setTimeout(() => toast.classList.add('hidden'), 3000);
}

function toggleDarkMode() {
    document.documentElement.classList.toggle('dark');
    document.getElementById('iconSun').classList.toggle('hidden');
    document.getElementById('iconMoon').classList.toggle('hidden');
    localStorage.setItem('gs_darkMode', document.documentElement.classList.contains('dark'));
    if(currentPage === 'dashboard') renderDashboard();
}
if (localStorage.getItem('gs_darkMode') === 'true') { document.documentElement.classList.add('dark'); document.getElementById('iconSun').classList.remove('hidden'); document.getElementById('iconMoon').classList.add('hidden'); }
function toggleSidebar() { document.getElementById('sidebar').classList.toggle('-translate-x-full'); document.getElementById('sidebarOverlay').classList.toggle('hidden'); }
function openModal(title, contentHtml) { document.getElementById('modalTitle').innerText = title; document.getElementById('modalContent').innerHTML = contentHtml; document.getElementById('modalContainer').classList.remove('hidden'); }
function closeModal() { document.getElementById('modalContainer').classList.add('hidden'); }

function renderMenu() {
    const navMenu = document.getElementById('navMenu'); navMenu.innerHTML = '';
    menus.filter(m => m.roles.includes(currentUser.role)).forEach(menu => {
        const isActive = currentPage === menu.id ? 'bg-blue-50 dark:bg-slate-700 text-blue-600 dark:text-white' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700';
        navMenu.innerHTML += `<a href="#" onclick="navigate('${menu.id}')" class="flex items-center space-x-3 px-3 py-2.5 rounded-lg ${isActive} transition-colors"><svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="${menu.icon}"></path></svg><span>${menu.label}</span></a>`;
    });
}
function navigate(page) { 
    currentPage = page; 
    document.getElementById('pageTitle').innerText = menus.find(m => m.id === page)?.label || 'Page'; 
    renderMenu(); 
    renderContent(page); 
    if (window.innerWidth < 1024) toggleSidebar(); 
    
    // Handle tombol back HP
    try {
        window.history.pushState({ page: page }, "");
    } catch(e) { console.warn("History pushState error:", e); }
}

window.addEventListener('popstate', (e) => {
    if (e.state && e.state.page) {
        navigate(e.state.page);
    } else if (currentPage !== 'dashboard') {
        navigate('dashboard');
    } else {
        showToast("Tekan tombol keluar untuk menutup aplikasi", "info");
        try { history.pushState(null, null, window.location.href); } catch(err) {}
    }
});

async function renderContent(page) {
    document.getElementById('content').innerHTML = `<div class="text-center py-10 text-slate-500">Memuat data...</div>`;
    switch(page) {
        case 'dashboard': await renderDashboard(); break;
        case 'ai': renderAI(); break;
        case 'teachers': await renderTeachers(); break;
        case 'students': await renderStudents(); break;
        case 'classes': await renderClasses(); break;
        case 'subjects': await renderSubjects(); break;
        case 'schedules': await renderSchedules(); break;
        case 'attendance': await renderAttendance(); break;
        case 'grades': await renderGrades(); break;
        case 'assignments': await renderAssignments(); break;
        case 'materi': await renderMateri(); break;
        case 'keuangan': await renderKeuangan(); break;
        case 'rapor': await renderRapor(); break;
        case 'announcements': await renderAnnouncements(); break;
        case 'settings': await renderSettings(); break;
    }
}

async function renderAttendance() { const students = await DB.get('students'); const classes = await DB.get('classes'); document.getElementById('content').innerHTML = `<div class="bg-white dark:bg-slate-800 p-6 rounded-xl card-shadow"><div class="flex justify-between mb-4 items-center"><h3 class="font-semibold">Input Absensi</h3><div class="flex gap-2"><select id="attClass" class="px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white text-sm">${classes.map(c => `<option value="${c.id}">${c.name}</option>`).join('')}</select><input type="date" id="attDate" class="px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white text-sm"></div></div><div class="overflow-x-auto"><table class="w-full text-sm text-left"><thead class="bg-slate-50 dark:bg-slate-700 text-xs uppercase"><tr><th class="px-4 py-3">Nama Siswa</th><th class="px-4 py-3">Status</th></tr></thead><tbody class="divide-y dark:divide-slate-700">${students.length ? students.map(s => `<tr><td class="px-4 py-3">${s.name}</td><td class="px-4 py-3"><select id="att_${s.id}" class="px-2 py-1 border rounded dark:bg-slate-700 dark:text-white text-xs"><option value="Hadir">Hadir</option><option value="Sakit">Sakit</option><option value="Izin">Izin</option><option value="Alpa">Alpa</option></select></td></tr>`).join('') : `<tr><td colspan="2" class="text-center py-4 text-slate-500">Belum ada data siswa.</td></tr>`}</tbody></table></div><button onclick="saveAttendance()" class="mt-4 bg-blue-600 text-white px-4 py-2 rounded-lg text-sm font-semibold">Simpan Absensi</button></div>`; }
async function saveAttendance() { const students = await DB.get('students'); const date = document.getElementById('attDate').value; if(!date){ showToast('Pilih tanggal!', 'error'); return; } for(const s of students) { const status = document.getElementById(`att_${s.id}`).value; const existingAtt = await sb.from('attendance').select('*').eq('student_id', s.id).eq('date', date).single(); if(existingAtt.data) { await DB.update('attendance', existingAtt.data.id, { status }); } else { await DB.insert('attendance', { id: Date.now() + s.id, student_id: s.id, date, status, subject: 'Umum' }); } } showToast('Absensi disimpan!', 'success'); }

async function renderGrades() { const students = await DB.get('students'); const subjects = await DB.get('subjects'); const grades = await DB.get('grades'); if(currentUser.role === 'siswa') { const myGrades = grades.filter(g => g.student_id === currentUser.id); document.getElementById('content').innerHTML = `<div class="bg-white p-6 rounded-xl card-shadow"><h3 class="font-bold mb-4">Nilai Saya</h3><ul class="divide-y">${myGrades.length ? myGrades.map(g => { const sub = subjects.find(s => s.id === g.subject_id); return `<li class="py-3 flex justify-between"><span>${sub?.name || ''} (${g.type})</span><span class="font-bold text-blue-600">${g.score}</span></li>`; }).join('') : '<li class="py-4 text-center text-slate-500">Belum ada nilai.</li>'}</ul></div>`; return; } document.getElementById('content').innerHTML = `<div class="bg-white p-6 rounded-xl card-shadow"><div class="flex justify-between mb-4"><h3 class="font-bold">Input Nilai Massal</h3><button onclick="gradeForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Input Nilai</button></div><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="px-4 py-3">Nama</th><th class="px-4 py-3">Mapel</th><th class="px-4 py-3">Tipe</th><th class="px-4 py-3">Nilai</th><th class="px-4 py-3">Aksi</th></tr></thead><tbody class="divide-y">${grades.length ? grades.map(g => { const std = students.find(s => s.id === g.student_id); const sub = subjects.find(s => s.id === g.subject_id); return `<tr><td class="px-4 py-3">${std?.name || ''}</td><td class="px-4 py-3">${sub?.name || ''}</td><td class="px-4 py-3">${g.type}</td><td class="px-4 py-3 font-bold text-blue-600">${g.score}</td><td class="px-4 py-3 flex gap-2"><button onclick="gradeForm(${g.id})" class="text-xs text-blue-500">Edit</button><button onclick="deleteData('grades', ${g.id}, renderGrades)" class="text-xs text-red-500">Hapus</button></td></tr>`; }).join('') : `<tr><td colspan="5" class="text-center py-4 text-slate-500">Belum ada nilai.</td></tr>`}</tbody></table></div>`; }
async function gradeForm(id = null) { const students = await DB.get('students'); const subjects = await DB.get('subjects'); openModal('Input Nilai', `<form id="gradeForm" class="space-y-4"><div><label class="block text-sm mb-1">Siswa</label><select id="gStudent" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white">${students.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div><label class="block text-sm mb-1">Mapel</label><select id="gSubject" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white">${subjects.map(s => `<option value="${s.id}">${s.name}</option>`).join('')}</select></div><div><label class="block text-sm mb-1">Tipe</label><select id="gType" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"><option>Tugas</option><option>Ulangan Harian</option><option>PTS</option><option>PAS</option></select></div><div><label class="block text-sm mb-1">Nilai</label><input type="number" id="gScore" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Simpan</button></form>`); if(id) { const g = (await DB.get('grades')).find(x => x.id === id); if(g) { gStudent.value = g.student_id; gSubject.value = g.subject_id; gType.value = g.type; gScore.value = g.score; } } document.getElementById('gradeForm').onsubmit = async (e) => { e.preventDefault(); await saveData('grades', { id: id || Date.now(), student_id: parseInt(gStudent.value), subject_id: parseInt(gSubject.value), type: gType.value, score: parseInt(gScore.value) }, id); closeModal(); renderGrades(); }; }

async function renderKeuangan() { const keuangan = await DB.get('keuangan'); const students = await DB.get('students'); document.getElementById('content').innerHTML = `<div class="bg-white p-6 rounded-xl card-shadow"><div class="flex justify-between mb-4"><h3 class="font-bold">Pembayaran SPP</h3><button onclick="keuanganForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Catat Pembayaran</button></div><table class="w-full text-sm"><thead class="bg-slate-50"><tr><th class="px-4 py-3">Siswa</th><th class="px-4 py-3">Bulan</th><th class="px-4 py-3">Jumlah</th><th class="px-4 py-3">Status</th><th class="px-4 py-3">Aksi</th></tr></thead><tbody class="divide-y">${keuangan.length ? keuangan.map(k => { const std = students.find(s => s.id === k.student_id); return `<tr><td class="px-4 py-3">${std?.name || ''}</td><td class="px-4 py-3">${k.month}</td><td class="px-4 py-3">Rp ${k.amount.toLocaleString('id-ID')}</td><td class="px-4 py-3"><span class="px-2 py-1 text-xs rounded ${k.status==='Lunas'?'bg-green-100 text-green-700':'bg-red-100 text-red-700'}">${k.status}</span></td><td class="px-4 py-3 flex gap-2">${k.status !== 'Lunas' ? `<button onclick="confirmPayment(${k.id})" class="text-xs text-green-600">Lunasi</button>` : ''}<button onclick="deleteData('keuangan', ${k.id}, renderKeuangan)" class="text-xs text-red-500">Hapus</button></td></tr>`; }).join('') : `<tr><td colspan="5" class="text-center py-4 text-slate-500">Belum ada data.</td></tr>`}</tbody></table></div>`; }

async function renderRapor() { if(currentUser.role === 'siswa') { printRapor(currentUser.id); return; } const students = await DB.get('students'); document.getElementById('content').innerHTML = `<div class="bg-white p-6 rounded-xl card-shadow"><h3 class="font-bold mb-4">Cetak Rapor</h3><div class="grid grid-cols-1 md:grid-cols-3 gap-4">${students.length ? students.map(s => `<button onclick="printRapor(${s.id})" class="p-4 border rounded-lg text-left"><p class="font-bold">${s.name}</p><p class="text-xs text-slate-500">NIS: ${s.nis}</p><span class="mt-2 inline-block text-xs bg-blue-100 text-blue-600 px-2 py-1 rounded">Cetak</span></button>`).join('') : '<div class="col-span-3 text-center py-8 text-slate-500">Belum ada siswa.</div>'}</div></div>`; }
async function printRapor(studentId) { const student = (await DB.get('students')).find(s => s.id === studentId); const classes = (await DB.get('classes')).find(c => c.id === student.class_id); const grades = (await DB.get('grades')).filter(g => g.student_id === studentId); const subjects = await DB.get('subjects'); const profile = (await DB.get('school_profile'))[0] || {}; let gradeRows = ''; let totalScore = 0; let totalSubjects = 0; subjects.forEach(sub => { const subGrades = grades.filter(g => g.subject_id === sub.id); if(subGrades.length > 0){ const avgScore = Math.round(subGrades.reduce((s, g) => s + g.score, 0) / subGrades.length); const predikat = avgScore >= 90 ? 'A' : avgScore >= 80 ? 'B' : avgScore >= 70 ? 'C' : 'D'; gradeRows += `<tr><td style="padding: 8px; border: 1px solid #ddd;">${sub.name}</td><td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${sub.kkm}</td><td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${avgScore}</td><td style="padding: 8px; border: 1px solid #ddd; text-align:center;">${predikat}</td></tr>`; totalScore += avgScore; totalSubjects++; } }); const finalAvg = totalSubjects ? (totalScore/totalSubjects).toFixed(1) : 0; document.getElementById('printArea').innerHTML = `<div style="font-family: Arial; color: #000;"><div style="text-align: center; border-bottom: 3px solid #000; padding-bottom: 15px;"><h2>${profile.name || 'Sekolah'}</h2><p>${profile.address || ''}</p></div><h3 style="text-align: center; margin: 20px 0;">RAPOR SISWA</h3><table style="width: 100%; margin-bottom: 20px;"><tr><td>Nama</td><td>: ${student.name}</td><td>Kelas</td><td>: ${classes?.name || '-'}</td></tr><tr><td>NIS</td><td>: ${student.nis}</td><td>Semester</td><td>: ${profile.semester || '-'}</td></tr></table><table style="width: 100%; border-collapse: collapse;"><thead><tr style="background: #eee;"><th style="padding: 8px; border: 1px solid #ddd;">Mapel</th><th style="padding: 8px; border: 1px solid #ddd;">KKM</th><th style="padding: 8px; border: 1px solid #ddd;">Nilai</th><th style="padding: 8px; border: 1px solid #ddd;">Predikat</th></tr></thead><tbody>${gradeRows || `<tr><td colspan="4" style="text-align:center; padding: 10px; border: 1px solid #ddd;">Belum ada nilai</td></tr>`}</tbody><tfoot><tr><td colspan="2" style="padding: 8px; border: 1px solid #ddd; text-align: right;">Rata-rata:</td><td colspan="2" style="padding: 8px; border: 1px solid #ddd; text-align: center;">${finalAvg}</td></tr></tfoot></table></div>`; window.print(); }

async function renderAnnouncements() { const anns = await DB.get('announcements'); document.getElementById('content').innerHTML = `<div class="bg-white p-6 rounded-xl card-shadow"><div class="flex justify-between mb-4"><h3 class="font-bold">Pengumuman</h3><button onclick="annForm()" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Buat Pengumuman</button></div><div class="space-y-4">${anns.length ? anns.map(a => `<div class="p-4 bg-slate-50 rounded-lg"><div class="flex justify-between"><h4 class="font-bold">${a.title}</h4><div class="flex gap-2"><button onclick="annForm(${a.id})" class="text-xs text-blue-500">Edit</button><button onclick="deleteData('announcements', ${a.id}, renderAnnouncements)" class="text-xs text-red-500">Hapus</button></div></div><p class="text-xs text-slate-400 mt-1">${a.date}</p><p class="text-sm mt-2">${a.content}</p></div>`).join('') : '<p class="text-sm text-slate-500 text-center py-4">Belum ada pengumuman.</p>'}</div></div>`; }
async function annForm(id = null) { openModal('Buat Pengumuman', `<form id="annForm" class="space-y-4"><div><label class="block text-sm mb-1">Judul</label><input type="text" id="anTitle" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white" required></div><div><label class="block text-sm mb-1">Isi</label><textarea id="anContent" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></textarea></div><button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg">Simpan</button></form>`); if(id) { const a = (await DB.get('announcements')).find(x => x.id === id); if(a) { anTitle.value = a.title; anContent.value = a.content; } } document.getElementById('annForm').onsubmit = async (e) => { e.preventDefault(); await saveData('announcements', { id: id || Date.now(), title: anTitle.value, content: anContent.value, date: new Date().toISOString().split('T')[0] }, id); closeModal(); renderAnnouncements(); }; }

async function renderSettings() { const profile = (await DB.get('school_profile'))[0] || {}; document.getElementById('content').innerHTML = `<div class="grid grid-cols-1 md:grid-cols-2 gap-6"><div class="bg-white p-6 rounded-xl card-shadow"><h3 class="font-bold mb-4">Profil Sekolah</h3><form id="profileForm" class="space-y-4"><div><label class="block text-sm mb-1">Nama Sekolah</label><input type="text" id="pName" value="${profile.name || ''}" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Alamat</label><input type="text" id="pAddress" value="${profile.address || ''}" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><div><label class="block text-sm mb-1">Kepala Sekolah</label><input type="text" id="pPrincipal" value="${profile.principal || ''}" class="w-full px-3 py-2 border rounded-lg dark:bg-slate-700 dark:text-white"></div><button type="submit" class="bg-blue-600 text-white px-4 py-2 rounded-lg text-sm">Simpan</button></form></div><div class="bg-white p-6 rounded-xl card-shadow"><h3 class="font-bold mb-4">Pengaturan Akun</h3><div class="flex flex-col items-center space-y-3"><img id="prevAvatar" src="${currentUser.avatar_url || AI_IMG}" class="w-24 h-24 rounded-full object-cover"><input type="file" id="avatarFile" accept="image/*" class="text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"><button onclick="uploadAvatar()" class="bg-green-600 text-white px-4 py-2 rounded-lg text-sm">Upload Foto</button></div></div></div>`; document.getElementById('profileForm').onsubmit = async (e) => { e.preventDefault(); await saveData('school_profile', { id: 1, name: pName.value, address: pAddress.value, principal: pPrincipal.value }, 1); }; }
async function uploadAvatar() { const file = document.getElementById('avatarFile').files[0]; if(!file) { showToast('Pilih file dulu!', 'error'); return; } showToast('Mengunggah foto...', 'info'); const { data, error } = await sb.storage.from('avatars').upload('user_' + currentUser.id + '_' + Date.now() + '.jpg', file); if (error) { showToast('Gagal upload: ' + error.message, 'error'); return; } const url = sb.storage.from('avatars').getPublicUrl(data.path).data.publicUrl; await DB.update('users', currentUser.id, { avatar_url: url }); currentUser.avatar_url = url; localStorage.setItem('gs_currentUser', JSON.stringify(currentUser)); document.getElementById('userAvatar').src = url; showToast('Foto profil diperbarui!', 'success'); }

// AI ASSISTANT LOGIC (Tanpa Kunci Jawaban di PDF, Tambahan Export Word)
function renderAI() { document.getElementById('content').innerHTML=`<div class="grid grid-cols-1 xl:grid-cols-3 gap-6"><div class="xl:col-span-2 bg-white dark:bg-slate-800 rounded-xl card-shadow overflow-hidden"><div class="p-5 border-b dark:border-slate-700 flex justify-between items-center"><div class="flex items-center gap-3"><img src="${AI_IMG}" class="w-10 h-10 rounded-full object-cover"><div><h3 class="text-lg font-bold">Asisten AI Guru</h3><p class="text-xs text-slate-500">Format soal otomatis rapi. Kunci jawaban dihapus saat di-PDF.</p></div></div></div><div id="aiMessages" class="h-[500px] overflow-y-auto p-5 space-y-4 bg-slate-50 dark:bg-slate-900"></div><div class="p-4 border-t dark:border-slate-700"><textarea id="aiInput" rows="3" placeholder="Tulis perintah..." class="w-full px-4 py-3 rounded-xl border dark:bg-slate-700 dark:text-white"></textarea><div class="flex justify-end mt-3 gap-2"><button id="aiPrintBtn" onclick="printAIResult()" class="hidden bg-slate-600 text-white px-4 py-2.5 rounded-lg font-semibold text-sm">Cetak / PDF</button><button id="aiWordBtn" onclick="exportAIToWord()" class="hidden bg-blue-500 text-white px-4 py-2.5 rounded-lg font-semibold text-sm">Export Word</button><button id="aiSendBtn" onclick="sendAI()" class="bg-blue-600 text-white px-6 py-2.5 rounded-lg font-semibold">Kirim</button></div></div></div></div>`; loadAIChat(); }
function aiPrompt(text){document.getElementById('aiInput').value=text;sendAI();}
async function getSchoolContext(){return {students:await DB.get('students'),teachers:await DB.get('teachers'),subjects:await DB.get('subjects')};}
function loadAIChat(){const box=document.getElementById('aiMessages');if(!box)return;box.innerHTML=`<div class="flex justify-start"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1">Asisten AI</div><div class="whitespace-pre-wrap">Halo! Saya adalah Asisten AI Guru Anda. Silakan tulis perintah, misalnya "Buatkan 10 soal pilihan ganda tentang Pemrograman Web beserta kunci jawaban, format dengan markdown yang rapi".</div></div></div>`;}
function escapeHTML(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let lastAIResponse = '';
async function sendAI(){const input=document.getElementById('aiInput');if(!input.value.trim())return;const prompt=input.value.trim();input.value='';const btn=document.getElementById('aiSendBtn');btn.disabled=true;btn.innerText='Memproses...';document.getElementById('aiPrintBtn').classList.add('hidden');document.getElementById('aiWordBtn').classList.add('hidden');const box=document.getElementById('aiMessages');box.innerHTML=`<div class="flex justify-end"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-blue-600 text-white"><div class="text-xs opacity-70 mb-1">Anda</div><div class="whitespace-pre-wrap">${escapeHTML(prompt)}</div></div></div><div class="flex justify-start"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1">Asisten AI</div><div class="animate-pulse">Sedang mengetik...</div></div></div>`;try{const ctx=await getSchoolContext();const sys=`Anda adalah Asisten AI Guru yang membantu di aplikasi GURU SMART. Berikut adalah data sekolah dalam format JSON: ${JSON.stringify(ctx)}. Gunakan data ini jika diperlukan. Jika membuat soal, buat format yang rapi menggunakan markdown (Judul, Pertanyaan, Opsi A-B-C-D, dan Kunci Jawaban di akhir).`;const res=await puter.ai.chat([{role:'system',content:sys},{role:'user',content:prompt}],{model:'gpt-4o-mini'});let ans=typeof res==='string'?res:(res.message?.content||'');lastAIResponse=ans;const htmlAns=marked.parse(ans);box.innerHTML=`<div class="flex justify-end"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-blue-600 text-white"><div class="text-xs opacity-70 mb-1">Anda</div><div class="whitespace-pre-wrap">${escapeHTML(prompt)}</div></div></div><div class="flex justify-start"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-xs opacity-70 mb-1">Asisten AI</div><div class="ai-output">${htmlAns}</div></div></div>`;document.getElementById('aiPrintBtn').classList.remove('hidden');document.getElementById('aiWordBtn').classList.remove('hidden');}catch(e){showToast('Error AI','error');box.innerHTML=`<div class="flex justify-start"><div class="max-w-[90%] rounded-xl px-4 py-3 bg-white shadow-sm"><div class="text-red-500">Terjadi kesalahan saat memuat AI.</div></div></div>`;}finally{btn.disabled=false;btn.innerText='Kirim';}}

// Fungsi Cetak PDF (Hapus Kunci Jawaban)
function printAIResult() { 
    if(!lastAIResponse) return; 
    let printableText = lastAIResponse.replace(/##?\s*Kunci Jawaban[\s\S]*/gi, '**Kunci Jawaban Dihapus untuk Ujian**');
    printableText = printableText.replace(/##?\s*Jawaban[\s\S]*/gi, '**Kunci Jawaban Dihapus untuk Ujian**');
    document.getElementById('printArea').innerHTML = `<div style="font-family: Arial; color: #000; padding: 20px;"><div style="text-align: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 20px;"><h2 style="font-weight:bold; text-transform:uppercase;">Latihan Soal</h2></div><div class="ai-output">${marked.parse(printableText)}</div></div>`; 
    window.print(); 
}

// Fungsi Export ke Word (.doc)
function exportAIToWord() {
    if(!lastAIResponse) return;
    let html = marked.parse(lastAIResponse);
    let fullHtml = `<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:w="urn:schemas-microsoft-com:office:word" xmlns="http://www.w3.org/TR/REC-html40"><head><meta charset="utf-8"><title>Export AI</title></head><body style="font-family: Arial; line-height: 1.5;">${html}</body></html>`;
    let blob = new Blob(['\ufeff', fullHtml], { type: 'application/msword' });
    let url = URL.createObjectURL(blob);
    let a = document.createElement('a');
    a.href = url;
    a.download = 'Hasil_AI_Guru.doc';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
}

// CORE UTILS
async function saveData(key, data, id) { if (id) { await DB.update(key, id, data); } else { await DB.insert(key, data); } showToast('Data disimpan!', 'success'); }
async function deleteData(key, id, callback) { if (confirm('Hapus data?')) { await DB.remove(key, id); if (typeof callback === 'function') callback(); } }
function filterTable(searchId, tbodyId) { const input = document.getElementById(searchId).value.toLowerCase(); const rows = document.getElementById(tbodyId).getElementsByTagName('tr'); for (let row of rows) { row.style.display = row.innerText.toLowerCase().includes(input) ? '' : 'none'; } }

// INIT
function initApp() {
    document.getElementById('authScreen').classList.add('hidden');
    document.getElementById('appScreen').classList.remove('hidden');
    document.getElementById('userName').innerText = currentUser.name;
    document.getElementById('userRole').innerText = currentUser.role;
    document.getElementById('userAvatar').src = currentUser.avatar_url || AI_IMG;
    navigate('dashboard');
}
window.onload = async () => { if (await checkSession()) { initApp(); } };
</script>
