name = "guru-smart-ai"
main = "src/index.js"
compatibility_date = "2026-11-02"

# Frontend tetap berupa static assets; Worker menangani /api/* dan Cron.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[[d1_databases]]
binding = "DB"
database_name = "guru-smart-db"
database_id = "982fa034-55d5-4af3-b3d8-bf14580dd17e"

[triggers]
# Berjalan di Cloudflare setiap 15 menit, tidak bergantung pada PC pengguna.
crons = ["*/15 * * * *"]
