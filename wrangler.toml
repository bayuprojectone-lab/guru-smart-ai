name = "guru-smart-sibi-api"
main = "worker.js"
compatibility_date = "2026-11-01"

[vars]
# Ganti dengan origin GitHub Pages atau domain frontend Anda, tanpa garis miring di akhir.
# Contoh: ALLOWED_ORIGINS = "https://username.github.io,https://sekolahanda.id"
ALLOWED_ORIGINS = "*"

# Jangan masukkan OPENAI_API_KEY atau API_TOKEN di file ini.
# Tambahkan melalui: npx wrangler secret put OPENAI_API_KEY
# API_TOKEN tidak disarankan untuk frontend publik karena token di browser dapat terlihat.
